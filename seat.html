<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>山下丸 釣り座管理</title>
  <style>
    :root {
      --bg-base: #0b1220;
      --bg-surface: #131c2e;
      --bg-elevated: #1b273d;
      --border-subtle: #2a3a57;
      --border-strong: #3d5278;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-blue: #2563eb;
      --accent-blue-hover: #1d4ed8;
      --accent-cyan: #0891b2;
      --accent-amber: #d97706;
      --accent-green: #059669;
      --accent-red: #dc2626;
      --warn-bg: rgba(245, 158, 11, 0.16);
      --warn-border: #f59e0b;
      --warn-text: #fcd34d;

      /* 個別船アクセントカラー（深みを揃えた統一トーン） */
      --boat-all-bg: #131c2e;
      --boat-all-border: #3d5278;
      --boat-32-bg: #0f233c;
      --boat-32-border: #3b82f6;
      --boat-31-bg: #2a1420;
      --boat-31-border: #e11d48;
      --boat-27-bg: #0f2922;
      --boat-27-border: #10b981;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      line-height: 1.4;
      padding-bottom: 32px;
    }

    /* SVGアイコン共通 */
    .icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    /* ヘッダー（横一列・硬派でスッキリ） */
    header {
      background: linear-gradient(180deg, #162238 0%, #0f172a 100%);
      border-bottom: 1px solid var(--border-strong);
      padding: 10px 14px;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      max-width: 960px;
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-emblem {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #1e293b;
      border: 1px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #60a5fa;
      flex-shrink: 0;
    }

    .brand-title-wrap {
      display: flex;
      align-items: baseline;
      gap: 8px;
      white-space: nowrap;
      overflow: hidden;
    }

    .brand-name {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #ffffff;
    }

    .brand-sub {
      font-size: 0.85rem;
      font-weight: 600;
      color: #93c5fd;
      padding-left: 8px;
      border-left: 1px solid var(--border-strong);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-header {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-elevated);
      color: var(--text-main);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      padding: 7px 11px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-header:active {
      background: #273754;
    }

    /* メインコンテナ */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 12px 12px 24px;
    }

    /* 魚種タブ */
    .species-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      overflow-x: auto;
    }

    .species-tab {
      flex: 1;
      min-width: 96px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }

    .species-tab.active {
      background: #1e3a8a;
      border-color: #60a5fa;
      color: #ffffff;
    }

    .species-count {
      font-size: 0.75rem;
      background: rgba(15, 23, 42, 0.65);
      padding: 1px 6px;
      border-radius: 4px;
      color: #cbd5e1;
    }

    /* 予約一覧ボタン（船タブの1つ上に1本化配置） */
    .reservation-bar {
      margin-bottom: 10px;
    }

    .btn-reservation-main {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, #1d4ed8 0%, #1e40af 100%);
      border: 1px solid #60a5fa;
      color: #ffffff;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    .btn-reservation-main:active {
      filter: brightness(0.92);
    }

    .reservation-badge {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(147, 197, 253, 0.5);
      padding: 3px 10px;
      border-radius: 5px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #e0f2fe;
    }

    /* 船選択タブ（全体・32号船・31号船・27号船） */
    .boat-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      background: #090f1a;
      padding: 4px;
      border-radius: 8px 8px 0 0;
      border: 1px solid var(--border-subtle);
      border-bottom: none;
    }

    .boat-tab {
      background: var(--bg-surface);
      border: 1px solid transparent;
      color: var(--text-muted);
      border-radius: 6px;
      padding: 9px 4px;
      font-size: 0.84rem;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .boat-tab .boat-tab-sub {
      font-size: 0.72rem;
      font-weight: 600;
      opacity: 0.85;
    }

    .boat-tab.active[data-boat="all"] {
      background: #1e293b;
      border-color: #64748b;
      color: #ffffff;
    }
    .boat-tab.active[data-boat="32"] {
      background: #172e4d;
      border-color: var(--boat-32-border);
      color: #93c5fd;
    }
    .boat-tab.active[data-boat="31"] {
      background: #3b1829;
      border-color: var(--boat-31-border);
      color: #fda4af;
    }
    .boat-tab.active[data-boat="27"] {
      background: #13382e;
      border-color: var(--boat-27-border);
      color: #6ee7b7;
    }

    /* 現場操作ツールバー（よく使う操作のみに集約） */
    .ops-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg-surface);
      border-left: 1px solid var(--border-subtle);
      border-right: 1px solid var(--border-subtle);
      padding: 8px 10px;
      flex-wrap: wrap;
    }

    .mode-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-mode {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-mode.active-luggage {
      background: #164e63;
      border-color: #22d3ee;
      color: #cffafe;
      box-shadow: 0 0 0 1px #22d3ee;
    }

    .btn-mode.active-shop {
      background: #78350f;
      border-color: #f59e0b;
      color: #fef3c7;
      box-shadow: 0 0 0 1px #f59e0b;
    }

    .btn-undo {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #1e293b;
      border: 1px solid var(--border-strong);
      color: var(--text-main);
      border-radius: 6px;
      padding: 8px 11px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-undo:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* 選択中お客様バナー（右端は「閉じる」） */
    .selection-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #1e3a8a;
      border: 1px solid #60a5fa;
      border-radius: 6px;
      padding: 9px 12px;
      margin: 8px 0;
    }

    .selection-banner.visible {
      display: flex;
    }

    .selection-info {
      font-size: 0.88rem;
      font-weight: 700;
      color: #ffffff;
    }

    .selection-sub {
      font-size: 0.78rem;
      color: #bfdbfe;
      display: block;
      margin-top: 2px;
    }

    .btn-close-banner {
      background: #0f172a;
      border: 1px solid #93c5fd;
      color: #ffffff;
      border-radius: 5px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    /* 後続並び警告バナー */
    .order-warning-banner {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      color: var(--warn-text);
      border-radius: 6px;
      padding: 8px 12px;
      margin: 8px 0;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .order-warning-banner.visible {
      display: flex;
    }

    /* 座席表エリア（個別船の背景・縁取りを強化） */
    .deck-container {
      border-radius: 0 0 10px 10px;
      padding: 12px;
      border: 2px solid var(--boat-all-border);
      background: var(--boat-all-bg);
      transition: background-color 0.2s, border-color 0.2s;
    }

    .deck-container[data-view="32"] {
      background: var(--boat-32-bg);
      border: 2px solid var(--boat-32-border);
      box-shadow: inset 0 0 24px rgba(59, 130, 246, 0.14);
    }

    .deck-container[data-view="31"] {
      background: var(--boat-31-bg);
      border: 2px solid var(--boat-31-border);
      box-shadow: inset 0 0 24px rgba(225, 29, 72, 0.14);
    }

    .deck-container[data-view="27"] {
      background: var(--boat-27-bg);
      border: 2px solid var(--boat-27-border);
      box-shadow: inset 0 0 24px rgba(16, 185, 129, 0.14);
    }

    .boat-card {
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 14px;
      border: 2px solid var(--border-strong);
      background: rgba(11, 18, 32, 0.72);
    }

    .boat-card:last-child {
      margin-bottom: 0;
    }

    .boat-card[data-boat-id="32"] {
      background: rgba(15, 35, 60, 0.88);
      border-color: var(--boat-32-border);
    }

    .boat-card[data-boat-id="31"] {
      background: rgba(42, 20, 32, 0.88);
      border-color: var(--boat-31-border);
    }

    .boat-card[data-boat-id="27"] {
      background: rgba(15, 41, 34, 0.88);
      border-color: var(--boat-27-border);
    }

    .boat-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .boat-card-title {
      font-size: 1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .boat-pill {
      font-size: 0.74rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .boat-direction-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      padding: 0 4px;
    }

    .sides-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .side-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .side-header {
      text-align: center;
      font-size: 0.76rem;
      font-weight: 700;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.7);
      padding: 4px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* 座席セル */
    .seat-cell {
      background: #162033;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px 8px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      cursor: pointer;
      position: relative;
    }

    .seat-cell:active {
      transform: scale(0.99);
    }

    .seat-num {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-muted);
      min-width: 24px;
    }

    .seat-body {
      flex: 1;
      font-size: 0.84rem;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .seat-status-tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    /* 確定席 */
    .seat-cell.confirmed {
      background: #1e3a8a;
      border-color: #3b82f6;
      color: #ffffff;
    }
    .seat-cell.confirmed .seat-num {
      color: #93c5fd;
    }

    /* 荷物（■） */
    .seat-cell.luggage {
      background: #134e4a;
      border-color: #2dd4bf;
      color: #ccfbf1;
    }
    .seat-cell.luggage .seat-status-tag {
      background: #0f766e;
      color: #ffffff;
    }

    /* 店取り（●） */
    .seat-cell.shop {
      background: #78350f;
      border-color: #f59e0b;
      color: #fef3c7;
    }
    .seat-cell.shop .seat-status-tag {
      background: #b45309;
      color: #ffffff;
    }

    /* 案内候補（OK / 後続並び不可警告） */
    .seat-cell.candidate-ok {
      border: 2px solid #10b981;
      background: rgba(16, 185, 129, 0.14);
    }

    .seat-cell.candidate-warn {
      border: 2px solid #f59e0b;
      background: rgba(245, 158, 11, 0.18);
    }

    .candidate-hint {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .candidate-ok .candidate-hint {
      background: #065f46;
      color: #a7f3d0;
    }

    .candidate-warn .candidate-hint {
      background: #92400e;
      color: #fde68a;
    }

    /* モーダル共通 */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.82);
      z-index: 60;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    @media (min-width: 640px) {
      .modal-backdrop {
        align-items: center;
        padding: 16px;
      }
    }

    .modal-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 12px 12px 0 0;
      width: 100%;
      max-width: 640px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 640px) {
      .modal-panel {
        border-radius: 12px;
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #0f172a;
      border-bottom: 1px solid var(--border-subtle);
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-modal-close {
      background: #1e293b;
      border: 1px solid var(--border-strong);
      color: var(--text-main);
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-body {
      padding: 14px 16px;
      overflow-y: auto;
      flex: 1;
    }

    /* 予約一覧上部コントロール（残り自動確定ボタンをここに配置） */
    .res-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #0f172a;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .res-summary-text {
      font-size: 0.86rem;
      font-weight: 700;
      color: #e2e8f0;
    }

    .btn-auto-assign {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-green);
      border: 1px solid #34d399;
      color: #ffffff;
      border-radius: 6px;
      padding: 8px 13px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-auto-assign:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .res-sort-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }

    .sort-buttons {
      display: flex;
      gap: 6px;
    }

    .btn-sort {
      background: #1e293b;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      border-radius: 5px;
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-sort.active {
      background: #1e3a8a;
      border-color: #60a5fa;
      color: #ffffff;
    }

    /* 予約カード（「荷物済み」廃止・店取り強調） */
    .res-card {
      background: #162033;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }

    .res-card.has-shop {
      border-color: #f59e0b;
      background: rgba(120, 53, 15, 0.25);
    }

    .res-card.is-assigned {
      opacity: 0.65;
      border-color: #334155;
    }

    .res-card-main {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .res-name-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.94rem;
      font-weight: 800;
    }

    .res-count-badge {
      background: #1e3a8a;
      color: #bfdbfe;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.78rem;
    }

    .res-shop-badge {
      background: #b45309;
      color: #fef3c7;
      border: 1px solid #f59e0b;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.74rem;
      font-weight: 700;
    }

    .res-prev-badge {
      background: #334155;
      color: #cbd5e1;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.72rem;
    }

    .res-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .btn-select-res {
      background: var(--accent-blue);
      border: 1px solid #60a5fa;
      color: #ffffff;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
    }

    /* 設定画面のタブ分け */
    .settings-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }

    .settings-tab {
      background: #0f172a;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 8px 6px;
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }

    .settings-tab.active {
      background: #1e3a8a;
      border-color: #60a5fa;
      color: #ffffff;
    }

    .settings-pane {
      display: none;
    }

    .settings-pane.active {
      display: block;
    }

    .setting-box {
      background: #0f172a;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .setting-box h4 {
      margin: 0 0 8px;
      font-size: 0.88rem;
      color: #e2e8f0;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.84rem;

</head>

<div class="toast" id="toast"></div>

<script>
  // 初期データ構造
  const STORAGE_KEY = "yamashitamaru_seat_state_v2";

  function createInitialState() {
    const createSeats = (countPerSide) => {
      const left = [];
      const right = [];
      for (let i = 1; i <= countPerSide; i++) {
        left.push({ id: `L${i}`, side: "左舷", num: i, type: "empty", resId: null, label: "" });
        right.push({ id: `R${i}`, side: "右舷", num: i, type: "empty", resId: null, label: "" });
      }
      return { left, right };
    };

    return {
      activeSpecies: "カワハギ",
      activeBoat: "all", // "all" | "32" | "31" | "27"
      sortOrder: "desc",
      speciesList: ["カワハギ", "アジ", "アマダイ"],
      boats: [
        { id: "32", name: "32号船", species: "カワハギ", countPerSide: 10, seats: createSeats(10) },
        { id: "31", name: "31号船", species: "カワハギ", countPerSide: 9, seats: createSeats(9) },
        { id: "27", name: "27号船", species: "アジ", countPerSide: 8, seats: createSeats(8) }
      ],
      reservations: [
        { id: "r1", species: "カワハギ", name: "高橋", count: 4, isPrevDay: false },
        { id: "r2", species: "カワハギ", name: "鈴木", count: 3, isPrevDay: false },
        { id: "r3", species: "カワハギ", name: "田中", count: 2, isPrevDay: false },
        { id: "r4", species: "カワハギ", name: "山本", count: 2, isPrevDay: true },
        { id: "r5", species: "カワハギ", name: "伊藤", count: 1, isPrevDay: false },
        { id: "r6", species: "アジ", name: "渡辺", count: 3, isPrevDay: false },
        { id: "r7", species: "アジ", name: "中村", count: 2, isPrevDay: false }
      ],
      apiKey: ""
    };
  }

  let state = loadState();
  let undoStack = [];
  let toolMode = "none"; // "none" | "luggage" | "shop"
  let selectedResId = null;
  let longPressTimer = null;
  let longPressTriggered = false;

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return createInitialState();
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  function pushUndo() {
    undoStack.push(JSON.stringify({
      boats: state.boats,
      reservations: state.reservations
    }));
    if (undoStack.length > 30) undoStack.shift();
    updateUndoButton();
  }

  function updateUndoButton() {
    document.getElementById("btnUndo").disabled = undoStack.length === 0;
  }

  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove("show"), 2600);
  }

  // 魚種ごとの対象船
  function getBoatsForActiveSpecies() {
    return state.boats.filter(b => b.species === state.activeSpecies);
  }

  // 予約ごとの配置状況集計
  function getReservationStats(resId) {
    let confirmed = 0;
    let shop = 0;
    state.boats.forEach(b => {
      [...b.seats.left, ...b.seats.right].forEach(s => {
        if (s.resId === resId) {
          if (s.type === "confirmed") confirmed++;
          if (s.type === "shop") shop++;
        }
      });
    });
    return { confirmed, shop };
  }

  // 未配置の残り人数・組数
  function getUnassignedSummary(species) {
    const list = state.reservations.filter(r => r.species === species);
    let people = 0;
    let groups = 0;
    list.forEach(r => {
      const st = getReservationStats(r.id);
      const rem = Math.max(0, r.count - st.confirmed);
      if (rem > 0) {
        people += rem;
        groups++;
      }
    });
    return { people, groups };
  }

  // 後続の未配置グループが並んで座れるか判定
  function canFitRemainingGroups(simulatedBoats, targetResId, placedCount) {
    const remainingGroups = [];
    state.reservations
      .filter(r => r.species === state.activeSpecies)
      .forEach(r => {
        let already = 0;
        simulatedBoats.forEach(b => {
          [...b.seats.left, ...b.seats.right].forEach(s => {
            if (s.resId === r.id && (s.type === "confirmed" || s.type === "shop")) {
              already++;
            }
          });
        });
        const rem = Math.max(0, r.count - already);
        if (rem > 0) remainingGroups.push(rem);
      });

    if (remainingGroups.length === 0) return true;

    // 連続空きブロック抽出
    const blocks = [];
    simulatedBoats.forEach(b => {
      [b.seats.left, b.seats.right].forEach(arr => {
        let run = 0;
        arr.forEach(s => {
          if (s.type === "empty") {
            run++;
          } else {
            if (run > 0) blocks.push(run);
            run = 0;
          }
        });
        if (run > 0) blocks.push(run);
      });
    });

    remainingGroups.sort((a, b) => b - a);

    function backtrack(idx, currentBlocks) {
      if (idx >= remainingGroups.length) return true;
      const need = remainingGroups[idx];
      for (let i = 0; i < currentBlocks.length; i++) {
        if (currentBlocks[i] >= need) {
          const nextBlocks = [...currentBlocks];
          nextBlocks[i] -= need;
          if (backtrack(idx + 1, nextBlocks)) return true;
        }
      }
      return false;
    }

    return backtrack(0, blocks);
  }

  // 選択中グループを特定の席から並べて入れたときの評価
  function evaluateSeatPlacement(boatId, sideKey, startIndex) {
    if (!selectedResId) return null;
    const res = state.reservations.find(r => r.id === selectedResId);
    if (!res) return null;
    const st = getReservationStats(res.id);
    const need = Math.max(0, res.count - st.confirmed);
    if (need === 0) return null;

    const boat = state.boats.find(b => b.id === boatId);
    const arr = boat.seats[sideKey];
    if (startIndex + need > arr.length) return { valid: false };

    // 対象席が空席または同一予約の店取り席であること
    for (let i = 0; i < need; i++) {
      const seat = arr[startIndex + i];
      const ok = seat.type === "empty" || (seat.type === "shop" && seat.resId === res.id);
      if (!ok) return { valid: false };
    }

    // シミュレーション
    const simBoats = JSON.parse(JSON.stringify(getBoatsForActiveSpecies()));
    const simBoat = simBoats.find(b => b.id === boatId);
    const simArr = simBoat.seats[sideKey];
    for (let i = 0; i < need; i++) {
      simArr[startIndex + i].type = "confirmed";
      simArr[startIndex + i].resId = res.id;
      simArr[startIndex + i].label = res.name;
    }

    const fitsAll = canFitRemainingGroups(simBoats, res.id, need);
    return { valid: true, fitsAll, need };
  }

  // 画面全体レンダリング
  function renderAll() {
    renderSpeciesTabs();
    renderBoatTabs();
    renderToolbarAndBanners();
    renderDeck();
    updateUndoButton();
    saveState();
  }

  function renderSpeciesTabs() {
    const container = document.getElementById("speciesTabs");
    container.innerHTML = "";
    state.speciesList.forEach(sp => {
      const totalPeople = state.reservations
        .filter(r => r.species === sp)
        .reduce((sum, r) => sum + r.count, 0);
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "species-tab" + (state.activeSpecies === sp ? " active" : "");
      btn.innerHTML = `<span>${sp}</span><span class="species-count">${totalPeople}名</span>`;
      btn.onclick = () => {
        state.activeSpecies = sp;
        const boats = getBoatsForActiveSpecies();
        if (state.activeBoat !== "all" && !boats.some(b => b.id === state.activeBoat)) {
          state.activeBoat = "all";
        }
        selectedResId = null;
        renderAll();
      };
      container.appendChild(btn);
    });
  }

  function renderBoatTabs() {
    const container = document.getElementById("boatTabs");
    container.innerHTML = "";
    const boats = getBoatsForActiveSpecies();

    const makeTab = (id, title, sub) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "boat-tab" + (state.activeBoat === id ? " active" : "");
      btn.dataset.boat = id;
      btn.innerHTML = `<span>${title}</span><span class="boat-tab-sub">${sub}</span>`;
      btn.onclick = () => {
        state.activeBoat = id;
        renderAll();
      };
      return btn;
    };

    const totalAssigned = boats.reduce((acc, b) => {
      return acc + [...b.seats.left, ...b.seats.right].filter(s => s.type === "confirmed").length;
    }, 0);
    container.appendChild(makeTab("all", "全体", `確定 ${totalAssigned}名`));

    ["32", "31", "27"].forEach(id => {
      const boat = state.boats.find(b => b.id === id);
      if (!boat) return;
      const confirmed = [...boat.seats.left, ...boat.seats.right].filter(s => s.type === "confirmed").length;
      const cap = boat.countPerSide * 2;
      container.appendChild(makeTab(id, boat.name, `${confirmed}/${cap}席`));
    });
  }

  function renderToolbarAndBanners() {
    const sum = getUnassignedSummary(state.activeSpecies);
    document.getElementById("headerUnassignedBadge").textContent = `未配置 ${sum.people}名 / ${sum.groups}組`;
    document.getElementById("modalUnassignedSummary").textContent = `未配置 ${sum.people}名 / ${sum.groups}組`;

    const btnLug = document.getElementById("btnModeLuggage");
    const btnShop = document.getElementById("btnModeShop");
    btnLug.className = "btn-mode" + (toolMode === "luggage" ? " active-luggage" : "");
    btnShop.className = "btn-mode" + (toolMode === "shop" ? " active-shop" : "");

    const banner = document.getElementById("selectionBanner");
    const warnBanner = document.getElementById("orderWarningBanner");

    if (selectedResId) {
      const res = state.reservations.find(r => r.id === selectedResId);
      if (res) {
        const st = getReservationStats(res.id);
        const rem = Math.max(0, res.count - st.confirmed);
        banner.classList.add("visible");
        document.getElementById("selectionInfoText").textContent =
          `選択中：${res.name} 様（計${res.count}名 / 残り${rem}名）`;
        document.getElementById("selectionSubText").textContent =
          toolMode === "shop"
            ? `● 店取りモード：最大${res.count}席まで指定可能（現在${st.shop}席）`
            : "空き席をタップして並び配置します";
      } else {
        selectedResId = null;
        banner.classList.remove("visible");
      }
    } else {
      banner.classList.remove("visible");
      warnBanner.classList.remove("visible");
    }
  }

  function renderDeck() {
    const deck = document.getElementById("deckContainer");
    deck.dataset.view = state.activeBoat;
    deck.innerHTML = "";

    let targetBoats = [];
    if (state.activeBoat === "all") {
      targetBoats = getBoatsForActiveSpecies();
    } else {
      const b = state.boats.find(x => x.id === state.activeBoat);
      if (b) targetBoats = [b];
    }

    if (targetBoats.length === 0) {
      deck.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:0.86rem;">対象の船がありません</div>`;
      return;
    }

    let hasAnyOrderWarning = false;

    targetBoats.forEach(boat => {
      const card = document.createElement("div");
      card.className = "boat-card";
      card.dataset.boatId = boat.id;

      const confirmedCount = [...boat.seats.left, ...boat.seats.right].filter(s => s.type === "confirmed").length;
      const shopCount = [...boat.seats.left, ...boat.seats.right].filter(s => s.type === "shop").length;

      card.innerHTML = `
        <div class="boat-card-header">
          <div class="boat-card-title">
            <span>${boat.name}</span>
            <span class="boat-pill">${boat.species}</span>
          </div>
          <div style="font-size:0.78rem;color:#cbd5e1;">
            確定 ${confirmedCount} / 店取り ${shopCount}
          </div>
        </div>
        <div class="boat-direction-labels">
          <span>▲ ミヨシ（船首）</span>
          <span>▼ トモ（船尾）</span>
        </div>
      `;

      const grid = document.createElement("div");
      grid.className = "sides-grid";

      ["left", "right"].forEach(sideKey => {
        const col = document.createElement("div");
        col.className = "side-col";
        const sideLabel = sideKey === "left" ? "左舷" : "右舷";
        col.innerHTML = `<div class="side-header">${sideLabel}</div>`;

        boat.seats[sideKey].forEach((seat, idx) => {
          const cell = document.createElement("div");
          cell.className = "seat-cell";

          if (seat.type === "confirmed") {
            cell.classList.add("confirmed");
          } else if (seat.type === "luggage") {
            cell.classList.add("luggage");
          } else if (seat.type === "shop") {
            cell.classList.add("shop");
          }

          let candidateBadge = "";
          if (selectedResId && toolMode === "none") {
            const evalRes = evaluateSeatPlacement(boat.id, sideKey, idx);
            if (evalRes && evalRes.valid) {
              if (evalRes.fitsAll) {
                cell.classList.add("candidate-ok");
                candidateBadge = `<span class="candidate-hint">案内OK</span>`;
              } else {
                cell.classList.add("candidate-warn");
                candidateBadge = `<span class="candidate-hint">後続並び不可</span>`;
                hasAnyOrderWarning = true;
              }
            }
          }

          let bodyText = "空席";
          let statusTag = "";
          if (seat.type === "confirmed") {
            bodyText = `${seat.label} 様`;
          } else if (seat.type === "luggage") {
            bodyText = "荷物あり";
            statusTag = `<span class="seat-status-tag">■ 荷物</span>`;
          } else if (seat.type === "shop") {
            bodyText = seat.label ? `${seat.label} 様` : "店取り枠";
            statusTag = `<span class="seat-status-tag">● 店取り</span>`;
          }

          cell.innerHTML = `
            <span class="seat-num">${idx + 1}</span>
            <span class="seat-body">${bodyText}</span>
            ${candidateBadge || statusTag}
          `;

          attachSeatEvents(cell, boat.id, sideKey, idx);
          col.appendChild(cell);
        });

        grid.appendChild(col);
      });

      card.appendChild(grid);
      deck.appendChild(card);
    });

    const warnBanner = document.getElementById("orderWarningBanner");
    if (selectedResId && toolMode === "none" && hasAnyOrderWarning) {
      warnBanner.classList.add("visible");
    } else {
      warnBanner.classList.remove("visible");
    }
  }

  // 座席のタップ＆長押しイベント
  function attachSeatEvents(cell, boatId, sideKey, idx) {
    const startPress = () => {
      longPressTriggered = false;
      const boat = state.boats.find(b => b.id === boatId);
      const seat = boat.seats[sideKey][idx];

      // 店取り席の長押し判定
      if (seat.type === "shop") {
        longPressTimer = setTimeout(() => {
          longPressTriggered = true;
          if (!seat.label || !seat.resId) {
            // 名前なしの店取り席の長押しは無反応
            return;
          }
          if (confirm(`${seat.label} 様の席で確定していいですか？`)) {
            pushUndo();
            seat.type = "confirmed";
            showToast(`${seat.label} 様の席を確定しました`);
            renderAll();
          }
        }, 600);
      }
    };

    const cancelPress = () => {
      clearTimeout(longPressTimer);
    };

    cell.addEventListener("pointerdown", startPress);
    cell.addEventListener("pointerup", cancelPress);
    cell.addEventListener("pointerleave", cancelPress);
    cell.addEventListener("pointercancel", cancelPress);

    cell.addEventListener("click", () => {
      if (longPressTriggered) {
        longPressTriggered = false;
        return;
      }
      handleSeatTap(boatId, sideKey, idx);
    });
  }

  function handleSeatTap(boatId, sideKey, idx) {
    const boat = state.boats.find(b => b.id === boatId);
    const seat = boat.seats[sideKey][idx];

    // 1. 荷物モード（■ 荷物：人数・タップ制限なし）
    if (toolMode === "luggage") {
      if (seat.type === "confirmed") {
        showToast("確定済みの席には荷物を置けません");
        return;
      }
      pushUndo();
      if (seat.type === "luggage") {
        seat.type = "empty";
        seat.resId = null;
        seat.label = "";
      } else {
        seat.type = "luggage";
        seat.resId = null;
        seat.label = "";
      }
      renderAll();
      return;
    }

    // 2. 店取りモード（● 店取り：選択中グループの人数分に上限を制限）
    if (toolMode === "shop") {
      if (seat.type === "confirmed") {
        showToast("確定済みの席は変更できません");
        return;
      }
      if (seat.type === "shop") {
        pushUndo();
        seat.type = "empty";
        seat.resId = null;
        seat.label = "";
        renderAll();
        return;
      }
      if (selectedResId) {
        const res = state.reservations.find(r => r.id === selectedResId);
        const st = getReservationStats(res.id);
        if (st.shop >= res.count) {
          showToast(`${res.name} 様の店取りは上限（${res.count}席）に達しています`);
          return;
        }
        pushUndo();
        seat.type = "shop";
        seat.resId = res.id;
        seat.label = res.name;
        renderAll();
      } else {
        pushUndo();
        seat.type = "shop";
        seat.resId = null;
        seat.label = "";
        renderAll();
      }
      return;
    }

    // 3. 通常モードでお客様を選択中の場合（並び配置）
    if (selectedResId) {
      const evalRes = evaluateSeatPlacement(boatId, sideKey, idx);
      if (!evalRes || !evalRes.valid) {
        showToast("ここには連続して人数分入りません");
        return;
      }
      if (!evalRes.fitsAll) {
        if (!confirm("この配置だと後続グループが並んで座れません。このまま案内しますか？")) {
          return;
        }
      }
      const res = state.reservations.find(r => r.id === selectedResId);
      pushUndo();
      const arr = boat.seats[sideKey];
      for (let i = 0; i < evalRes.need; i++) {
        arr[idx + i].type = "confirmed";
        arr[idx + i].resId = res.id;
        arr[idx + i].label = res.name;
      }
      showToast(`${res.name} 様（${evalRes.need}名）を案内しました`);
      selectedResId = null;
      renderAll();
      return;
    }

    // 4. 通常モード・未選択時：確定席の解除確認
    if (seat.type === "confirmed") {
      if (confirm(`${seat.label} 様の確定を解除しますか？`)) {
        pushUndo();
        seat.type = "empty";
        seat.resId = null;
        seat.label = "";
        renderAll();
      }
    }
  }

  // 予約一覧レンダリング（「荷物済み」廃止・店取り表示・前日場所取は末尾）
  function renderReservationList() {
    const container = document.getElementById("reservationListContainer");
    container.innerHTML = "";

    const list = state.reservations
      .filter(r => r.species === state.activeSpecies)
      .slice()
      .sort((a, b) => {
        // 前日場所取は人数順の一番後ろに配置
        if (a.isPrevDay !== b.isPrevDay) {
          return a.isPrevDay ? 1 : -1;
        }
        return state.sortOrder === "desc" ? b.count - a.count : a.count - b.count;
      });

    if (list.length === 0) {
      container.innerHTML = `<div style="text-align:center;padding:20px;color:var(--text-muted);">予約データがありません</div>`;
      return;
    }

    list.forEach(res => {
      const st = getReservationStats(res.id);
      const rem = Math.max(0, res.count - st.confirmed);
      const isDone = rem === 0;

      const card = document.createElement("div");
      card.className = "res-card" + (st.shop > 0 ? " has-shop" : "") + (isDone ? " is-assigned" : "");

      const shopBadge = st.shop > 0 ? `<span class="res-shop-badge">● 店取り ${st.shop}席</span>` : "";
      const prevBadge = res.isPrevDay ? `<span class="res-prev-badge">前日場所取</span>` : "";
      const statusText = isDone ? "配置完了" : `未配置 ${rem}名`;

      card.innerHTML = `
        <div class="res-card-main">
          <div class="res-name-line">
            <span>${res.name} 様</span>
            <span class="res-count-badge">${res.count}名</span>
            ${shopBadge}
            ${prevBadge}
          </div>
          <div class="res-meta">${statusText}</div>
        </div>
        <button type="button" class="btn-select-res">${isDone ? "再選択" : "席を選ぶ"}</button>
      `;

      card.onclick = () => {
        selectedResId = res.id;
        toolMode = "none";
        document.getElementById("reservationModal").classList.remove("open");
        renderAll();
      };

      container.appendChild(card);
    });
  }

  // 残り自動確定処理
  function runAutoAssign() {
    const sum = getUnassignedSummary(state.activeSpecies);
    if (sum.people === 0) {
      showToast("未配置のお客様はいません");
      return;
    }

    const boats = getBoatsForActiveSpecies();
    let emptySeats = 0;
    let protectedSeats = 0;
    boats.forEach(b => {
      [...b.seats.left, ...b.seats.right].forEach(s => {
        if (s.type === "empty") emptySeats++;
        if (s.type === "luggage" || s.type === "shop") protectedSeats++;
      });
    });

    if (emptySeats < sum.people) {
      alert(`空き席が不足しています（未配置 ${sum.people}名 / 空き ${emptySeats}席 / 保護中の荷物・店取り ${protectedSeats}席）`);
      return;
    }

    if (!confirm(`未配置残り ${sum.groups}組（計${sum.people}名）を空いている席へ自動振り分けしますか？（※「■ 荷物」「● 店取り」は保護されます）`)) {
      return;
    }

    pushUndo();

    const targets = state.reservations
      .filter(r => r.species === state.activeSpecies)
      .map(r => {
        const st = getReservationStats(r.id);
        return { res: r, rem: Math.max(0, r.count - st.confirmed) };
      })
      .filter(x => x.rem > 0)
      .sort((a, b) => b.rem - a.rem);

    let splitGroups = 0;

    targets.forEach(item => {
      let placed = false;
      // まず連番で入る場所を探す
      for (const b of boats) {
        for (const sideKey of ["left", "right"]) {
          const arr = b.seats[sideKey];
          for (let i = 0; i <= arr.length - item.rem; i++) {
            let ok = true;
            for (let k = 0; k < item.rem; k++) {
              if (arr[i + k].type !== "empty") {
                ok = false;
                break;
              }
            }
            if (ok) {
              for (let k = 0; k < item.rem; k++) {
                arr[i + k].type = "confirmed";
                arr[i + k].resId = item.res.id;
                arr[i + k].label = item.res.name;
              }
              placed = true;
              break;
            }
          }
          if (placed) break;
        }
        if (placed) break;
      }

      // 連番がなければ空席へ分割配置
      if (!placed) {
        let leftToPlace = item.rem;
        splitGroups++;
        for (const b of boats) {
          for (const sideKey of ["left", "right"]) {
            for (const s of b.seats[sideKey]) {
              if (leftToPlace > 0 && s.type === "empty") {
                s.type = "confirmed";
                s.resId = item.res.id;
                s.label = item.res.name;
                leftToPlace--;
              }
            }
          }
        }
      }
    });

    document.getElementById("reservationModal").classList.remove("open");
    renderAll();
    if (splitGroups > 0) {
      showToast(`連番空き不足のため ${splitGroups}組が分かれて確定しました`);
    } else {
      showToast("残りのグループをすべて自動確定しました");
    }
  }

  // 設定画面の席数調整UI
  function renderBoatSeatAdjustList() {
    const container = document.getElementById("boatSeatAdjustList");
    container.innerHTML = "";
    state.boats.forEach(b => {
      const row = document.createElement("div");
      row.className = "setting-row";
      row.innerHTML = `
        <span>${b.name}（${b.species}）：片舷 ${b.countPerSide}席</span>
        <div style="display:flex;gap:6px;">
          <button type="button" class="btn-setting-action" data-act="minus">－</button>
          <button type="button" class="btn-setting-action" data-act="plus">＋</button>
        </div>
      `;
      row.querySelector('[data-act="minus"]').onclick = () => {
        if (b.countPerSide <= 4) return;
        pushUndo();
        b.countPerSide--;
        b.seats.left.pop();
        b.seats.right.pop();
        renderBoatSeatAdjustList();
        renderAll();
      };
      row.querySelector('[data-act="plus"]').onclick = () => {
        if (b.countPerSide >= 16) return;
        pushUndo();
        b.countPerSide++;
        const n = b.countPerSide;
        b.seats.left.push({ id: `L${n}`, side: "左舷", num: n, type: "empty", resId: null, label: "" });
        b.seats.right.push({ id: `R${n}`, side: "右舷", num: n, type: "empty", resId: null, label: "" });
        renderBoatSeatAdjustList();
        renderAll();
      };
      container.appendChild(row);
    });
  }

  // イベントバインド
  document.getElementById("btnModeLuggage").onclick = () => {
    toolMode = toolMode === "luggage" ? "none" : "luggage";
    renderAll();
  };

  document.getElementById("btnModeShop").onclick = () => {
    toolMode = toolMode === "shop" ? "none" : "shop";
    renderAll();
  };

  document.getElementById("btnUndo").onclick = () => {
    if (undoStack.length === 0) return;
    const prev = JSON.parse(undoStack.pop());
    state.boats = prev.boats;
    state.reservations = prev.reservations;
    showToast("1つ前の状態に戻しました");
    renderAll();
  };

  document.getElementById("closeSelectionBtn").onclick = () => {
    selectedResId = null;
    toolMode = "none";
    renderAll();
  };

  document.getElementById("openReservationBtn").onclick = () => {
    renderReservationList();
    document.getElementById("reservationModal").classList.add("open");
  };

  document.getElementById("closeReservationModal").onclick = () => {
    document.getElementById("reservationModal").classList.remove("open");
  };

  document.querySelectorAll(".btn-sort").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".btn-sort").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.sortOrder = btn.dataset.sort;
      renderReservationList();
    };
  });

  document.getElementById("btnAutoAssign").onclick = runAutoAssign;

  document.getElementById("openSettingsBtn").onclick = () => {
    document.getElementById("apiKeyInput").value = state.apiKey || "";
    renderBoatSeatAdjustList();
    document.getElementById("settingsModal").classList.add("open");
  };

  document.getElementById("closeSettingsModal").onclick = () => {
    document.getElementById("settingsModal").classList.remove("open");
  };

  document.querySelectorAll(".settings-tab").forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll(".settings-tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".settings-pane").forEach(p => p.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById(`pane-${tab.dataset.tab}`).classList.add("active");
    };
  });

  document.getElementById("addResManualBtn").onclick = () => {
    const name = document.getElementById("newResName").value.trim();
    const count = parseInt(document.getElementById("newResCount").value, 10) || 1;
    const isPrevDay = document.getElementById("newResPrev").checked;
    if (!name) {
      showToast("お客様名を入力してください");
      return;
    }
    pushUndo();
    state.reservations.push({
      id: "r_" + Date.now(),
      species: state.activeSpecies,
      name,
      count,
      isPrevDay
    });
    document.getElementById("newResName").value = "";
    document.getElementById("newResPrev").checked = false;
    showToast(`${name} 様（${count}名）を追加しました`);
    renderAll();
  };

  document.getElementById("saveApiKeyBtn").onclick = () => {
    state.apiKey = document.getElementById("apiKeyInput").value.trim();
    saveState();
    showToast("APIキーを保存しました");
  };

  document.getElementById("exportCatchLinkBtn").onclick = () => {
    const b32 = state.boats.find(b => b.id === "32");
    const lines = ["【32号船 釣り座確定リスト】"];
    ["left", "right"].forEach(sideKey => {
      const label = sideKey === "left" ? "左舷" : "右舷";
      b32.seats[sideKey].forEach((s, i) => {
        if (s.type === "confirmed") {
          lines.push(`${label}${i + 1}番: ${s.label} 様`);
        }
      });
    });
    navigator.clipboard?.writeText(lines.join("\n"));
    showToast("32号船の確定リストをコピーしました");
  };

  document.getElementById("clearSeatsOnlyBtn").onclick = () => {
    if (!confirm("すべての座席配置（確定・荷物・店取り）をクリアしますか？")) return;
    pushUndo();
    state.boats.forEach(b => {
      [...b.seats.left, ...b.seats.right].forEach(s => {
        s.type = "empty";
        s.resId = null;
        s.label = "";
      });
    });
    selectedResId = null;
    renderAll();
    showToast("座席配置をクリアしました");
  };

  document.getElementById("resetAllDemoBtn").onclick = () => {
    if (!confirm("初期状態に全リセットしますか？")) return;
    state = createInitialState();
    undoStack = [];
    selectedResId = null;
    toolMode = "none";
    renderAll();
    document.getElementById("settingsModal").classList.remove("open");
    showToast("初期状態にリセットしました");
  };

  document.getElementById("photoInput").addEventListener("change", (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    showToast(`画像「${file.name}」を選択しました（設定のAPIキー連携で読込可能）`);
    e.target.value = "";
  });

  // 初期描画
  renderAll();
</script>
</body>
</html>
