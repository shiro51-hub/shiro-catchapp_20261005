<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b1120" />
  <title>山下丸 釣り座管理</title>
  <style>
    :root {
      --bg: #0b1120; --card: #131c31; --panel: #1a253c; --inp: #0f172a;
      --bd: #2c3e5e; --tx: #f1f5f9; --sub: #94a3b8;
      --blue: #2563eb; --blue-bg: #172e66;
      --green: #10b981; --green-bg: #064e3b;
      /* 荷物（四角■）用：シアン・青緑系 */
      --bag-bd: #06b6d4; --bag-bg: #083344; --bag-tx: #67e8f9;
      /* 店取り（丸●）用：オレンジ・アンバー系 */
      --shop-bd: #f59e0b; --shop-bg: #451a03; --shop-tx: #fcd34d;
      --red: #ef4444;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; overflow-x: hidden;
      background: var(--bg); color: var(--tx);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 18px; line-height: 1.45;
      transition: background-color 0.2s ease;
    }
    body { padding-bottom: 48px; }

    /* 船ごとのデッキカラーテーマ（画面全体の背景トーン） */
    body.theme-32 { background: #08243e; }
    body.theme-31 { background: #331124; }
    body.theme-27, body.theme-25 { background: #102a18; }

    /* ヘッダー（2段構成＋右上メニュー開閉ボタン） */
    header {
      position: sticky; top: 0; z-index: 50; background: #070b14;
      border-bottom: 1px solid var(--bd); padding: 8px 10px 9px;
    }
    .h-top {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      white-space: nowrap;
    }
    .h-brand {
      display: flex; align-items: center; gap: 7px; min-width: 0;
    }
    .h-icon { font-size: 22px; line-height: 1; }
    .h-ship { font-size: 20px; font-weight: 900; color: #ffffff; letter-spacing: 0.04em; }
    .h-sub {
      font-size: 14px; font-weight: 800; color: #38bdf8;
      background: #0f172a; border: 1px solid var(--bd); padding: 2px 8px; border-radius: 6px;
    }
    .menu-toggle-btn {
      padding: 7px 11px; font-size: 14px; font-weight: 800;
      border-radius: 8px; border: 1px solid #38bdf8;
      background: #0f172a; color: #e0f2fe; flex-shrink: 0;
    }
    .menu-toggle-btn.collapsed {
      background: #064e3b; border-color: #10b981; color: #6ee7b7;
    }

    /* 2段目操作ボタン群：左＝読込、中＝設定、右＝予約一覧 */
    .h-btns {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%;
      margin-top: 8px;
    }
    .h-btns button {
      width: 100%; padding: 11px 4px; font-size: 16px; font-weight: 800;
    }

    button {
      background: var(--panel); color: var(--tx); border: 1px solid var(--bd);
      border-radius: 9px; padding: 10px 11px; font-size: 15px; font-weight: 700;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      touch-action: manipulation; font-family: inherit;
    }
    button:active { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: var(--blue); border-color: #3b82f6; color: #fff; }
    button.success { background: #059669; border-color: var(--green); color: #fff; }
    button.warning { background: #d97706; border-color: var(--shop-bd); color: #fff; }
    button.danger { background: #b91c1c; border-color: var(--red); color: #fff; }

    .container { padding: 10px; width: 100%; max-width: 560px; margin: 0 auto; }

    /* ステップカード（①読取確認 / ②配船指定） */
    .step-card { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .step-badge { display: inline-block; font-size: 13px; font-weight: 800; background: var(--blue-bg); color: #93c5fd; border: 1px solid #3b82f6; padding: 2px 8px; border-radius: 6px; margin-bottom: 6px; }
    .w-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .w-sub { font-size: 14px; color: var(--sub); margin-bottom: 12px; }

    /* 未読込時の案内ボックス */
    .empty-ocr-box {
      background: linear-gradient(135deg, #0f172a, #172554);
      border: 2px dashed #3b82f6; border-radius: 14px;
      padding: 28px 16px; text-align: center; margin: 8px 0 12px;
    }
    .empty-ocr-msg { font-size: 21px; font-weight: 900; color: #ffffff; margin-bottom: 8px; }
    .empty-ocr-sub { font-size: 14px; color: #cbd5e1; margin-bottom: 18px; }

    /* 読取確認リスト */
    .verify-summary {
      background: var(--inp); border: 2px solid #3b82f6; border-radius: 10px;
      padding: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
    }
    .verify-row {
      background: var(--inp); border: 1px solid var(--bd); border-radius: 10px;
      padding: 10px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .verify-info { flex: 1; min-width: 0; }
    .verify-name { font-size: 18px; font-weight: 800; color: #fff; }
    .verify-note { font-size: 13px; color: #fcd34d; margin-top: 2px; }
    .verify-ctrl { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .verify-ctrl button { padding: 6px 11px; font-size: 16px; }

    /* 配船指定 */
    .match-box {
      border-radius: 10px; padding: 11px 12px; margin-bottom: 12px; font-size: 15px; font-weight: 800;
      border: 2px solid var(--bd); background: var(--inp);
    }
    .match-box.ok { border-color: var(--green); background: var(--green-bg); color: #6ee7b7; }
    .match-box.warn { border-color: var(--shop-bd); background: var(--shop-bg); color: #fcd34d; }
    .boat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .b-pick {
      width: 100%; padding: 14px 6px; border-radius: 10px; border: 2px solid var(--bd);
      background: var(--inp); color: var(--sub); font-size: 17px; font-weight: 800;
    }
    .b-pick.on { background: var(--blue-bg); border-color: #3b82f6; color: #fff; }
    .w-boat-row {
      background: var(--inp); border: 1px solid var(--bd); border-radius: 10px;
      padding: 11px; margin-bottom: 10px;
    }
    .w-boat-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 18px; font-weight: 800; }
    .w-caps { display: flex; gap: 8px; }
    .w-cap-box { flex: 1; background: var(--card); padding: 8px; border-radius: 8px; text-align: center; }
    .w-cap-ctrl { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 4px; }
    .w-cap-ctrl button { padding: 7px 13px; font-size: 20px; }
    .cap-num-inp {
      width: 54px !important; text-align: center; font-size: 20px !important; font-weight: 900;
      padding: 6px 2px !important; background: #070b14 !important; border: 1px solid #3b82f6 !important; color: #fff !important;
    }

    /* 選択中ガイドバー（バラバラ配置カスタム切替付き） */
    .selected-banner {
      position: sticky; top: 96px; z-index: 40;
      background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
      border: 2px solid #60a5fa; border-radius: 12px; padding: 11px 12px;
      margin-bottom: 12px; color: #fff;
      display: flex; flex-direction: column; gap: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.65);
    }
    .selected-banner-top {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .selected-banner-info { font-size: 17px; font-weight: 800; line-height: 1.35; }
    .selected-banner-sub { font-size: 13px; color: #dbeafe; font-weight: 600; }
    .custom-split-btn {
      width: 100%; padding: 9px 10px; font-size: 14px; font-weight: 800;
      border-radius: 8px; border: 2px solid #93c5fd;
      background: rgba(15, 23, 42, 0.7); color: #e0f2fe;
    }
    .custom-split-btn.on {
      background: #7c2d12; border-color: #fb923c; color: #ffedd5;
    }

    /* 操作バー（荷物■ / 店取り● の半分幅2分割 ＋ 1つ前に戻す＆残り自動確定） */
    .mode-bar {
      display: flex; flex-direction: column; padding: 8px 10px;
      background: var(--card); border-bottom: 1px solid var(--bd); gap: 7px;
    }
    .mark-split {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%;
    }
    .action-split {
      display: grid; grid-template-columns: 1fr 1.45fr; gap: 8px; width: 100%;
    }
    .bag-btn {
      padding: 11px 6px; font-size: 15px; font-weight: 800;
      border: 2px solid var(--bd); background: var(--inp); color: var(--sub);
    }
    .bag-btn.on {
      background: var(--bag-bg); border-color: var(--bag-bd); color: var(--bag-tx);
      box-shadow: 0 0 0 1px var(--bag-bd) inset;
    }
    .shop-btn {
      padding: 11px 6px; font-size: 15px; font-weight: 800;
      border: 2px solid var(--bd); background: var(--inp); color: var(--sub);
    }
    .shop-btn.on {
      background: var(--shop-bg); border-color: var(--shop-bd); color: var(--shop-tx);
      box-shadow: 0 0 0 1px var(--shop-bd) inset;
    }
    .undo-btn {
      padding: 11px 6px; font-size: 14px; font-weight: 800;
      background: #1e293b; border: 1px solid #64748b; color: #f8fafc;
    }

    /* 常時表示の船タブ（エリアサイズは維持しつつ、船名のフォントサイズを最大化） */
    .tabs {
      display: flex; overflow-x: auto; background: #0d1526;
      border-bottom: 1px solid var(--bd); padding: 5px 8px; gap: 6px;
    }
    .tab {
      flex: 1; min-width: 82px; padding: 7px 3px; border-radius: 8px;
      background: var(--card); border: 1px solid var(--bd); text-align: center;
      color: var(--sub); flex-direction: column; line-height: 1.15;
    }
    .tab-ship-label {
      font-size: 19px; font-weight: 900; letter-spacing: -0.02em; display: block;
    }
    .tab-emp-label {
      font-size: 12px; font-weight: 700; display: block; margin-top: 1px;
    }
    .tab.active { background: var(--blue); border-color: #60a5fa; color: #fff; }
    .tab.active.t-32 { background: #0284c7; border-color: #7dd3fc; color: #fff; }
    .tab.active.t-31 { background: #db2777; border-color: #f9a8d4; color: #fff; }
    .tab.active.t-27, .tab.active.t-25 { background: #16a34a; border-color: #86efac; color: #fff; }

    /* 船タブ直下の大きな「📋 予約一覧」常設ボタン */
    .quick-guest-bar {
      padding: 7px 10px; background: rgba(7, 11, 20, 0.72);
      border-bottom: 1px solid var(--bd);
    }
    .quick-guest-btn {
      width: 100%; padding: 13px 12px; font-size: 18px; font-weight: 900;
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      border: 2px solid #60a5fa; color: #ffffff; border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    /* 全体俯瞰（船ごとのデッキ色を枠・見出しに反映） */
    .ov-card {
      background: rgba(19, 28, 49, 0.92); border: 2px solid var(--bd);
      border-radius: 12px; padding: 12px; margin-bottom: 14px;
    }
    .ov-card.card-32 { background: rgba(11, 45, 78, 0.88); border-color: #38bdf8; }
    .ov-card.card-31 { background: rgba(66, 22, 47, 0.88); border-color: #f472b6; }
    .ov-card.card-27, .ov-card.card-25 { background: rgba(19, 54, 30, 0.88); border-color: #4ade80; }

    .ov-head {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.16);
    }
    .mini-hull { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mini-seat {
      width: 100%; height: 48px; border-radius: 8px; background: var(--inp); border: 2px solid #263552;
      display: flex; align-items: center; justify-content: space-between; padding: 0 8px;
      font-size: 14px; font-weight: 800; color: var(--sub); margin-bottom: 6px;
    }
    .mini-seat.bag { background: var(--bag-bg); border-color: var(--bag-bd); color: var(--bag-tx); }
    .mini-seat.shop { background: var(--shop-bg); border-color: var(--shop-bd); color: var(--shop-tx); }
    .mini-seat.assigned { background: var(--blue-bg); border-color: #3b82f6; color: #ffffff; }
    .mini-seat.fit-ok { background: var(--green-bg); border-color: var(--green); color: #6ee7b7; }
    .mini-seat.fit-warn { background: #3f3208; border-color: #eab308; color: #fde047; }

    /* 1隻詳細＋場所指定の席増減バー */
    .seat-edit-toggle {
      width: 100%; margin-top: 8px; padding: 9px; font-size: 14px; font-weight: 800;
      background: #0f172a; border: 1px solid #38bdf8; color: #bae6fd;
    }
    .seat-edit-toggle.on {
      background: #1e3a8a; border-color: #60a5fa; color: #fff;
    }
    .insert-slot-btn {
      width: 100%; padding: 5px 4px; margin-bottom: 6px; font-size: 12px; font-weight: 800;
      background: #064e3b; border: 1px dashed #34d399; color: #a7f3d0; border-radius: 6px;
    }
    .seat-row-box { position: relative; margin-bottom: 8px; }
    .seat-row-box .seat { margin-bottom: 0; }
    .del-slot-btn {
      width: 100%; padding: 4px; margin-top: 3px; font-size: 12px; font-weight: 800;
      background: #450a0a; border: 1px solid #f87171; color: #fecaca; border-radius: 6px;
    }

    .bow-bar {
      text-align: center; font-size: 15px; font-weight: 800; color: #38bdf8;
      padding: 8px; background: rgba(13, 23, 42, 0.85); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; margin: 10px 0;
    }
    .hull { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .seat {
      width: 100%; min-height: 68px; border-radius: 10px; background: rgba(15, 23, 42, 0.92); border: 2px solid #263552;
      padding: 8px 10px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
      margin-bottom: 8px; text-align: left;
    }
    .seat.bag { background: var(--bag-bg); border-color: var(--bag-bd); }
    .seat.shop { background: var(--shop-bg); border-color: var(--shop-bd); }
    .seat.assigned { background: var(--blue-bg); border-color: #3b82f6; }
    .seat.fit-ok { background: var(--green-bg); border-color: var(--green); }
    .seat.fit-warn { background: #3b2f06; border-color: #eab308; }
    .s-pos { font-size: 13px; color: var(--sub); font-weight: 700; }
    .s-name { font-size: 17px; font-weight: 800; color: #fff; margin-top: 2px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .s-holder { font-size: 14px; font-weight: 800; margin-top: 2px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { display: inline-block; font-size: 12px; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,0.18); margin-right: 4px; margin-top: 2px; }

    /* 予約一覧モーダル内リスト（縦2列・フォントサイズ維持） */
    .modal-wide { max-width: 560px; }
    .gs-head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; margin-bottom: 10px; flex-wrap: wrap;
    }
    .gs-title { font-size: 16px; font-weight: 800; color: #38bdf8; }
    .gs-controls { display: flex; gap: 6px; margin-bottom: 10px; }
    .g-list-2col {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
    }
    .g-card-2col {
      position: relative; min-width: 0; background: var(--inp); border: 2px solid var(--bd);
      border-radius: 12px; padding: 10px;
      display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
      text-align: left; cursor: pointer;
    }
    .g-card-2col.sel { background: #1e3a8a; border-color: #60a5fa; }
    .g-card-2col.partial { border-color: #fb923c; background: #1e1b18; }
    .g-card-2col.done { opacity: 0.45; border-style: dashed; }
    .g-card-top { display: flex; align-items: center; gap: 6px; width: 100%; }
    .g-name-txt { font-size: 18px; font-weight: 800; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .g-cnt { background: var(--blue); color: #fff; padding: 2px 8px; border-radius: 7px; font-size: 15px; font-weight: 800; flex-shrink: 0; }
    .g-card-foot {
      display: flex; align-items: flex-end; justify-content: space-between; gap: 4px;
      width: 100%; margin-top: 6px;
    }
    .g-meta { font-size: 14px; color: #cbd5e1; line-height: 1.3; word-break: break-all; }
    .g-meta.dot-mark { color: #fcd34d; font-weight: 700; }
    .g-edit-mini {
      padding: 4px 8px; font-size: 14px; border-radius: 7px; flex-shrink: 0;
      background: #1e293b; border: 1px solid #475569; color: #e2e8f0;
    }

    /* 座席表の下に配置する「解析した予約表」タップ開閉アコーディオン */
    .parsed-sheet-accordion {
      background: #070b14; border: 2px solid var(--bd); border-radius: 14px;
      margin-top: 16px; overflow: hidden;
    }
    .accordion-trigger-btn {
      width: 100%; padding: 13px 14px; border-radius: 0; border: none;
      background: #0f172a; color: #e2e8f0;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 16px; font-weight: 800; text-align: left;
    }
    .accordion-body {
      padding: 10px 12px 14px; border-top: 1px solid var(--bd);
    }

    /* 縦・横スクロール両対応の段ごと横並び表示 */
    .layout-scroll-wrap {
      width: 100%; max-height: 360px;
      overflow-x: auto; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--bd); border-radius: 10px; background: var(--inp);
      padding: 7px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .layout-flex-row {
      display: flex; flex-direction: row; flex-wrap: nowrap; align-items: stretch; gap: 6px;
      width: max-content;
    }
    .row-badge-label {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0 6px; border-radius: 5px; background: #1e293b; color: #94a3b8;
      font-size: 10px; font-weight: 800; flex-shrink: 0; user-select: none;
    }
    .layout-cell {
      border: 1px solid #2b3f63; border-radius: 6px; padding: 6px 8px;
      min-width: 88px; max-width: 144px; background: #131c31;
      flex-shrink: 0; cursor: pointer;
    }
    .layout-cell.done-slot {
      background: #0a1222; border-color: #1e293b;
    }
    .cell-guest-name {
      font-size: 13px; font-weight: 800; color: #ffffff; word-break: break-all;
    }
    .cell-guest-cnt {
      font-size: 12px; font-weight: 800; color: #93c5fd; margin-left: 3px;
    }
    .cell-guest-note {
      font-size: 10px; color: #fcd34d; margin-top: 2px; word-break: break-all;
    }
    .strike-name {
      position: relative; display: inline-block; color: #cbd5e1;
    }
    .strike-name::after {
      content: ""; position: absolute; left: -2px; right: -2px; top: 52%;
      height: 2.5px; background: #ef4444; border-radius: 2px; pointer-events: none;
    }
    .boat-tag {
      display: inline-block; font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 4px;
      background: #1e3a8a; border: 1px solid #3b82f6; color: #93c5fd; margin-top: 3px;
    }
    .sheet-summary {
      background: var(--inp); border: 1px solid var(--bd); border-radius: 10px;
      padding: 9px 11px; margin-bottom: 9px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }

    /* モーダル */
    .modal-bg { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.84); display: none; align-items: center; justify-content: center; padding: 8px; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 14px; }
    .m-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bd); padding-bottom: 10px; margin-bottom: 12px; font-weight: 800; font-size: 18px; gap: 8px; }
    .m-head-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .modal-close-lg {
      padding: 12px 18px; font-size: 17px; font-weight: 900;
      min-width: 104px; background: #334155; border: 2px solid #94a3b8; color: #ffffff;
      border-radius: 10px; flex-shrink: 0;
    }
    .field { margin-bottom: 13px; }
    .field label { display: block; font-size: 14px; color: var(--sub); margin-bottom: 5px; font-weight: 700; }
    input[type="text"], input[type="password"], input[type="number"], textarea, select {
      width: 100%; background: var(--inp); border: 1px solid var(--bd); color: var(--tx);
      border-radius: 8px; padding: 11px; font-size: 17px;
    }
    .toast {
      position: fixed; top: 96px; left: 50%; transform: translateX(-50%); z-index: 200;
      background: #1e293b; border: 1px solid #475569; color: #fff; padding: 11px 18px;
      border-radius: 10px; font-size: 15px; font-weight: 700; display: none; max-width: 92vw; text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="h-top">
      <div class="h-brand">
        <span class="h-icon">🚢</span>
        <span class="h-ship">山下丸</span>
        <span class="h-sub">釣り座管理</span>
      </div>
      <button type="button" id="menuToggleBtn" class="menu-toggle-btn" onclick="toggleMenuCollapse()">メニュー ▲</button>
    </div>
    <!-- 2段目ボタン：左＝読込、中＝設定、右＝予約一覧（メニュー収納時は非表示） -->
    <div class="h-btns" id="staffHeaderBtns">
      <button type="button" onclick="openModal('ocrModal')">📷 読込</button>
      <button type="button" onclick="openModal('setupModal')">⚙ 設定</button>
      <button type="button" class="primary" onclick="openModal('guestListModal')">📋 予約一覧</button>
    </div>
  </header>

  <div id="topBars" style="display:none;">
    <!-- スタッフ操作バー（メニュー収納時は非表示） -->
    <div class="mode-bar" id="staffModeBar">
      <div class="mark-split">
        <button type="button" id="bagModeBtn" class="bag-btn" onclick="toggleMarkMode('BAG')">■ 荷物：OFF</button>
        <button type="button" id="shopModeBtn" class="shop-btn" onclick="toggleMarkMode('SHOP')">● 店取り：OFF</button>
      </div>
      <div class="action-split">
        <button type="button" id="undoBtn" class="undo-btn" onclick="undoLastAction()" disabled>↩ 1つ前に戻す</button>
        <button type="button" class="success" style="padding:11px;" onclick="autoAssign()">✨ 残り自動確定</button>
      </div>
    </div>
    <!-- 常時表示の船タブ（船名フォント最大化） -->
    <div class="tabs" id="boatTabs"></div>
    <!-- 船タブ直下の大きな「📋 予約一覧」常設ボタン（メニュー収納時も表示） -->
    <div class="quick-guest-bar" id="quickGuestBar">
      <button type="button" class="quick-guest-btn" id="quickGuestBtn" onclick="openModal('guestListModal')">📋 予約一覧</button>
    </div>
  </div>

  <div class="container" id="main"></div>

  <div class="toast" id="toast"></div>

  <!-- 「予約一覧」モーダル（縦2列・多い順/少ない順2択・元画像ボタン・大きな閉じるボタン） -->
  <div class="modal-bg" id="guestListModal">
    <div class="modal modal-wide">
      <div class="m-head">
        <div class="m-head-left">
          <span style="font-size:19px;">📋 予約一覧</span>
          <button type="button" class="warning" id="modalOrigImgBtn" onclick="openOrigImage()" style="padding:8px 11px; font-size:14px;">🖼 元画像</button>
        </div>
        <button type="button" class="modal-close-lg" onclick="closeModal('guestListModal')">✕ 閉じる</button>
      </div>
      <div id="guestListModalBody"></div>
    </div>
  </div>

  <!-- 設定モーダル（32号船連携・配船・API設定） -->
  <div class="modal-bg" id="setupModal">
    <div class="modal">
      <div class="m-head"><span>⚙ 設定・配船・連携</span><button type="button" class="modal-close-lg" onclick="closeModal('setupModal')">✕ 閉じる</button></div>

      <div style="background:var(--inp); border:1px solid #3b82f6; border-radius:10px; padding:11px; margin-bottom:13px;">
        <div style="font-size:15px; font-weight:800; color:#93c5fd; margin-bottom:8px;">📤 32号船 釣果アプリ連携</div>
        <textarea id="expArea" rows="5" readonly style="font-family:monospace; font-size:12px;"></textarea>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button type="button" class="primary" style="flex:1; padding:9px;" onclick="copyExp()">📋 コピー</button>
          <button type="button" class="success" style="flex:1; padding:9px;" onclick="saveExp()">💾 共有領域に保存</button>
        </div>
      </div>

      <div class="field">
        <label>AI解析モデル</label>
        <select id="modelSelect" onchange="saveModel()">
          <option value="gemini-4-hydrogen">Gemini 4 Hydrogen (標準・高速)</option>
          <option value="gemini-4-neon">Gemini 4 Neon (高精度)</option>
          <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
        </select>
      </div>
      <div class="field">
        <label>Gemini APIキー（予約表の写真解析用）</label>
        <input type="password" id="apiKeyInput" placeholder="AIzaSy..." onchange="saveKey()" />
      </div>
      <div style="display:flex; flex-direction:column; gap:8px; margin-top:12px;">
        <button type="button" class="primary" style="padding:13px;" onclick="goStep('verify')">📋 読取予約の確認・修正画面へ戻る</button>
        <button type="button" class="primary" style="padding:13px;" onclick="goStep('boats')">🚢 出船する船・人数を選び直す</button>
        <button type="button" class="danger" style="padding:13px;" onclick="resetSeatsOnly()">座席の配置だけ全て空に戻す</button>
        <button type="button" class="danger" style="padding:13px; background:#7f1d1d;" onclick="resetAllNewDay()">🗑 予約と座席をすべて初期化（新営業日）</button>
      </div>
    </div>
  </div>

  <!-- 元画像フル確認モーダル -->
  <div class="modal-bg" id="origImgModal" style="z-index:120;">
    <div class="modal" style="max-width:540px; padding:12px;">
      <div class="m-head">
        <span>🖼 読み込んだ予約表（元画像）</span>
        <button type="button" class="modal-close-lg" style="background:var(--blue); border-color:#60a5fa;" onclick="closeModal('origImgModal')">◀ 戻る</button>
      </div>
      <div id="origImgContainer" style="text-align:center;"></div>
    </div>
  </div>

  <!-- OCR読込モーダル -->
  <div class="modal-bg" id="ocrModal">
    <div class="modal">
      <div class="m-head"><span>📷 予約表の写真読込</span><button type="button" class="modal-close-lg" onclick="closeModal('ocrModal')">✕ 閉じる</button></div>
      <div class="field"><label>対象魚種（ヒント）</label><input type="text" id="fishInput" value="カワハギ" /></div>
      <div class="field"><label>予約表の写真を選択</label><input type="file" id="ocrFile" accept="image/*" /></div>
      <button type="button" class="primary" style="width:100%; padding:13px;" id="ocrBtn" onclick="runOcr()">AIで解析する</button>
      <div id="ocrMsg" style="margin-top:10px; font-size:15px;"></div>
    </div>
  </div>

  <!-- 手動追加モーダル -->
  <div class="modal-bg" id="addModal">
    <div class="modal">
      <div class="m-head"><span>＋ 予約グループ追加</span><button type="button" class="modal-close-lg" onclick="closeModal('addModal')">✕ 閉じる</button></div>
      <div class="field"><label>代表者名</label><input type="text" id="addName" placeholder="例：井部" /></div>
      <div class="field"><label>人数</label><input type="number" id="addCount" value="1" min="1" max="15" /></div>
      <div class="field"><label>メモ（前日場所取 / 竿 / カラ）</label><input type="text" id="addNote" /></div>
      <button type="button" class="primary" style="width:100%; padding:13px;" onclick="addGuest()">追加する</button>
    </div>
  </div>

  <!-- 編集・削除モーダル -->
  <div class="modal-bg" id="editModal">
    <div class="modal">
      <div class="m-head"><span>✎ 予約の修正・削除</span><button type="button" class="modal-close-lg" onclick="closeModal('editModal')">✕ 閉じる</button></div>
      <input type="hidden" id="editId" />
      <div class="field"><label>代表者名</label><input type="text" id="editName" /></div>
      <div class="field">
        <label>人数</label>
        <div style="display:flex; gap:10px; align-items:center;">
          <button type="button" style="padding:11px 20px; font-size:20px;" onclick="stepEdit(-1)">−</button>
          <input type="number" id="editCount" min="1" max="15" style="text-align:center; font-weight:800;" />
          <button type="button" style="padding:11px 20px; font-size:20px;" onclick="stepEdit(1)">＋</button>
        </div>
      </div>
      <div class="field"><label>メモ</label><input type="text" id="editNote" /></div>
      <div style="display:flex; gap:8px;">
        <button type="button" class="danger" style="flex:1; padding:13px;" onclick="delGuest()">🗑 削除</button>
        <button type="button" class="primary" style="flex:1; padding:13px;" onclick="saveEdit()">✅ 保存</button>
      </div>
    </div>
  </div>

  <script>
    const BOAT_LIST = ["32号船", "31号船", "27号船", "25号船", "智丸"];
    const STORE_KEY = "yamashitamaru_seat_flow_v15";
    const SHARED_32 = "yamashitamaru_seat_32_export";

    let draftBoats = [];
    let uidCounter = 1;
    let lastOcrImageDataUrl = null;
    let undoStack = [];

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function getBoatCode(boatName) {
      if (!boatName) return "";
      if (boatName.includes("32")) return "32";
      if (boatName.includes("31")) return "31";
      if (boatName.includes("27")) return "27";
      if (boatName.includes("25")) return "25";
      return "";
    }

    function applyBoatBodyTheme() {
      document.body.className = "";
      if (state.step === "seats" && state.view !== "overview") {
        const code = getBoatCode(state.view);
        if (code) document.body.classList.add(`theme-${code}`);
      }
    }

    let state = {
      savedDate: getTodayStr(),
      step: "verify",
      ocrLoaded: false,
      ocrWrittenTotal: null,
      ocrImage: null,
      menuCollapsed: false,
      parsedSheetOpen: false,
      sortMode: "desc", // "desc": 人数が多い順 ▼ / "asc": 人数が少ない順 ▲
      view: "overview",
      markMode: null,
      customSplitMode: false,
      seatEditMode: false,
      selId: null,
      boats: [],
      guests: []
    };

    function pushUndo(actionLabel) {
      undoStack.push({
        label: actionLabel,
        boats: JSON.parse(JSON.stringify(state.boats))
      });
      if (undoStack.length > 20) undoStack.shift();
    }

    function undoLastAction() {
      if (undoStack.length === 0) {
        toast("これ以上戻せる操作がありません");
        return;
      }
      const prev = undoStack.pop();
      state.boats = prev.boats;
      state.selId = null;
      state.customSplitMode = false;
      save(); render();
      toast(`↩ 1つ前に戻しました（${prev.label}）`);
    }

    function makeUniqueId(prefix) {
      uidCounter += 1;
      return `${prefix}_${Date.now()}_${uidCounter}`;
    }

    function assignDefault45Rows(list) {
      let rowIdx = 0;
      let colIdx = 0;
      return (list || []).map(g => {
        const capInRow = (rowIdx % 2 === 0) ? 4 : 5;
        const item = { ...g, row: rowIdx, col: colIdx };
        colIdx++;
        if (colIdx >= capInRow) {
          rowIdx++;
          colIdx = 0;
        }
        return item;
      });
    }

    function normalizeGuests(list) {
      const seen = new Set();
      const mapped = (list || []).map(g => {
        let id = String(g.id || "");
        if (!id || seen.has(id)) id = makeUniqueId("g");
        seen.add(id);
        return {
          id,
          name: String(g.name || "").trim(),
          count: Math.min(15, Math.max(1, parseInt(g.count, 10) || 1)),
          note: String(g.note || "").trim(),
          row: Number.isInteger(g.row) && g.row >= 0 ? g.row : -1,
          col: Number.isInteger(g.col) && g.col >= 0 ? g.col : -1
        };
      });
      const hasExplicitRows = mapped.some(x => x.row > 0) || (mapped.length > 0 && mapped.every(x => x.row === 0 && x.col >= 0 && x.col < 4 && mapped.length <= 4));
      if (!hasExplicitRows && mapped.length > 0) {
        return assignDefault45Rows(mapped);
      }
      return mapped.map((x, idx) => ({
        ...x,
        row: x.row >= 0 ? x.row : 0,
        col: x.col >= 0 ? x.col : idx
      }));
    }

    function isMarkSeat(c) {
      return c && (c.type === "BAG" || c.type === "SHOP" || c.type === "HOLD");
    }

    function countAssignedSeatsForGuest(guestId) {
      const targetId = String(guestId);
      let cnt = 0;
      state.boats.forEach(b => ["leftSeats", "rightSeats"].forEach(sk => {
        b[sk].forEach(c => {
          if (c && c.type === "ASSIGNED" && String(c.guestId) === targetId) cnt++;
        });
      }));
      return cnt;
    }

    function init() {
      const today = getTodayStr();
      const saved = localStorage.getItem(STORE_KEY) || localStorage.getItem("yamashitamaru_seat_flow_v14");
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          const hasData = (parsed.guests && parsed.guests.length > 0) || (parsed.boats && parsed.boats.length > 0 && parsed.step === "seats");
          if (parsed.savedDate && parsed.savedDate !== today && hasData) {
            const parts = parsed.savedDate.split("-");
            const label = parts.length === 3 ? `${Number(parts[1])}/${Number(parts[2])}` : parsed.savedDate;
            const doReset = confirm(`📅 前日（${label}）のデータが残っています。\nリセットして新しく始めますか？\n\n・OK：すべて消去して新しく始める\n・キャンセル：前日のデータをそのまま使う`);
            if (doReset) {
              state.savedDate = today;
              state.step = "verify";
              state.ocrLoaded = false;
              state.ocrImage = null;
              state.boats = [];
              state.guests = [];
              state.selId = null;
              draftBoats = [];
              save();
            } else {
              state = { ...state, ...parsed, savedDate: today };
              if (parsed.sortByCount === false) state.sortMode = "asc";
              else if (!parsed.sortMode) state.sortMode = "desc";
              state.guests = normalizeGuests(state.guests);
              if (state.guests.length > 0) state.ocrLoaded = true;
              if (state.ocrImage) lastOcrImageDataUrl = state.ocrImage;
              if (state.boats && state.boats.length > 0) {
                draftBoats = state.boats.map(b => ({ name: b.name, leftCap: Number(b.leftCap), rightCap: Number(b.rightCap) }));
              }
              save();
            }
          } else {
            state = { ...state, ...parsed, savedDate: today };
            if (parsed.sortByCount === false) state.sortMode = "asc";
            else if (!parsed.sortMode) state.sortMode = "desc";
            state.guests = normalizeGuests(state.guests);
            if (state.guests.length > 0) state.ocrLoaded = true;
            if (state.ocrImage) lastOcrImageDataUrl = state.ocrImage;
            if (state.boats && state.boats.length > 0) {
              draftBoats = state.boats.map(b => ({ name: b.name, leftCap: Number(b.leftCap), rightCap: Number(b.rightCap) }));
            }
          }
        } catch (e) {}
      }
      document.getElementById("apiKeyInput").value = localStorage.getItem("gemini_api_key") || "";
      document.getElementById("modelSelect").value = localStorage.getItem("gemini_seat_model") || "gemini-4-hydrogen";
      render();
    }

    function save() {
      state.savedDate = getTodayStr();
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(state));
      } catch (e) {
        const copy = { ...state, ocrImage: null };
        localStorage.setItem(STORE_KEY, JSON.stringify(copy));
      }
    }
    function saveKey() { localStorage.setItem("gemini_api_key", document.getElementById("apiKeyInput").value.trim()); toast("APIキー保存完了"); }
    function saveModel() { localStorage.setItem("gemini_seat_model", document.getElementById("modelSelect").value); toast("AIモデルを保存しました"); }
    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.style.display = "block";
      clearTimeout(t._tm); t._tm = setTimeout(() => t.style.display = "none", 3200);
    }

    function toggleMenuCollapse() {
      state.menuCollapsed = !state.menuCollapsed;
      if (state.menuCollapsed) {
        state.selId = null;
        state.markMode = null;
        state.customSplitMode = false;
        state.seatEditMode = false;
      }
      save(); render();
    }

    function toggleParsedSheetAccordion() {
      state.parsedSheetOpen = !state.parsedSheetOpen;
      save(); render();
    }

    function goStep(stepName) {
      if (stepName === "boats") {
        if (state.boats.length > 0) {
          draftBoats = state.boats.map(b => ({ name: b.name, leftCap: Number(b.leftCap), rightCap: Number(b.rightCap) }));
        } else {
          draftBoats = [];
        }
      }
      state.step = stepName;
      state.menuCollapsed = false;
      closeModal("setupModal");
      save(); render();
    }

    function toggleSortOrder() {
      state.sortMode = (state.sortMode === "asc") ? "desc" : "asc";
      save();
      if (document.getElementById("guestListModal").classList.contains("open")) {
        renderGuestListModal();
      }
    }

    function toggleMarkMode(mode) {
      state.markMode = (state.markMode === mode) ? null : mode;
      if (state.markMode) {
        state.customSplitMode = false;
      }
      render();
      const selG = state.guests.find(x => String(x.id) === String(state.selId));
      if (state.markMode === "BAG") {
        toast(selG ? `■ 荷物モードON（${selG.name}様 ${selG.count}名）：席をタップしてください` : "■ 荷物モードON：荷物が置いてある席をタップしてください");
      } else if (state.markMode === "SHOP") {
        toast(selG ? `● 店取りモードON（${selG.name}様 ${selG.count}名）：席をタップしてください` : "● 店取りモードON：お店で確保する席をタップしてください");
      } else {
        toast("席マーク入力をOFFにしました");
      }
    }

    function toggleCustomSplitMode() {
      state.customSplitMode = !state.customSplitMode;
      render();
      if (state.customSplitMode) {
        toast("🔀 バラバラ配置ON：1席ずつ好きな場所をタップしてください");
      } else {
        toast("連番一括配置に戻しました");
      }
    }

    function toggleSeatEditMode() {
      state.seatEditMode = !state.seatEditMode;
      if (state.seatEditMode) {
        state.selId = null;
        state.markMode = null;
      }
      render();
    }

    function clearSel() {
      state.selId = null;
      state.markMode = null;
      state.customSplitMode = false;
      render();
    }
    function setView(v) { state.view = v; render(); }

    function adjustVerifyCount(id, delta) {
      const g = state.guests.find(x => String(x.id) === String(id));
      if (!g) return;
      g.count = Math.min(15, Math.max(1, Number(g.count) + delta));
      removeGuest(id);
      save(); render();
    }

    function removeVerifyGuest(id) {
      removeGuest(id);
      state.guests = state.guests.filter(g => String(g.id) !== String(id));
      if (String(state.selId) === String(id)) state.selId = null;
      if (state.guests.length === 0) state.ocrLoaded = false;
      save(); render();
      toast("リストから除外しました");
    }

    function confirmVerifiedGuests() {
      if (state.guests.length === 0) {
        toast("予約客が1組もありません。予約表を読み込むか追加してください");
        return;
      }
      if (state.boats.length > 0) {
        draftBoats = state.boats.map(b => ({ name: b.name, leftCap: Number(b.leftCap), rightCap: Number(b.rightCap) }));
      } else {
        draftBoats = [];
      }
      state.step = "boats";
      save(); render();
      toast("予約人数を確定しました。出船する船と人数を指定してください");
    }

    function toggleDraftBoat(name) {
      const idx = draftBoats.findIndex(b => b.name === name);
      if (idx >= 0) draftBoats.splice(idx, 1);
      else draftBoats.push({ name, leftCap: 0, rightCap: 0 });
      render();
    }

    function changeDraftCap(idx, side, d) {
      const key = side === "left" ? "leftCap" : "rightCap";
      const cur = Number(draftBoats[idx][key]) || 0;
      draftBoats[idx][key] = Math.min(15, Math.max(0, cur + d));
      render();
    }

    function setDraftCapInput(idx, side, val) {
      const key = side === "left" ? "leftCap" : "rightCap";
      const parsed = parseInt(val, 10);
      draftBoats[idx][key] = isNaN(parsed) ? 0 : Math.min(15, Math.max(0, parsed));
      render();
    }

    function startWithDraft() {
      if (draftBoats.length === 0) {
        toast("出船する船を1隻以上選んでください");
        return;
      }
      const invalidBoat = draftBoats.find(b => (Number(b.leftCap) || 0) <= 0 || (Number(b.rightCap) || 0) <= 0);
      if (invalidBoat) {
        toast(`⚠️ ${invalidBoat.name} の左舷・右舷の人数を入力してください`);
        return;
      }

      const oldMap = new Map(state.boats.map(b => [b.name, b]));
      state.boats = draftBoats.map(b => {
        const lc = Number(b.leftCap), rc = Number(b.rightCap);
        const old = oldMap.get(b.name);
        if (old) {
          const ls = [...old.leftSeats];
          while (ls.length < lc) ls.push(null);
          if (ls.length > lc) ls.length = lc;
          const rs = [...old.rightSeats];
          while (rs.length < rc) rs.push(null);
          if (rs.length > rc) rs.length = rc;
          return { name: b.name, leftCap: lc, rightCap: rc, leftSeats: ls, rightSeats: rs };
        }
        return { name: b.name, leftCap: lc, rightCap: rc, leftSeats: Array(lc).fill(null), rightSeats: Array(rc).fill(null) };
      });

      undoStack = [];
      state.step = "seats";
      state.view = "overview";
      save(); render();
      toast("配船を確定し、座席表を開始しました");
    }

    function resetAllNewDay() {
      if (!confirm("予約一覧と座席をすべて消去して、新しい日の画面に戻りますか？")) return;
      state.step = "verify";
      state.ocrLoaded = false;
      state.ocrWrittenTotal = null;
      state.ocrImage = null;
      lastOcrImageDataUrl = null;
      state.menuCollapsed = false;
      state.parsedSheetOpen = false;
      state.customSplitMode = false;
      state.seatEditMode = false;
      state.boats = [];
      state.guests = [];
      state.selId = null;
      state.markMode = null;
      draftBoats = [];
      undoStack = [];
      closeModal("setupModal");
      save(); render();
      toast("新しい営業日用に初期化しました");
    }

    function insertSeatAt(bIdx, sk, index) {
      const b = state.boats[bIdx];
      if (!b) return;
      const capKey = sk === "leftSeats" ? "leftCap" : "rightCap";
      const sideLabel = sk === "leftSeats" ? "左舷" : "右舷";
      if (b[sk].length >= 15) {
        toast("⚠️ 1舷あたりの最大席数（15席）に達しています");
        return;
      }
      pushUndo(`${b.name} ${sideLabel}${index + 1}番前に1席挿入`);
      b[sk].splice(index, 0, null);
      b[capKey] = b[sk].length;
      save(); render();
      const posLabel = index >= b[sk].length - 1 ? "オオドモ（最後尾）" : `${index + 1}番の位置`;
      toast(`＋ ${b.name} ${sideLabel}の${posLabel}に1席追加しました`);
    }

    function deleteSeatAt(bIdx, sk, index) {
      const b = state.boats[bIdx];
      if (!b) return;
      const capKey = sk === "leftSeats" ? "leftCap" : "rightCap";
      const sideLabel = sk === "leftSeats" ? "左舷" : "右舷";
      if (b[sk].length <= 1) {
        toast("⚠️ 最低1席は必要です");
        return;
      }
      const target = b[sk][index];
      if (target && target.type === "ASSIGNED") {
        toast(`⚠️ ${index + 1}番には ${target.name}様 が座っているため削除できません（先に移動か解除してください）`);
        return;
      }
      if (isMarkSeat(target)) {
        const mLabel = formatMarkLabel(target);
        if (!confirm(`${b.name} ${sideLabel}${index + 1}番には「${mLabel}」が入っています。この席ごと削除して後ろを詰めますか？`)) return;
      } else {
        if (!confirm(`${b.name} ${sideLabel}${index + 1}番の席を削除して、後ろの席を1つずつ前へ詰めますか？`)) return;
      }
      pushUndo(`${b.name} ${sideLabel}${index + 1}番を削除`);
      b[sk].splice(index, 1);
      b[capKey] = b[sk].length;
      save(); render();
      toast(`− ${b.name} ${sideLabel}${index + 1}番を削除し、後ろを詰めました`);
    }

    function canFitAll(boatsSnap, unplaced) {
      if (!unplaced || unplaced.length === 0) return true;

      let markedSlots = 0;
      const blocks = [];
      boatsSnap.forEach(b => ["leftSeats", "rightSeats"].forEach(sk => {
        let run = 0;
        b[sk].forEach(c => {
          if (c === null) {
            run++;
          } else {
            if (isMarkSeat(c)) markedSlots++;
            if (run > 0) { blocks.push(run); run = 0; }
          }
        });
        if (run > 0) blocks.push(run);
      }));

      const totalEmpty = blocks.reduce((a, b) => a + b, 0);
      const totalUnplacedNeed = unplaced.reduce((a, g) => a + Number(g.count || 0), 0);

      const netNeed = Math.max(0, totalUnplacedNeed - markedSlots);
      if (totalEmpty < netNeed) return false;
      if (netNeed === 0) return true;

      const sorted = [...unplaced].sort((a, b) => Number(b.count || 0) - Number(a.count || 0));

      function tryAssign(idx, remBlocks, remMarks) {
        if (idx === sorted.length) return true;
        const need = Number(sorted[idx].count || 1);

        const triedSizes = new Set();
        for (let k = 0; k < remBlocks.length; k++) {
          if (remBlocks[k] >= need && !triedSizes.has(remBlocks[k])) {
            triedSizes.add(remBlocks[k]);
            const nextBlocks = [...remBlocks];
            nextBlocks[k] -= need;
            if (tryAssign(idx + 1, nextBlocks, remMarks)) return true;
          }
        }

        const markCover = Math.min(need, remMarks);
        const remAfterMark = need - markCover;
        const availEmpty = remBlocks.reduce((a, b) => a + b, 0);
        if (availEmpty >= remAfterMark) {
          if (remAfterMark === 0) {
            if (tryAssign(idx + 1, remBlocks, remMarks - markCover)) return true;
          } else {
            const nextBlocks = [...remBlocks].sort((a, b) => b - a);
            let leftToFill = remAfterMark;
            for (let k = 0; k < nextBlocks.length && leftToFill > 0; k++) {
              const take = Math.min(nextBlocks[k], leftToFill);
              nextBlocks[k] -= take;
              leftToFill -= take;
            }
            if (leftToFill === 0 && tryAssign(idx + 1, nextBlocks, remMarks - markCover)) return true;
          }
        }

        return false;
      }

      return tryAssign(0, blocks, markedSlots);
    }

    function evalPlace(bIdx, sk, start, guest) {
      const b = state.boats[bIdx];
      if (!b || !b[sk]) return { valid: false };
      const arr = b[sk];
      const st = Number(start);
      const cnt = Number(guest.count) || 1;
      if (st < 0 || st + cnt > arr.length) return { valid: false };

      for (let i = st; i < st + cnt; i++) {
        if (arr[i] && arr[i].type === "ASSIGNED" && String(arr[i].guestId) !== String(guest.id)) {
          return { valid: false };
        }
      }

      const clone = JSON.parse(JSON.stringify(state.boats));
      clone.forEach(boat => ["leftSeats", "rightSeats"].forEach(s => {
        boat[s] = boat[s].map(c => (c && c.type === "ASSIGNED" && String(c.guestId) === String(guest.id)) ? null : c);
      }));
      for (let i = st; i < st + cnt; i++) {
        clone[bIdx][sk][i] = { type: "ASSIGNED", guestId: String(guest.id) };
      }

      const unplaced = state.guests
        .map(g => {
          let assigned = 0;
          clone.forEach(boat => ["leftSeats", "rightSeats"].forEach(s => {
            boat[s].forEach(c => { if (c && c.type === "ASSIGNED" && String(c.guestId) === String(g.id)) assigned++; });
          }));
          const rem = Math.max(0, Number(g.count || 1) - assigned);
          return rem > 0 ? { ...g, count: rem } : null;
        })
        .filter(Boolean);

      return { valid: true, fits: canFitAll(clone, unplaced) };
    }

    function handleSeatClick(bIdx, sk, idx) {
      if (state.menuCollapsed) return;

      const boat = state.boats[bIdx];
      if (!boat || !boat[sk]) return;
      const seatIdx = Number(idx);
      const cur = boat[sk][seatIdx];
      const sideLabel = sk === "leftSeats" ? "左舷" : "右舷";

      if (state.markMode) {
        if (cur && cur.type === "ASSIGNED") { toast("確定済みの席です"); return; }
        const selHolder = state.guests.find(x => String(x.id) === String(state.selId));
        const holderName = selHolder ? selHolder.name : "";
        const holderCount = selHolder ? Number(selHolder.count) : 0;

        if (cur && cur.type === state.markMode) {
          const oldDesc = formatMarkLabel(cur);
          if (!confirm(`${boat.name} ${sideLabel}${seatIdx + 1}番の「${oldDesc}」を解除しますか？`)) return;
          pushUndo(`${oldDesc}の解除`);
          state.boats[bIdx][sk][seatIdx] = null;
          save(); render();
          toast(`${oldDesc}を解除しました`);
          return;
        }
        if (cur && isMarkSeat(cur) && cur.type !== state.markMode) {
          const oldDesc = formatMarkLabel(cur);
          const newDesc = formatMarkLabel({ type: state.markMode, holderName, holderCount });
          if (!confirm(`${boat.name} ${sideLabel}${seatIdx + 1}番の「${oldDesc}」を「${newDesc}」に変更しますか？`)) return;
        }

        const newMark = {
          type: state.markMode,
          holderId: selHolder ? String(selHolder.id) : "",
          holderName,
          holderCount
        };
        pushUndo(`${formatMarkLabel(newMark)}の入力`);
        state.boats[bIdx][sk][seatIdx] = newMark;
        save(); render();
        toast(`✅ ${boat.name} ${sideLabel}${seatIdx + 1}番に「${formatMarkLabel(newMark)}」を記録`);
        return;
      }

      if (state.selId) {
        const g = state.guests.find(x => String(x.id) === String(state.selId));
        if (!g) { state.selId = null; state.customSplitMode = false; render(); return; }

        if (state.customSplitMode) {
          if (cur && cur.type === "ASSIGNED" && String(cur.guestId) === String(g.id)) {
            pushUndo(`${g.name}様の1席解除`);
            state.boats[bIdx][sk][seatIdx] = null;
            save(); render();
            const nowCnt = countAssignedSeatsForGuest(g.id);
            toast(`${g.name}様の1席を解除（現在 ${nowCnt}/${g.count}名）`);
            return;
          }
          if (cur && cur.type === "ASSIGNED") {
            toast(`⚠️ ${cur.name}様が確定済みの席です`);
            return;
          }
          const alreadyCnt = countAssignedSeatsForGuest(g.id);
          if (alreadyCnt >= Number(g.count)) {
            toast(`⚠️ ${g.name}様はすでに全員分（${g.count}名）配置済みです`);
            return;
          }
          if (isMarkSeat(cur)) {
            const mLabel = formatMarkLabel(cur);
            if (!confirm(`${boat.name} ${sideLabel}${seatIdx + 1}番の「${mLabel}」を上書きして ${g.name}様（1名分）を配置しますか？`)) return;
          }
          pushUndo(`${g.name}様の個別1席配置`);
          state.boats[bIdx][sk][seatIdx] = {
            type: "ASSIGNED",
            guestId: String(g.id),
            name: g.name,
            count: Number(g.count),
            note: g.note
          };
          const afterCnt = alreadyCnt + 1;
          if (afterCnt >= Number(g.count)) {
            state.selId = null;
            state.customSplitMode = false;
            save(); render();
            toast(`✅ ${g.name}様（全${g.count}名）のバラバラ配置が完了しました！`);
          } else {
            save(); render();
            toast(`👤 ${g.name}様：${afterCnt}/${g.count}名 配置（残り ${g.count - afterCnt}名）`);
          }
          return;
        }

        if (cur && cur.type === "ASSIGNED" && String(cur.guestId) === String(g.id)) {
          if (!confirm(`${g.name}様（${g.count}名）の座席確定を解除しますか？`)) return;
          pushUndo(`${g.name}様の解除`);
          removeGuest(g.id);
          state.selId = null;
          save(); render();
          toast(`${g.name}様を解除しました`);
          return;
        }

        const cnt = Number(g.count) || 1;
        const currentLen = state.boats[bIdx][sk].length;
        if (cnt > currentLen) {
          toast(`⚠️ ${g.name}様は${cnt}名のため片舷に入りきりません。上の「🔀 バラバラ配置」をONにして左右に分けてください`);
          return;
        }

        let st = seatIdx;
        if (st + cnt > currentLen) st = Math.max(0, currentLen - cnt);
        const ev = evalPlace(bIdx, sk, st, g);
        if (!ev.valid) {
          toast(`⚠️ 他の確定済みのお客様と重なるため配置できません。分ける場合は上の「🔀 バラバラ配置」をONにしてください`);
          return;
        }

        let overlappingMarks = 0;
        for (let i = st; i < st + cnt; i++) {
          if (isMarkSeat(state.boats[bIdx][sk][i])) overlappingMarks++;
        }
        if (overlappingMarks > 0) {
          if (!confirm(`この場所には「荷物」または「店取り」が${overlappingMarks}席含まれています。上書きして ${g.name}様(${cnt}名) を配置しますか？`)) return;
        }

        pushUndo(`${g.name}様の配置`);
        removeGuest(g.id);
        const targetArr = state.boats[bIdx][sk];
        for (let i = st; i < st + cnt; i++) {
          targetArr[i] = { type: "ASSIGNED", guestId: String(g.id), name: g.name, count: cnt, note: g.note };
        }
        state.selId = null;
        state.customSplitMode = false;

        save(); render();
        toast(`✅ ${g.name}様(${cnt}名)を ${boat.name} ${sideLabel}${st + 1}番〜 に確定`);
        return;
      }

      if (cur && cur.type === "ASSIGNED") {
        state.selId = String(cur.guestId);
        const assignedNow = countAssignedSeatsForGuest(cur.guestId);
        const gObj = state.guests.find(x => String(x.id) === String(cur.guestId));
        state.customSplitMode = !!(gObj && assignedNow > 0 && assignedNow < Number(gObj.count));
        render();
        toast(`${cur.name}様を選択中（移動先タップ、または再タップで解除）`);
        return;
      }

      if (isMarkSeat(cur)) {
        const label = formatMarkLabel(cur);
        if (!confirm(`${boat.name} ${sideLabel}${seatIdx + 1}番の「${label}」を解除しますか？`)) return;
        pushUndo(`${label}の解除`);
        state.boats[bIdx][sk][seatIdx] = null;
        save(); render();
        toast(`${label}を解除しました`);
        return;
      }

      toast("上の「📋 予約一覧」からお名前を選んでから席をタップしてください");
    }

    function formatMarkLabel(c) {
      if (!c) return "";
      const base = c.type === "BAG" ? "■ 荷物" : "● 店取り";
      if (c.holderName) {
        return c.holderCount ? `${base} ${c.holderName}(${c.holderCount})` : `${base} ${c.holderName}`;
      }
      return base;
    }

    function removeGuest(id) {
      const targetId = String(id);
      state.boats.forEach(b => ["leftSeats", "rightSeats"].forEach(sk => {
        for (let i = 0; i < b[sk].length; i++) {
          if (b[sk][i] && b[sk][i].type === "ASSIGNED" && String(b[sk][i].guestId) === targetId) {
            b[sk][i] = null;
          }
        }
      }));
    }

    function autoAssign() {
      const unplaced = state.guests
        .map(g => ({ ...g, remNeed: Math.max(0, Number(g.count) - countAssignedSeatsForGuest(g.id)) }))
        .filter(g => g.remNeed > 0)
        .sort((a, b) => b.remNeed - a.remNeed);

      if (unplaced.length === 0) {
        toast("全員すでに確定済みです");
        return;
      }

      let pureEmptyTotal = 0;
      let protectedMarks = 0;
      state.boats.forEach(b => ["leftSeats", "rightSeats"].forEach(sk => {
        b[sk].forEach(c => {
          if (c === null) pureEmptyTotal++;
          else if (isMarkSeat(c)) protectedMarks++;
        });
      }));

      const totalNeed = unplaced.reduce((a, g) => a + g.remNeed, 0);
      if (pureEmptyTotal < totalNeed) {
        if (protectedMarks > 0) {
          alert(`⚠️ 空き席が足りません。\n\n未配置の残り人数：${totalNeed}名\n空いている席：${pureEmptyTotal}席\n保護中の「■荷物・●店取り」：${protectedMarks}席\n\n荷物・店取りの席は勝手に消さない設定になっています。先に荷物・店取りの席へお客様を割り当てるか、解除してから再度押してください。`);
        } else {
          alert(`⚠️ 船の空き席（${pureEmptyTotal}席）が未配置の人数（${totalNeed}名）より不足しています。座席数を増やすか調整してください。`);
        }
        return;
      }

      if (!confirm(`未配置の残り${unplaced.length}組（計${totalNeed}名）を、空いている席へ自動振り分けしますか？\n（※「■ 荷物」「● 店取り」の席はそのまま保護されます）`)) {
        return;
      }

      pushUndo("残り自動確定");

      const runs = () => {
        const r = [];
        state.boats.forEach((b, bIdx) => ["leftSeats", "rightSeats"].forEach(sk => {
          let st = -1;
          b[sk].forEach((c, i) => {
            if (c === null) { if (st === -1) st = i; }
            else { if (st !== -1) { r.push({ bIdx, sk, st, len: i - st }); st = -1; } }
          });
          if (st !== -1) r.push({ bIdx, sk, st, len: b[sk].length - st });
        }));
        return r;
      };

      let splits = 0;
      for (const g of unplaced) {
        const cnt = g.remNeed;
        const fit = runs().filter(r => r.len >= cnt).sort((a, b) => a.len - b.len);
        if (fit.length > 0) {
          const t = fit[0], arr = state.boats[t.bIdx][t.sk];
          for (let i = t.st; i < t.st + cnt; i++) {
            arr[i] = { type: "ASSIGNED", guestId: String(g.id), name: g.name, count: Number(g.count), note: g.note };
          }
        } else {
          splits++;
          let rem = cnt;
          for (const r of runs().sort((a, b) => b.len - a.len)) {
            if (rem <= 0) break;
            const take = Math.min(r.len, rem), arr = state.boats[r.bIdx][r.sk];
            for (let i = r.st; i < r.st + take; i++) {
              arr[i] = { type: "ASSIGNED", guestId: String(g.id), name: `${g.name}(分)`, count: Number(g.count), note: g.note };
            }
            rem -= take;
          }
        }
      }

      state.selId = null;
      state.customSplitMode = false;
      save(); render();
      toast(splits > 0 ? `⚠️ 連番空き不足のため${splits}組が分かれて確定しました` : "✅ 残り全員の座席を確定しました！");
    }

    function getFullyPlacedIds() {
      const ids = new Set();
      state.guests.forEach(g => {
        if (countAssignedSeatsForGuest(g.id) >= Number(g.count)) {
          ids.add(String(g.id));
        }
      });
      return ids;
    }

    function getGuestAssignedBoats(guestId) {
      const targetId = String(guestId);
      const names = [];
      state.boats.forEach(b => {
        const found = b.leftSeats.some(c => c && c.type === "ASSIGNED" && String(c.guestId) === targetId)
          || b.rightSeats.some(c => c && c.type === "ASSIGNED" && String(c.guestId) === targetId);
        if (found) names.push(b.name.replace("船", ""));
      });
      return names.join("・");
    }

    function changeCap(bIdx, side, d) {
      const b = state.boats[bIdx], k = side === "left" ? "leftCap" : "rightCap", sk = side === "left" ? "leftSeats" : "rightSeats";
      const nxt = Number(b[k]) + d;
      if (nxt < 1 || nxt > 15) return;
      if (d < 0) {
        const lastSeat = b[sk][b[sk].length - 1];
        if (lastSeat && lastSeat.type === "ASSIGNED") {
          toast(`⚠️ 一番後ろに ${lastSeat.name}様 が座っているため減らせません`);
          return;
        }
      }
      pushUndo(`${b.name}の人数変更`);
      b[k] = nxt;
      while (b[sk].length < nxt) b[sk].push(null);
      if (b[sk].length > nxt) b[sk].length = nxt;
      save(); render();
    }

    function swapCaps(bIdx) {
      const b = state.boats[bIdx], tmp = Number(b.leftCap);
      pushUndo(`${b.name}の左右入替`);
      b.leftCap = Number(b.rightCap); b.rightCap = tmp;
      while (b.leftSeats.length < b.leftCap) b.leftSeats.push(null);
      b.leftSeats.length = b.leftCap;
      while (b.rightSeats.length < b.rightCap) b.rightSeats.push(null);
      b.rightSeats.length = b.rightCap;
      save(); render(); toast("左右の定員を入れ替えました");
    }

    function selectGuestFromModal(id) {
      if (state.menuCollapsed) {
        toast("メニューを開くと座席の割り当てができます");
        return;
      }
      const targetId = String(id);
      if (String(state.selId) === targetId && !state.markMode) {
        state.selId = null;
        state.customSplitMode = false;
      } else {
        state.selId = targetId;
        const g = state.guests.find(x => String(x.id) === targetId);
        const curAssigned = g ? countAssignedSeatsForGuest(g.id) : 0;
        state.customSplitMode = !state.markMode && !!(g && curAssigned > 0 && curAssigned < Number(g.count));
      }
      closeModal("guestListModal");
      render();
      if (state.selId) {
        window.scrollTo({ top: 0, behavior: "smooth" });
        const g = state.guests.find(x => String(x.id) === String(state.selId));
        if (g) {
          if (state.markMode) {
            const mTxt = state.markMode === "BAG" ? "■ 荷物" : "● 店取り";
            toast(`${mTxt}（${g.name}様 ${g.count}名）を付ける席をタップしてください`);
          } else {
            toast(`👤 ${g.name}様(${g.count}名)を選択：座席をタップしてください`);
          }
        }
      }
    }

    function renderGuestListModal() {
      const body = document.getElementById("guestListModalBody");
      const origBtn = document.getElementById("modalOrigImgBtn");
      const hasImg = !!(lastOcrImageDataUrl || state.ocrImage);
      origBtn.style.opacity = hasImg ? "1" : "0.45";

      const placed = getFullyPlacedIds();
      const unplaced = state.guests.filter(g => !placed.has(String(g.id)));
      const placedList = state.guests.filter(g => placed.has(String(g.id)));
      const unpCnt = unplaced.reduce((a, g) => a + Math.max(0, Number(g.count) - countAssignedSeatsForGuest(g.id)), 0);
      const totCnt = state.guests.reduce((a, g) => a + Number(g.count), 0);
      const isAsc = state.sortMode === "asc";

      let listHtml = "";
      if (state.guests.length === 0) {
        listHtml = `<div style="grid-column:1 / -1; font-size:15px;color:var(--sub);padding:20px 10px;text-align:center;">「📷 読込」または「＋ 追加」から予約を入れてください</div>`;
      } else {
        const sortFn = (a, b) => {
          const aDot = (a.note || "").includes("前日場所取") ? 1 : 0;
          const bDot = (b.note || "").includes("前日場所取") ? 1 : 0;
          if (!isAsc && aDot !== bDot) return bDot - aDot;
          return isAsc ? (Number(a.count) - Number(b.count)) : (Number(b.count) - Number(a.count));
        };
        const allSorted = [...[...unplaced].sort(sortFn), ...[...placedList].sort(sortFn)];

        listHtml = allSorted.map(g => {
          const assignedNow = countAssignedSeatsForGuest(g.id);
          const isP = assignedNow >= Number(g.count);
          const isPartial = assignedNow > 0 && !isP;
          const isS = String(state.selId) === String(g.id);
          const hasDot = (g.note || "").includes("前日場所取");
          const boatName = assignedNow > 0 ? getGuestAssignedBoats(g.id) : "";
          const statusText = isP
            ? `✅ 確定済(${boatName})`
            : (isPartial
              ? `⏳ 分割(${assignedNow}/${g.count}・${boatName})`
              : (g.note || "通常予約"));
          const editBtnHtml = state.menuCollapsed
            ? ""
            : `<button type="button" class="g-edit-mini" onclick="event.stopPropagation(); openEdit('${g.id}')">✎</button>`;
          return `
            <div class="g-card-2col ${isS ? 'sel' : ''} ${isP ? 'done' : ''} ${isPartial ? 'partial' : ''}" onclick="selectGuestFromModal('${g.id}')">
              <div class="g-card-top">
                <span class="g-name-txt">${g.name}</span>
                <span class="g-cnt">${g.count}名</span>
              </div>
              <div class="g-card-foot">
                <span class="g-meta ${hasDot ? 'dot-mark' : ''}">${statusText}</span>
                ${editBtnHtml}
              </div>
            </div>
          `;
        }).join("");
      }

      const addBtnHtml = state.menuCollapsed
        ? ""
        : `<button type="button" style="padding:7px 11px; font-size:14px;" onclick="openModal('addModal')">＋ 追加</button>`;

      body.innerHTML = `
        <div class="gs-head">
          <div class="gs-title">未配置 ${unpCnt}名/${unplaced.length}組 ・ 計${totCnt}名</div>
          ${addBtnHtml}
        </div>
        <div class="gs-controls">
          <button type="button" class="primary" style="flex:1; padding:9px; font-size:15px;" onclick="toggleSortOrder()">
            ${isAsc ? "並び順：人数が少ない順 ▲（押して多い順へ）" : "並び順：人数が多い順 ▼（押して少ない順へ）"}
          </button>
          ${state.menuCollapsed ? "" : `<button type="button" style="padding:9px 12px; font-size:14px;" onclick="clearSel(); renderGuestListModal();">選択解除</button>`}
        </div>
        <div class="g-list-2col">${listHtml}</div>
      `;
    }

    function render() {
      applyBoatBodyTheme();

      const topBars = document.getElementById("topBars");
      const main = document.getElementById("main");
      const staffHeaderBtns = document.getElementById("staffHeaderBtns");
      const menuToggleBtn = document.getElementById("menuToggleBtn");

      menuToggleBtn.textContent = state.menuCollapsed ? "メニュー ▼" : "メニュー ▲";
      menuToggleBtn.className = state.menuCollapsed ? "menu-toggle-btn collapsed" : "menu-toggle-btn";
      staffHeaderBtns.style.display = state.menuCollapsed ? "none" : "grid";

      if (state.step === "verify") {
        topBars.style.display = "none";

        if (!state.ocrLoaded && state.guests.length === 0) {
          main.innerHTML = `
            <div class="step-card">
              <div class="step-badge">ステップ 1 / 2：予約表の読込</div>
              <div class="empty-ocr-box">
                <div class="empty-ocr-msg">予約表を読み込んでください</div>
                <div class="empty-ocr-sub">手書きの予約表を撮影・選択すると、AIが自動で人数と名前を読み取ります。</div>
                <button type="button" class="primary" style="width:100%; padding:16px; font-size:18px;" onclick="openModal('ocrModal')">
                  📷 予約表の写真を選択して読み込む
                </button>
              </div>
              <button type="button" style="width:100%; padding:13px; font-size:15px;" onclick="openModal('addModal')">
                ＋ 写真を使わず手入力で1組ずつ追加する
              </button>
            </div>
          `;
          return;
        }

        const totCnt = state.guests.reduce((a, g) => a + Number(g.count), 0);
        const writtenInfo = state.ocrWrittenTotal ? `（予約表の記載合計：${state.ocrWrittenTotal}名）` : "";
        main.innerHTML = `
          <div class="step-card">
            <div class="step-badge">ステップ 1 / 2：予約データの確認</div>
            <div class="w-title">📋 読み取った予約の確認・修正</div>
            <div class="w-sub">別枠や間違いがあれば「除外」や人数変更で調整し、合計人数を確認してから確定してください。</div>

            <div class="verify-summary">
              <div>
                <div style="font-size:14px; color:#93c5fd; font-weight:700;">現在の予約合計 ${writtenInfo}</div>
                <div style="font-size:24px; font-weight:800; color:#fff;">${totCnt} 名 <span style="font-size:16px; color:var(--sub);">（${state.guests.length} 組）</span></div>
              </div>
              <button type="button" onclick="openModal('addModal')">＋ 1組追加</button>
            </div>

            ${state.guests.map(g => `
              <div class="verify-row">
                <div class="verify-info" onclick="openEdit('${g.id}')">
                  <div class="verify-name">${g.name} <span style="font-size:13px; color:#38bdf8; font-weight:600;">✎</span></div>
                  ${g.note ? `<div class="verify-note">${g.note}</div>` : `<div style="font-size:13px; color:var(--sub);">メモなし</div>`}
                </div>
                <div class="verify-ctrl">
                  <button type="button" onclick="adjustVerifyCount('${g.id}', -1)">−</button>
                  <b style="min-width:36px; text-align:center; font-size:18px;">${g.count}名</b>
                  <button type="button" onclick="adjustVerifyCount('${g.id}', 1)">＋</button>
                  <button type="button" class="danger" style="padding:6px 9px; font-size:13px; margin-left:4px;" onclick="removeVerifyGuest('${g.id}')">除外</button>
                </div>
              </div>
            `).join("")}

            <button type="button" class="success" style="width:100%; padding:15px; font-size:18px; margin-top:12px;" onclick="confirmVerifiedGuests()">
              ✅ この内容（計${totCnt}名）で確定して船を選ぶ ▶
            </button>
          </div>
        `;
        return;
      }

      if (state.step === "boats") {
        topBars.style.display = "none";
        const totalCap = draftBoats.reduce((a, b) => a + (Number(b.leftCap) || 0) + (Number(b.rightCap) || 0), 0);
        const totalGuests = state.guests.reduce((a, g) => a + Number(g.count), 0);
        const diff = totalCap - totalGuests;

        let matchClass = "match-box";
        let matchText = `予約合計：${totalGuests}名 ／ 選択した船の席数合計：${totalCap}席`;
        if (draftBoats.length === 0) {
          matchText = `予約合計：${totalGuests}名 ／ 出船する船を選択してください`;
        } else if (totalGuests > 0) {
          if (diff === 0) {
            matchClass += " ok";
            matchText = `✅ ぴったり一致！ 予約 ${totalGuests}名 ＝ 船の席数 ${totalCap}席`;
          } else if (diff > 0) {
            matchClass += " ok";
            matchText = `予約 ${totalGuests}名 ／ 船の席数 ${totalCap}席（空き余裕 ${diff}席）`;
          } else {
            matchClass += " warn";
            matchText = `⚠️ 席数が ${Math.abs(diff)}席 足りません（予約 ${totalGuests}名 ＞ 船の席数 ${totalCap}席）`;
          }
        }

        const canStart = draftBoats.length > 0 && draftBoats.every(b => (Number(b.leftCap) || 0) > 0 && (Number(b.rightCap) || 0) > 0);

        main.innerHTML = `
          <div class="step-card">
            <div class="step-badge">ステップ 2 / 2：配船と人数指定</div>
            <div class="w-title">🚢 出船する船と人数を指定</div>
            <div class="w-sub">出船する船をタップして選び、各船の左舷・右舷の人数を入力してください。</div>

            <div class="${matchClass}">${matchText}</div>

            <div class="boat-grid">
              ${BOAT_LIST.map(n => {
                const on = draftBoats.some(b => b.name === n);
                return `<button type="button" class="b-pick ${on ? 'on' : ''}" onclick="toggleDraftBoat('${n}')">${n}</button>`;
              }).join("")}
            </div>

            ${draftBoats.length === 0 ? `
              <div style="text-align:center; padding:18px 10px; color:var(--sub); background:var(--inp); border-radius:10px; border:1px dashed var(--bd);">
                上の船名ボタンをタップすると、左右の人数入力欄が表示されます
              </div>
            ` : draftBoats.map((b, i) => {
              const lc = Number(b.leftCap) || 0;
              const rc = Number(b.rightCap) || 0;
              return `
                <div class="w-boat-row">
                  <div class="w-boat-top"><span>${b.name}</span><span style="font-size:16px;color:#38bdf8;">計 ${lc + rc}名枠</span></div>
                  <div class="w-caps">
                    <div class="w-cap-box">
                      <div style="font-size:14px;color:var(--sub);">左舷</div>
                      <div class="w-cap-ctrl">
                        <button type="button" onclick="changeDraftCap(${i},'left',-1)">−</button>
                        <input type="number" class="cap-num-inp" min="0" max="15" value="${lc === 0 ? '' : lc}" placeholder="0" onchange="setDraftCapInput(${i},'left',this.value)" />
                        <button type="button" onclick="changeDraftCap(${i},'left',1)">＋</button>
                      </div>
                    </div>
                    <div class="w-cap-box">
                      <div style="font-size:14px;color:var(--sub);">右舷</div>
                      <div class="w-cap-ctrl">
                        <button type="button" onclick="changeDraftCap(${i},'right',-1)">−</button>
                        <input type="number" class="cap-num-inp" min="0" max="15" value="${rc === 0 ? '' : rc}" placeholder="0" onchange="setDraftCapInput(${i},'right',this.value)" />
                        <button type="button" onclick="changeDraftCap(${i},'right',1)">＋</button>
                      </div>
                    </div>
                  </div>
                </div>
              `;
            }).join("")}

            <div style="display:flex; gap:8px; margin-top:14px;">
              <button type="button" style="padding:14px 12px;" onclick="goStep('verify')">◀ 予約確認</button>
              <button type="button" class="primary" style="flex:1; padding:15px; font-size:18px;" ${canStart ? "" : "disabled"} onclick="startWithDraft()">
                ✅ この配船で座席表を開始する
              </button>
            </div>
          </div>
        `;
        return;
      }

      topBars.style.display = "block";

      const staffModeBar = document.getElementById("staffModeBar");
      staffModeBar.style.display = state.menuCollapsed ? "none" : "flex";

      const bagBtn = document.getElementById("bagModeBtn");
      bagBtn.className = state.markMode === "BAG" ? "bag-btn on" : "bag-btn";
      bagBtn.textContent = state.markMode === "BAG" ? "■ 荷物：ON（席タップ）" : "■ 荷物：OFF";

      const shopBtn = document.getElementById("shopModeBtn");
      shopBtn.className = state.markMode === "SHOP" ? "shop-btn on" : "shop-btn";
      shopBtn.textContent = state.markMode === "SHOP" ? "● 店取り：ON（席タップ）" : "● 店取り：OFF";

      const undoBtn = document.getElementById("undoBtn");
      undoBtn.disabled = undoStack.length === 0;
      undoBtn.textContent = undoStack.length > 0 ? `↩ 1つ前に戻す(${undoStack.length})` : "↩ 1つ前に戻す";

      let tabsHtml = `<button type="button" class="tab ${state.view === 'overview' ? 'active' : ''}" onclick="setView('overview')"><span class="tab-ship-label">全体</span><span class="tab-emp-label">${state.boats.length}隻</span></button>`;
      state.boats.forEach(b => {
        const emp = b.leftSeats.filter(x => !x).length + b.rightSeats.filter(x => !x).length;
        const code = getBoatCode(b.name);
        const tCls = code ? `t-${code}` : "";
        tabsHtml += `<button type="button" class="tab ${tCls} ${state.view === b.name ? 'active' : ''}" onclick="setView('${b.name}')"><span class="tab-ship-label">${b.name}</span><span class="tab-emp-label">空${emp}</span></button>`;
      });
      document.getElementById("boatTabs").innerHTML = tabsHtml;

      const placed = getFullyPlacedIds();
      const unplaced = state.guests.filter(g => !placed.has(String(g.id)));
      const unpCnt = unplaced.reduce((a, g) => a + Math.max(0, Number(g.count) - countAssignedSeatsForGuest(g.id)), 0);
      const totCnt = state.guests.reduce((a, g) => a + Number(g.count), 0);
      const quickBtn = document.getElementById("quickGuestBtn");
      quickBtn.textContent = `📋 予約一覧（未配置 ${unpCnt}名 / 計${totCnt}名）`;

      const selG = !state.menuCollapsed ? state.guests.find(g => String(g.id) === String(state.selId)) : null;
      let selBannerHtml = "";
      if (selG) {
        const assignedNow = countAssignedSeatsForGuest(selG.id);
        const remNow = Math.max(0, Number(selG.count) - assignedNow);
        const showCustomBtn = !state.markMode && Number(selG.count) >= 2;
        const subGuide = state.markMode
          ? `▼ ${state.markMode === "BAG" ? "■ 荷物" : "● 店取り"}（${selG.name}様 ${selG.count}名）を付ける席をタップ`
          : (state.customSplitMode
            ? "▼ 1席ずつ好きな場所をタップ（左右・別船に分けて配置できます）"
            : "▼ 配置したい座席をタップ（横並び一括で入ります）");
        selBannerHtml = `
          <div class="selected-banner">
            <div class="selected-banner-top">
              <div>
                <div class="selected-banner-info">
                  👤 ${selG.name}様 (${selG.count}名)
                  ${state.customSplitMode ? `<span style="font-size:14px; color:#fed7aa;">［残り ${remNow}名］</span>` : ""}
                </div>
                <div class="selected-banner-sub">${subGuide}</div>
              </div>
              <button type="button" onclick="clearSel()" style="padding:8px 12px; font-size:14px; background:rgba(0,0,0,0.35); border-color:#93c5fd; flex-shrink:0;">解除</button>
            </div>
            ${showCustomBtn ? `
              <button type="button" class="custom-split-btn ${state.customSplitMode ? 'on' : ''}" onclick="toggleCustomSplitMode()">
                ${state.customSplitMode
                  ? "🔀 バラバラ配置（カスタム）：ON中（押すと連番一括に戻る）"
                  : "🔀 左右や別席に分ける（バラバラ配置：OFF）"}
              </button>
            ` : ""}
          </div>
        `;
      }

      const hl = {};
      if (selG && !state.markMode) {
        if (state.customSplitMode) {
          state.boats.forEach((b, bi) => ["leftSeats", "rightSeats"].forEach(sk => {
            b[sk].forEach((c, i) => {
              if (c === null) hl[`${bi}-${sk}-${i}`] = "fit-ok";
            });
          }));
        } else {
          const cnt = Number(selG.count) || 1;
          state.boats.forEach((b, bi) => ["leftSeats", "rightSeats"].forEach(sk => {
            for (let i = 0; i <= b[sk].length - cnt; i++) {
              const ev = evalPlace(bi, sk, i, selG);
              if (ev.valid) {
                for (let k = i; k < i + cnt; k++) {
                  const key = `${bi}-${sk}-${k}`;
                  if (!hl[key] || ev.fits) hl[key] = ev.fits ? "fit-ok" : "fit-warn";
                }
              }
            }
          }));
        }
      }

      let seatsSectionHtml = "";
      if (state.view === "overview") {
        seatsSectionHtml = state.boats.map((b, bi) => {
          const le = b.leftSeats.filter(x => !x).length, re = b.rightSeats.filter(x => !x).length;
          const code = getBoatCode(b.name);
          const cardCls = code ? `card-${code}` : "";
          return `
            <div class="ov-card ${cardCls}">
              <div class="ov-head">
                <b style="font-size:19px;">🚢 ${b.name}</b>
                <div style="display:flex; align-items:center; gap:8px;">
                  <span style="font-size:14px;color:var(--sub);">左空:<b style="color:#38bdf8;">${le}</b>/${b.leftCap} 右空:<b style="color:#38bdf8;">${re}</b>/${b.rightCap}</span>
                  <button type="button" style="padding:5px 9px; font-size:13px;" onclick="setView('${b.name}')">詳細▶</button>
                </div>
              </div>
              <div class="mini-hull">
                <div><div style="font-size:13px;color:var(--sub);text-align:center;margin-bottom:4px;font-weight:700;">▲ 左舷</div>
                  ${b.leftSeats.map((c, i) => miniBtnHtml(bi, "leftSeats", c, i, hl[`${bi}-leftSeats-${i}`])).join("")}
                </div>
                <div><div style="font-size:13px;color:var(--sub);text-align:center;margin-bottom:4px;font-weight:700;">▲ 右舷</div>
                  ${b.rightSeats.map((c, i) => miniBtnHtml(bi, "rightSeats", c, i, hl[`${bi}-rightSeats-${i}`])).join("")}
                </div>
              </div>
            </div>
          `;
        }).join("");
      } else {
        const bi = state.boats.findIndex(b => b.name === state.view);
        if (bi === -1) { state.view = "overview"; render(); return; }
        const b = state.boats[bi];
        const capEditBar = state.menuCollapsed ? "" : `
          <div style="background:rgba(19, 28, 49, 0.9);padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);">
            <div style="display:flex;gap:8px;align-items:center;">
              <div style="flex:1;text-align:center;"><div style="font-size:13px;color:var(--sub);">左舷</div>
                <div style="display:flex;justify-content:center;align-items:center;gap:10px;margin-top:4px;font-size:19px;">
                  <button type="button" style="padding:5px 12px;font-size:18px;" onclick="changeCap(${bi},'left',-1)">−</button><b>${b.leftCap}</b><button type="button" style="padding:5px 12px;font-size:18px;" onclick="changeCap(${bi},'left',1)">＋</button>
                </div>
              </div>
              <button type="button" style="padding:9px;font-size:14px;" onclick="swapCaps(${bi})">⇄<br>入替</button>
              <div style="flex:1;text-align:center;"><div style="font-size:13px;color:var(--sub);">右舷</div>
                <div style="display:flex;justify-content:center;align-items:center;gap:10px;margin-top:4px;font-size:19px;">
