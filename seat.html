<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b1120" />
  <title>山下丸 釣り座管理</title>
  <style>
    :root {
      --bg: #0b1120; --card: #131c31; --panel: #1a253c; --inp: #0f172a;
      --bd: #2c3e5e; --tx: #f1f5f9; --sub: #94a3b8;
      --blue: #2563eb; --blue-bg: #172e66;
      --green: #10b981; --green-bg: #064e3b;
      /* 荷物（四角■）用：シアン・青緑系 */
      --bag-bd: #06b6d4; --bag-bg: #083344; --bag-tx: #67e8f9;
      /* 店取り（丸●）用：オレンジ・アンバー系 */
      --shop-bd: #f59e0b; --shop-bg: #451a03; --shop-tx: #fcd34d;
      --red: #ef4444;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; overflow-x: hidden;
      background: var(--bg); color: var(--tx);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 18px; line-height: 1.45;
    }
    body { padding-bottom: 48px; }

    /* ヘッダー（2段構成＋右上メニュー開閉ボタン） */
    header {
      position: sticky; top: 0; z-index: 50; background: #070b14;
      border-bottom: 1px solid var(--bd); padding: 8px 10px 9px;
    }
    .h-top {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      white-space: nowrap;
    }
    .h-brand {
      display: flex; align-items: center; gap: 7px; min-width: 0;
    }
    .h-icon { font-size: 22px; line-height: 1; }
    .h-ship { font-size: 20px; font-weight: 900; color: #ffffff; letter-spacing: 0.04em; }
    .h-sub {
      font-size: 14px; font-weight: 800; color: #38bdf8;
      background: #0f172a; border: 1px solid var(--bd); padding: 2px 8px; border-radius: 6px;
    }
    .menu-toggle-btn {
      padding: 7px 11px; font-size: 14px; font-weight: 800;
      border-radius: 8px; border: 1px solid #38bdf8;
      background: #0f172a; color: #e0f2fe; flex-shrink: 0;
    }
    .menu-toggle-btn.collapsed {
      background: #064e3b; border-color: #10b981; color: #6ee7b7;
    }

    /* 2段目操作ボタン群：左＝読込、中＝設定、右＝予約表 */
    .h-btns {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%;
      margin-top: 8px;
    }
    .h-btns button {
      width: 100%; padding: 11px 4px; font-size: 16px; font-weight: 800;
    }

    button {
      background: var(--panel); color: var(--tx); border: 1px solid var(--bd);
      border-radius: 9px; padding: 10px 11px; font-size: 15px; font-weight: 700;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      touch-action: manipulation; font-family: inherit;
    }
    button:active { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: var(--blue); border-color: #3b82f6; color: #fff; }
    button.success { background: #059669; border-color: var(--green); color: #fff; }
    button.warning { background: #d97706; border-color: var(--shop-bd); color: #fff; }
    button.danger { background: #b91c1c; border-color: var(--red); color: #fff; }

    .container { padding: 10px; width: 100%; max-width: 560px; margin: 0 auto; }

    /* ステップカード（①読取確認 / ②配船指定） */
    .step-card { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .step-badge { display: inline-block; font-size: 13px; font-weight: 800; background: var(--blue-bg); color: #93c5fd; border: 1px solid #3b82f6; padding: 2px 8px; border-radius: 6px; margin-bottom: 6px; }
    .w-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .w-sub { font-size: 14px; color: var(--sub); margin-bottom: 12px; }

    /* 未読込時の案内ボックス */
    .empty-ocr-box {
      background: linear-gradient(135deg, #0f172a, #172554);
      border: 2px dashed #3b82f6; border-radius: 14px;
      padding: 28px 16px; text-align: center; margin: 8px 0 12px;
    }
    .empty-ocr-msg { font-size: 21px; font-weight: 900; color: #ffffff; margin-bottom: 8px; }
    .empty-ocr-sub { font-size: 14px; color: #cbd5e1; margin-bottom: 18px; }

    /* 読取確認リスト */
    .verify-summary {
      background: var(--inp); border: 2px solid #3b82f6; border-radius: 10px;
      padding: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
    }
    .verify-row {
      background: var(--inp); border: 1px solid var(--bd); border-radius: 10px;
      padding: 10px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .verify-info { flex: 1; min-width: 0; }
    .verify-name { font-size: 18px; font-weight: 800; color: #fff; }
    .verify-note { font-size: 13px; color: #fcd34d; margin-top: 2px; }
    .verify-ctrl { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .verify-ctrl button { padding: 6px 11px; font-size: 16px; }

    /* 配船指定 */
    .match-box {
      border-radius: 10px; padding: 11px 12px; margin-bottom: 12px; font-size: 15px; font-weight: 800;
      border: 2px solid var(--bd); background: var(--inp);
    }
    .match-box.ok { border-color: var(--green); background: var(--green-bg); color: #6ee7b7; }
    .match-box.warn { border-color: var(--shop-bd); background: var(--shop-bg); color: #fcd34d; }
    .boat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .b-pick {
      width: 100%; padding: 14px 6px; border-radius: 10px; border: 2px solid var(--bd);
      background: var(--inp); color: var(--sub); font-size: 17px; font-weight: 800;
    }
    .b-pick.on { background: var(--blue-bg); border-color: #3b82f6; color: #fff; }
    .w-boat-row {
      background: var(--inp); border: 1px solid var(--bd); border-radius: 10px;
      padding: 11px; margin-bottom: 10px;
    }
    .w-boat-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 18px; font-weight: 800; }
    .w-caps { display: flex; gap: 8px; }
    .w-cap-box { flex: 1; background: var(--card); padding: 8px; border-radius: 8px; text-align: center; }
    .w-cap-ctrl { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 4px; }
    .w-cap-ctrl button { padding: 7px 13px; font-size: 20px; }
    .cap-num-inp {
      width: 54px !important; text-align: center; font-size: 20px !important; font-weight: 900;
      padding: 6px 2px !important; background: #070b14 !important; border: 1px solid #3b82f6 !important; color: #fff !important;
    }

    /* 選択中ガイドバー */
    .selected-banner {
      position: sticky; top: 96px; z-index: 40;
      background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
      border: 2px solid #60a5fa; border-radius: 12px; padding: 11px 12px;
      margin-bottom: 12px; color: #fff;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }
    .selected-banner-info { font-size: 17px; font-weight: 800; line-height: 1.35; }
    .selected-banner-sub { font-size: 13px; color: #dbeafe; font-weight: 600; }

    /* 確定アラートバナー */
    .lock-banner {
      background: linear-gradient(135deg, #451a03, #78350f);
      border: 2px solid #f59e0b; border-radius: 12px; padding: 13px;
      margin-bottom: 12px; color: #fef3c7;
    }
    .lock-banner-title { font-size: 17px; font-weight: 800; color: #fcd34d; margin-bottom: 5px; }
    .lock-banner-desc { font-size: 15px; margin-bottom: 10px; line-height: 1.45; }

    /* 操作バー（荷物■ / 店取り● の半分幅2分割＋残り自動確定） */
    .mode-bar {
      display: flex; flex-direction: column; padding: 8px 10px;
      background: var(--card); border-bottom: 1px solid var(--bd); gap: 7px;
    }
    .mark-split {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%;
    }
    .bag-btn {
      padding: 11px 6px; font-size: 15px; font-weight: 800;
      border: 2px solid var(--bd); background: var(--inp); color: var(--sub);
    }
    .bag-btn.on {
      background: var(--bag-bg); border-color: var(--bag-bd); color: var(--bag-tx);
      box-shadow: 0 0 0 1px var(--bag-bd) inset;
    }
    .shop-btn {
      padding: 11px 6px; font-size: 15px; font-weight: 800;
      border: 2px solid var(--bd); background: var(--inp); color: var(--sub);
    }
    .shop-btn.on {
      background: var(--shop-bg); border-color: var(--shop-bd); color: var(--shop-tx);
      box-shadow: 0 0 0 1px var(--shop-bd) inset;
    }

    /* 常時表示の船タブ（全体＋出船する船） */
    .tabs {
      display: flex; overflow-x: auto; background: #0d1526;
      border-bottom: 1px solid var(--bd); padding: 6px 8px; gap: 6px;
    }
    .tab {
      flex: 1; min-width: 78px; padding: 10px 6px; border-radius: 8px;
      background: var(--card); border: 1px solid var(--bd); text-align: center;
      font-size: 15px; font-weight: 700; color: var(--sub); flex-direction: column; line-height: 1.25;
    }
    .tab.active { background: var(--blue); border-color: #60a5fa; color: #fff; }

    /* 全体俯瞰（1マス縦幅48px） */
    .ov-card { background: var(--card); border: 1px solid var(--bd); border-radius: 12px; padding: 12px; margin-bottom: 14px; }
    .ov-head {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--bd);
    }
    .mini-hull { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mini-seat {
      width: 100%; height: 48px; border-radius: 8px; background: var(--inp); border: 2px solid #263552;
      display: flex; align-items: center; justify-content: space-between; padding: 0 10px;
      font-size: 16px; font-weight: 800; color: var(--sub); margin-bottom: 6px;
    }
    .mini-seat.bag {
      background: var(--bag-bg); border-color: var(--bag-bd); color: var(--bag-tx);
    }
    .mini-seat.shop {
      background: var(--shop-bg); border-color: var(--shop-bd); color: var(--shop-tx);
    }
    .mini-seat.assigned { background: var(--blue-bg); border-color: #3b82f6; color: #ffffff; }
    .mini-seat.fit-ok { background: var(--green-bg); border-color: var(--green); color: #6ee7b7; }
    .mini-seat.fit-warn { background: #3f3208; border-color: #eab308; color: #fde047; }

    /* 1隻詳細 */
    .bow-bar {
      text-align: center; font-size: 15px; font-weight: 800; color: #38bdf8;
      padding: 8px; background: #0d172a; border: 1px solid var(--bd); border-radius: 8px; margin: 10px 0;
    }
    .hull { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .seat {
      width: 100%; min-height: 68px; border-radius: 10px; background: var(--inp); border: 2px solid #263552;
      padding: 8px 10px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
      margin-bottom: 8px; text-align: left;
    }
    .seat.bag { background: var(--bag-bg); border-color: var(--bag-bd); }
    .seat.shop { background: var(--shop-bg); border-color: var(--shop-bd); }
    .seat.assigned { background: var(--blue-bg); border-color: #3b82f6; }
    .seat.fit-ok { background: var(--green-bg); border-color: var(--green); }
    .seat.fit-warn { background: #3b2f06; border-color: #eab308; }
    .s-pos { font-size: 13px; color: var(--sub); font-weight: 700; }
    .s-name { font-size: 17px; font-weight: 800; color: #fff; margin-top: 2px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { display: inline-block; font-size: 12px; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,0.18); margin-right: 4px; margin-top: 2px; }

    /* 予約一覧セクション（メニュー展開時表示） */
    .guest-section {
      background: #070b14; border: 2px solid var(--bd); border-radius: 14px;
      padding: 12px; margin-top: 16px;
    }
    .gs-head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; margin-bottom: 10px; flex-wrap: wrap;
    }
    .gs-title { font-size: 17px; font-weight: 800; color: #38bdf8; }
    .gs-controls { display: flex; gap: 6px; margin-bottom: 10px; }
    .g-list { display: flex; flex-direction: column; gap: 8px; }
    .g-row-wrap { display: flex; align-items: stretch; gap: 6px; }
    .g-row-btn {
      flex: 1; min-width: 0; background: var(--card); border: 2px solid var(--bd);
      border-radius: 12px; padding: 12px;
      display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
      text-align: left;
    }
    .g-row-btn.sel { background: #1e3a8a; border-color: #60a5fa; }
    .g-row-btn.done { opacity: 0.45; border-style: dashed; }
    .g-row-top { display: flex; align-items: center; gap: 8px; width: 100%; }
    .g-name-txt { font-size: 19px; font-weight: 800; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .g-cnt { background: var(--blue); color: #fff; padding: 2px 9px; border-radius: 7px; font-size: 15px; font-weight: 800; flex-shrink: 0; }
    .g-meta { font-size: 14px; color: #cbd5e1; margin-top: 4px; }
    .g-meta.dot-mark { color: #fcd34d; font-weight: 700; }

    /* 予約表ビュー（忠実一括表示＋横棒＆号数表示） */
    .sheet-summary {
      background: var(--inp); border: 1px solid var(--bd); border-radius: 10px;
      padding: 10px 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .sheet-row {
      background: var(--inp); border: 1px solid var(--bd); border-radius: 9px;
      padding: 9px 11px; margin-bottom: 7px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .sheet-row.done-row { background: #0a101d; border-color: #1e293b; }
    .sheet-idx { font-size: 13px; color: var(--sub); font-weight: 700; min-width: 24px; }
    .sheet-main { flex: 1; min-width: 0; }
    .sheet-name-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .strike-name {
      position: relative; display: inline-block; color: #cbd5e1;
    }
    .strike-name::after {
      content: ""; position: absolute; left: -3px; right: -3px; top: 52%;
      height: 3px; background: #ef4444; border-radius: 2px; pointer-events: none;
    }
    .boat-tag {
      font-size: 13px; font-weight: 800; padding: 2px 8px; border-radius: 6px;
      background: #1e3a8a; border: 1px solid #3b82f6; color: #93c5fd; white-space: nowrap;
    }
    .sheet-note { font-size: 13px; color: #fcd34d; margin-top: 2px; }

    /* モーダル */
    .modal-bg { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.84); display: none; align-items: center; justify-content: center; padding: 10px; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 14px; }
    .m-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bd); padding-bottom: 8px; margin-bottom: 12px; font-weight: 800; font-size: 18px; gap: 8px; }
    .field { margin-bottom: 13px; }
    .field label { display: block; font-size: 14px; color: var(--sub); margin-bottom: 5px; font-weight: 700; }
    input[type="text"], input[type="password"], input[type="number"], textarea, select {
      width: 100%; background: var(--inp); border: 1px solid var(--bd); color: var(--tx);
      border-radius: 8px; padding: 11px; font-size: 17px;
    }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; background: var(--inp); border: 1px solid var(--bd); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .toast {
      position: fixed; top: 96px; left: 50%; transform: translateX(-50%); z-index: 200;
      background: #1e293b; border: 1px solid #475569; color: #fff; padding: 11px 18px;
      border-radius: 10px; font-size: 15px; font-weight: 700; display: none; max-width: 92vw; text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="h-top">
      <div class="h-brand">
        <span class="h-icon">🚢</span>
        <span class="h-ship">山下丸</span>
        <span class="h-sub">釣り座管理</span>
      </div>
      <button type="button" id="menuToggleBtn" class="menu-toggle-btn" onclick="toggleMenuCollapse()">メニュー ▲</button>
    </div>
    <!-- 2段目ボタン：左＝読込、真ん中＝設定、右＝予約表（メニュー収納時は非表示） -->
    <div class="h-btns" id="staffHeaderBtns">
      <button type="button" onclick="openModal('ocrModal')">📷 読込</button>
      <button type="button" onclick="openModal('setupModal')">⚙ 設定</button>
      <button type="button" class="primary" onclick="openModal('sheetModal')">📄 予約表</button>
    </div>
  </header>

  <div id="topBars" style="display:none;">
    <!-- スタッフ操作バー（メニュー収納時は非表示） -->
    <div class="mode-bar" id="staffModeBar">
      <div class="mark-split">
        <button type="button" id="bagModeBtn" class="bag-btn" onclick="toggleMarkMode('BAG')">■ 荷物：OFF</button>
        <button type="button" id="shopModeBtn" class="shop-btn" onclick="toggleMarkMode('SHOP')">● 店取り：OFF</button>
      </div>
      <button type="button" class="success" style="width:100%; padding:11px;" onclick="autoAssign(true)">✨ 残り自動確定</button>
    </div>
    <!-- 常時表示の船タブ（全体＋出船する船） -->
    <div class="tabs" id="boatTabs"></div>
  </div>

  <div class="container" id="main"></div>

  <div class="toast" id="toast"></div>

  <!-- 設定モーダル（32号船連携・配船・API設定） -->
  <div class="modal-bg" id="setupModal">
    <div class="modal">
      <div class="m-head"><span>⚙ 設定・配船・連携</span><button type="button" onclick="closeModal('setupModal')">閉じる</button></div>

      <!-- 32号船連携エリア（設定内に配置） -->
      <div style="background:var(--inp); border:1px solid #3b82f6; border-radius:10px; padding:11px; margin-bottom:13px;">
        <div style="font-size:15px; font-weight:800; color:#93c5fd; margin-bottom:8px;">📤 32号船 釣果アプリ連携</div>
        <textarea id="expArea" rows="5" readonly style="font-family:monospace; font-size:12px;"></textarea>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button type="button" class="primary" style="flex:1; padding:9px;" onclick="copyExp()">📋 コピー</button>
          <button type="button" class="success" style="flex:1; padding:9px;" onclick="saveExp()">💾 共有領域に保存</button>
        </div>
      </div>

      <div class="toggle-row" onclick="toggleAutoLock()">
        <div>
          <div style="font-size:16px; font-weight:800;">🔒 選択肢ゼロ時の自動確定</div>
          <div style="font-size:13px; color:var(--sub);">自由選択が不可能になったら自動で席を確定する</div>
        </div>
        <button type="button" id="autoLockToggleBtn" class="primary" style="min-width:68px;">OFF</button>
      </div>
      <div class="field">
        <label>AI解析モデル</label>
        <select id="modelSelect" onchange="saveModel()">
          <option value="gemini-4-hydrogen">Gemini 4 Hydrogen (標準・高速)</option>
          <option value="gemini-4-neon">Gemini 4 Neon (高精度)</option>
          <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
        </select>
      </div>
      <div class="field">
        <label>Gemini APIキー（予約表の写真解析用）</label>
        <input type="password" id="apiKeyInput" placeholder="AIzaSy..." onchange="saveKey()" />
      </div>
      <div style="display:flex; flex-direction:column; gap:8px; margin-top:12px;">
        <button type="button" class="primary" style="padding:13px;" onclick="goStep('verify')">📋 読取予約の確認・修正画面へ戻る</button>
        <button type="button" class="primary" style="padding:13px;" onclick="goStep('boats')">🚢 出船する船・人数を選び直す</button>
        <button type="button" class="danger" style="padding:13px;" onclick="resetSeatsOnly()">座席の配置だけ全て空に戻す</button>
        <button type="button" class="danger" style="padding:13px; background:#7f1d1d;" onclick="resetAllNewDay()">🗑 予約と座席をすべて初期化（新営業日）</button>
      </div>
    </div>
  </div>

  <!-- 予約表ビューモーダル（忠実一括表示＋横棒＆号数＋ワンタップ元画像） -->
  <div class="modal-bg" id="sheetModal">
    <div class="modal">
      <div class="m-head">
        <span>📄 予約表（読取一覧）</span>
        <div style="display:flex; gap:6px;">
          <button type="button" class="warning" id="openOrigImgBtn" onclick="openOrigImage()" style="padding:7px 10px; font-size:14px;">🖼 元画像</button>
          <button type="button" onclick="closeModal('sheetModal')" style="padding:7px 10px; font-size:14px;">閉じる</button>
        </div>
      </div>
      <div id="sheetModalBody"></div>
    </div>
  </div>

  <!-- 元画像フル確認モーダル -->
  <div class="modal-bg" id="origImgModal" style="z-index:120;">
    <div class="modal" style="max-width:540px; padding:12px;">
      <div class="m-head">
        <span>🖼 読み込んだ予約表（元画像）</span>
        <button type="button" class="primary" onclick="closeModal('origImgModal')">一覧へ戻る</button>
      </div>
      <div id="origImgContainer" style="text-align:center;"></div>
    </div>
  </div>

  <!-- OCR読込モーダル -->
  <div class="modal-bg" id="ocrModal">
    <div class="modal">
      <div class="m-head"><span>📷 予約表の写真読込</span><button type="button" onclick="closeModal('ocrModal')">閉じる</button></div>
      <div class="field"><label>対象魚種（ヒント）</label><input type="text" id="fishInput" value="カワハギ" /></div>
      <div class="field"><label>予約表の写真を選択</label><input type="file" id="ocrFile" accept="image/*" /></div>
      <button type="button" class="primary" style="width:100%; padding:13px;" id="ocrBtn" onclick="runOcr()">AIで解析する</button>
      <div id="ocrMsg" style="margin-top:10px; font-size:15px;"></div>
    </div>
  </div>

  <!-- 手動追加モーダル -->
  <div class="modal-bg" id="addModal">
    <div class="modal">
      <div class="m-head"><span>＋ 予約グループ追加</span><button type="button" onclick="closeModal('addModal')">閉じる</button></div>
      <div class="field"><label>代表者名</label><input type="text" id="addName" placeholder="例：井部" /></div>
      <div class="field"><label>人数</label><input type="number" id="addCount" value="1" min="1" max="15" /></div>
      <div class="field"><label>メモ（前日場所取 / 竿 / カラ）</label><input type="text" id="addNote" /></div>
      <button type="button" class="primary" style="width:100%; padding:13px;" onclick="addGuest()">追加する</button>
    </div>
  </div>

  <!-- 編集・削除モーダル -->
  <div class="modal-bg" id="editModal">
    <div class="modal">
      <div class="m-head"><span>✎ 予約の修正・削除</span><button type="button" onclick="closeModal('editModal')">閉じる</button></div>
      <input type="hidden" id="editId" />
      <div class="field"><label>代表者名</label><input type="text" id="editName" /></div>
      <div class="field">
        <label>人数</label>
        <div style="display:flex; gap:10px; align-items:center;">
          <button type="button" style="padding:11px 20px; font-size:20px;" onclick="stepEdit(-1)">−</button>
          <input type="number" id="editCount" min="1" max="15" style="text-align:center; font-weight:800;" />
          <button type="button" style="padding:11px 20px; font-size:20px;" onclick="stepEdit(1)">＋</button>
        </div>
      </div>
      <div class="field"><label>メモ</label><input type="text" id="editNote" /></div>
      <div style="display:flex; gap:8px;">
        <button type="button" class="danger" style="flex:1; padding:13px;" onclick="delGuest()">🗑 削除</button>
        <button type="button" class="primary" style="flex:1; padding:13px;" onclick="saveEdit()">✅ 保存</button>
      </div>
    </div>
  </div>

  <script>
    const BOAT_LIST = ["32号船", "31号船", "27号船", "25号船", "智丸"];
    const STORE_KEY = "yamashitamaru_seat_flow_v6";
    const SHARED_32 = "yamashitamaru_seat_32_export";

    let draftBoats = [];
    let uidCounter = 1;
    let lastOcrImageDataUrl = null;

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    let state = {
      savedDate: getTodayStr(),
      step: "verify",
      ocrLoaded: false,
      ocrWrittenTotal: null,
      ocrImage: null,
      menuCollapsed: false, // false: メニュー ▲（展開）, true: メニュー ▼（収納）
      autoLockEnabled: false,
      sortByCount: true,
      view: "overview",
      markMode: null,
      selId: null,
      boats: [],
      guests: []
    };

    function makeUniqueId(prefix) {
      uidCounter += 1;
      return `${prefix}_${Date.now()}_${uidCounter}`;
    }

    function normalizeGuests(list) {
      const seen = new Set();
      return (list || []).map(g => {
        let id = String(g.id || "");
        if (!id || seen.has(id)) id = makeUniqueId("g");
        seen.add(id);
        return {
          id,
          name: String(g.name || "").trim(),
          count: Math.min(15, Math.max(1, parseInt(g.count, 10) || 1)),
          note: String(g.note || "").trim()
        };
      });
    }

    function isMarkSeat(c) {
      return c && (c.type === "BAG" || c.type === "SHOP" || c.type === "HOLD");
    }

    function init() {
      const today = getTodayStr();
      const saved = localStorage.getItem(STORE_KEY) || localStorage.getItem("yamashitamaru_seat_flow_v5");
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          const hasData = (parsed.guests && parsed.guests.length > 0) || (parsed.boats && parsed.boats.length > 0 && parsed.step === "seats");
          if (parsed.savedDate && parsed.savedDate !== today && hasData) {
            const parts = parsed.savedDate.split("-");
            const label = parts.length === 3 ? `${Number(parts[1])}/${Number(parts[2])}` : parsed.savedDate;
            const doReset = confirm(`📅 前日（${label}）のデータが残っています。\nリセットして新しく始めますか？\n\n・OK：すべて消去して新しく始める\n・キャンセル：前日のデータをそのまま使う`);
            if (doReset) {
              state.savedDate = today;
              state.step = "verify";
              state.ocrLoaded = false;
              state.ocrImage = null;
              state.boats = [];
              state.guests = [];
              state.selId = null;
              state.autoLockEnabled = !!parsed.autoLockEnabled;
              draftBoats = [];
              save();
            } else {
              state = { ...state, ...parsed, savedDate: today };
              state.guests = normalizeGuests(state.guests);
              if (state.guests.length > 0) state.ocrLoaded = true;
              if (state.ocrImage) lastOcrImageDataUrl = state.ocrImage;
              if (state.boats && state.boats.length > 0) {
                draftBoats = state.boats.map(b => ({ name: b.name, leftCap: Number(b.leftCap), rightCap: Number(b.rightCap) }));
              }
              save();
            }
          } else {
            state = { ...state, ...parsed, savedDate: today };
            state.guests = normalizeGuests(state.guests);
            if (state.guests.length > 0) state.ocrLoaded = true;
            if (state.ocrImage) lastOcrImageDataUrl = state.ocrImage;
            if (state.boats && state.boats.length > 0) {
              draftBoats = state.boats.map(b => ({ name: b.name, leftCap: Number(b.leftCap), rightCap: Number(b.rightCap) }));
            }
          }
        } catch (e) {}
      }
      document.getElementById("apiKeyInput").value = localStorage.getItem("gemini_api_key") || "";
      document.getElementById("modelSelect").value = localStorage.getItem("gemini_seat_model") || "gemini-4-hydrogen";
      render();
    }

    function save() {
      state.savedDate = getTodayStr();
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(state));
      } catch (e) {
        const copy = { ...state, ocrImage: null };
        localStorage.setItem(STORE_KEY, JSON.stringify(copy));
      }
    }
    function saveKey() { localStorage.setItem("gemini_api_key", document.getElementById("apiKeyInput").value.trim()); toast("APIキー保存完了"); }
    function saveModel() { localStorage.setItem("gemini_seat_model", document.getElementById("modelSelect").value); toast("AIモデルを保存しました"); }
    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.style.display = "block";
      clearTimeout(t._tm); t._tm = setTimeout(() => t.style.display = "none", 3200);
    }

    // メニュー表示・非表示の開閉（「メニュー ▲」／「メニュー ▼」）
    function toggleMenuCollapse() {
      state.menuCollapsed = !state.menuCollapsed;
      if (state.menuCollapsed) {
        state.selId = null;
        state.markMode = null;
      }
      save(); render();
    }

    function goStep(stepName) {
      if (stepName === "boats") {
        if (state.boats.length > 0) {
          draftBoats = state.boats.map(b => ({ name: b.name, leftCap: Number(b.leftCap), rightCap: Number(b.rightCap) }));
        } else {
          draftBoats = [];
        }
      }
      state.step = stepName;
      state.menuCollapsed = false;
      closeModal("setupModal");
      save(); render();
    }

    function toggleSortOrder() { state.sortByCount = !state.sortByCount; save(); render(); }

    function toggleMarkMode(mode) {
      state.markMode = (state.markMode === mode) ? null : mode;
      if (state.markMode) state.selId = null;
      render();
      if (state.markMode === "BAG") toast("■ 荷物モードON：荷物が置いてある席をタップしてください");
      else if (state.markMode === "SHOP") toast("● 店取りモードON：お店で確保する席をタップしてください");
      else toast("席マーク入力をOFFにしました");
    }

    function clearSel() { state.selId = null; state.markMode = null; render(); }
    function setView(v) { state.view = v; render(); }

    function toggleAutoLock() {
      state.autoLockEnabled = !state.autoLockEnabled;
      save(); updateAutoLockBtn();
      toast(state.autoLockEnabled ? "選択肢ゼロ時の自動確定をONにしました" : "選択肢ゼロ時はお知らせバナー表示にしました");
    }

    function updateAutoLockBtn() {
      const btn = document.getElementById("autoLockToggleBtn");
      if (!btn) return;
      btn.textContent = state.autoLockEnabled ? "ON" : "OFF";
      btn.className = state.autoLockEnabled ? "success" : "";
    }

    function adjustVerifyCount(id, delta) {
      const g = state.guests.find(x => String(x.id) === String(id));
      if (!g) return;
      g.count = Math.min(15, Math.max(1, Number(g.count) + delta));
      removeGuest(id);
      save(); render();
    }

    function removeVerifyGuest(id) {
      removeGuest(id);
      state.guests = state.guests.filter(g => String(g.id) !== String(id));
      if (String(state.selId) === String(id)) state.selId = null;
      if (state.guests.length === 0) state.ocrLoaded = false;
      save(); render();
      toast("リストから除外しました");
    }

    function confirmVerifiedGuests() {
      if (state.guests.length === 0) {
        toast("予約客が1組もありません。予約表を読み込むか追加してください");
        return;
      }
      if (state.boats.length > 0) {
        draftBoats = state.boats.map(b => ({ name: b.name, leftCap: Number(b.leftCap), rightCap: Number(b.rightCap) }));
      } else {
        draftBoats = [];
      }
      state.step = "boats";
      save(); render();
      toast("予約人数を確定しました。出船する船と人数を指定してください");
    }

    function toggleDraftBoat(name) {
      const idx = draftBoats.findIndex(b => b.name === name);
      if (idx >= 0) draftBoats.splice(idx, 1);
      else draftBoats.push({ name, leftCap: 0, rightCap: 0 });
      render();
    }

    function changeDraftCap(idx, side, d) {
      const key = side === "left" ? "leftCap" : "rightCap";
      const cur = Number(draftBoats[idx][key]) || 0;
      draftBoats[idx][key] = Math.min(15, Math.max(0, cur + d));
      render();
    }

    function setDraftCapInput(idx, side, val) {
      const key = side === "left" ? "leftCap" : "rightCap";
      const parsed = parseInt(val, 10);
      draftBoats[idx][key] = isNaN(parsed) ? 0 : Math.min(15, Math.max(0, parsed));
      render();
    }

    function startWithDraft() {
      if (draftBoats.length === 0) {
        toast("出船する船を1隻以上選んでください");
        return;
      }
      const invalidBoat = draftBoats.find(b => (Number(b.leftCap) || 0) <= 0 || (Number(b.rightCap) || 0) <= 0);
      if (invalidBoat) {
        toast(`⚠️ ${invalidBoat.name} の左舷・右舷の人数を入力してください`);
        return;
      }

      const oldMap = new Map(state.boats.map(b => [b.name, b]));
      state.boats = draftBoats.map(b => {
        const lc = Number(b.leftCap), rc = Number(b.rightCap);
        const old = oldMap.get(b.name);
        if (old) {
          const ls = [...old.leftSeats];
          while (ls.length < lc) ls.push(null);
          if (ls.length > lc) ls.length = lc;
          const rs = [...old.rightSeats];
          while (rs.length < rc) rs.push(null);
          if (rs.length > rc) rs.length = rc;
          return { name: b.name, leftCap: lc, rightCap: rc, leftSeats: ls, rightSeats: rs };
        }
        return { name: b.name, leftCap: lc, rightCap: rc, leftSeats: Array(lc).fill(null), rightSeats: Array(rc).fill(null) };
      });

      state.step = "seats";
      state.view = "overview";
      save(); render();
      toast("配船を確定し、座席表を開始しました");
    }

    function resetAllNewDay() {
      if (!confirm("予約一覧と座席をすべて消去して、新しい日の画面に戻りますか？")) return;
      state.step = "verify";
      state.ocrLoaded = false;
      state.ocrWrittenTotal = null;
      state.ocrImage = null;
      lastOcrImageDataUrl = null;
      state.menuCollapsed = false;
      state.boats = [];
      state.guests = [];
      state.selId = null;
      state.markMode = null;
      draftBoats = [];
      closeModal("setupModal");
      save(); render();
      toast("新しい営業日用に初期化しました");
    }

    function canFitAll(boatsSnap, unplaced) {
      if (unplaced.length === 0) return true;

      let markedCount = 0;
      const blocks = [];
      boatsSnap.forEach(b => ["leftSeats", "rightSeats"].forEach(sk => {
        let r = 0;
        b[sk].forEach(c => {
          if (c === null) {
            r++;
          } else {
            if (isMarkSeat(c)) markedCount++;
            if (r > 0) blocks.push(r);
            r = 0;
          }
        });
        if (r > 0) blocks.push(r);
      }));

      const totalEmpty = blocks.reduce((a, b) => a + b, 0);
      const totalUnplacedNeed = unplaced.reduce((a, g) => a + Number(g.count), 0);

      const netNeed = Math.max(0, totalUnplacedNeed - markedCount);
      if (totalEmpty < netNeed) return false;
      if (netNeed === 0) return true;

      const sorted = [...unplaced].sort((a, b) => Number(b.count) - Number(a.count));

      function bt(i, remBlocks, remMarks) {
        if (i === sorted.length) return true;
        const need = Number(sorted[i].count);

        const tried = new Set();
        for (let k = 0; k < remBlocks.length; k++) {
          if (remBlocks[k] >= need && !tried.has(remBlocks[k])) {
            tried.add(remBlocks[k]);
            const nxt = [...remBlocks];
            nxt[k] -= need;
            if (bt(i + 1, nxt, remMarks)) return true;
          }
        }

        if (remMarks >= need) {
          if (bt(i + 1, remBlocks, remMarks - need)) return true;
        }

        return false;
      }

      return bt(0, blocks, markedCount);
    }

    function evalPlace(bIdx, sk, start, guest) {
      const b = state.boats[bIdx];
      if (!b || !b[sk]) return { valid: false };
      const arr = b[sk];
      const st = Number(start);
      const cnt = Number(guest.count) || 1;
      if (st < 0 || st + cnt > arr.length) return { valid: false };

      for (let i = st; i < st + cnt; i++) {
        if (arr[i] && arr[i].type === "ASSIGNED" && String(arr[i].guestId) !== String(guest.id)) {
          return { valid: false };
        }
      }

      const clone = JSON.parse(JSON.stringify(state.boats));
      clone.forEach(boat => ["leftSeats", "rightSeats"].forEach(s => {
        boat[s] = boat[s].map(c => (c && c.type === "ASSIGNED" && String(c.guestId) === String(guest.id)) ? null : c);
      }));
      for (let i = st; i < st + cnt; i++) {
        clone[bIdx][sk][i] = { type: "ASSIGNED", guestId: String(guest.id) };
      }

      const placed = new Set();
      clone.forEach(boat => ["leftSeats", "rightSeats"].forEach(s => {
        boat[s].forEach(c => { if (c && c.type === "ASSIGNED") placed.add(String(c.guestId)); });
      }));
      return { valid: true, fits: canFitAll(clone, state.guests.filter(g => !placed.has(String(g.id)))) };
    }

    function checkRemainingFreedom() {
      const placed = getPlacedIds();
      const unplaced = state.guests.filter(g => !placed.has(String(g.id)));
      if (unplaced.length === 0) return { status: "DONE", unplacedCount: 0 };

      const totalCap = state.boats.reduce((a, b) => a + Number(b.leftCap) + Number(b.rightCap), 0);
      const totalGuests = state.guests.reduce((a, g) => a + Number(g.count), 0);
      if (totalGuests > totalCap) {
        return { status: "OVER_CAPACITY", overBy: totalGuests - totalCap, unplacedCount: unplaced.length };
      }

      if (state.markMode) {
        return { status: "FREE", unplacedCount: unplaced.length };
      }

      let anyGroupHasZeroChoice = false;
      let maxChoicesForAnyGroup = 0;

      for (const g of unplaced) {
        const cnt = Number(g.count) || 1;
        let gChoices = 0;
        state.boats.forEach((b, bi) => ["leftSeats", "rightSeats"].forEach(sk => {
          for (let i = 0; i <= b[sk].length - cnt; i++) {
            const ev = evalPlace(bi, sk, i, g);
            if (ev.valid && ev.fits) gChoices++;
          }
        }));
        if (gChoices === 0) anyGroupHasZeroChoice = true;
        if (gChoices > maxChoicesForAnyGroup) maxChoicesForAnyGroup = gChoices;
      }

      if (anyGroupHasZeroChoice) return { status: "NO_CHOICE_SPLIT", unplacedCount: unplaced.length };
      if (maxChoicesForAnyGroup <= 1) return { status: "LOCKED_UNIQUE", unplacedCount: unplaced.length };
      return { status: "FREE", unplacedCount: unplaced.length };
    }

    function handleSeatClick(bIdx, sk, idx) {
      if (state.menuCollapsed) return;

      const boat = state.boats[bIdx];
      if (!boat || !boat[sk]) return;
      const seatIdx = Number(idx);
      const cur = boat[sk][seatIdx];

      if (state.markMode) {
        if (cur && cur.type === "ASSIGNED") { toast("確定済みの席です"); return; }
        if (cur && cur.type === state.markMode) {
          state.boats[bIdx][sk][seatIdx] = null;
          save(); render();
          return;
        }
        if (!cur) {
          const placed = getPlacedIds();
          const unplacedGuestsCnt = state.guests.filter(g => !placed.has(String(g.id))).reduce((a, g) => a + Number(g.count), 0);
          let currentMarks = 0;
          state.boats.forEach(b => ["leftSeats", "rightSeats"].forEach(s => b[s].forEach(c => { if (isMarkSeat(c)) currentMarks++; })));
          if (currentMarks >= unplacedGuestsCnt) {
            toast(`⚠️ 未配置の予約人数（${unplacedGuestsCnt}名）以上の席確保はできません`);
            return;
          }
        }
        state.boats[bIdx][sk][seatIdx] = { type: state.markMode };
        save(); render();
        return;
      }

      if (state.selId) {
        const g = state.guests.find(x => String(x.id) === String(state.selId));
        if (!g) { state.selId = null; render(); return; }

        if (cur && cur.type === "ASSIGNED" && String(cur.guestId) === String(g.id)) {
          removeGuest(g.id);
          save(); render();
          toast(`${g.name}様を解除しました`);
          return;
        }

        const cnt = Number(g.count) || 1;
        const currentLen = state.boats[bIdx][sk].length;
        if (cnt > currentLen) {
          toast(`⚠️ ${g.name}様は${cnt}名のため、この舷（全${currentLen}席）には入りきりません`);
          return;
        }

        let st = seatIdx;
        if (st + cnt > currentLen) st = Math.max(0, currentLen - cnt);
        const ev = evalPlace(bIdx, sk, st, g);
        if (!ev.valid) {
          toast(`⚠️ 他の確定済みのお客様と重なるため配置できません（連続${cnt}席の空きが必要です）`);
          return;
        }

        removeGuest(g.id);
        const targetArr = state.boats[bIdx][sk];
        for (let i = st; i < st + cnt; i++) {
          targetArr[i] = { type: "ASSIGNED", guestId: String(g.id), name: g.name, count: cnt, note: g.note };
        }
        state.selId = null;

        const freedom = checkRemainingFreedom();
        if (state.autoLockEnabled && (freedom.status === "LOCKED_UNIQUE" || freedom.status === "NO_CHOICE_SPLIT")) {
          autoAssign(false);
          save(); render();
          toast(`🔒 選べなくなったため、残り${freedom.unplacedCount}組の席を自動確定しました！`);
          return;
        }

        save(); render();
        const sideLabel = sk === "leftSeats" ? "左舷" : "右舷";
        if (freedom.status === "LOCKED_UNIQUE") {
          toast(`🔒 ${g.name}様を確定（残り${freedom.unplacedCount}組の配置も確定）`);
        } else if (freedom.status === "NO_CHOICE_SPLIT") {
          toast(`⚠️ ${g.name}様を確定（残り客の分断注意）`);
        } else {
          toast(`✅ ${g.name}様(${cnt}名)を ${boat.name} ${sideLabel}${st + 1}番〜 に確定`);
        }
        return;
      }

      if (cur && cur.type === "ASSIGNED") {
        state.selId = String(cur.guestId);
        render();
        toast(`${cur.name}様を選択中（移動先タップ、または再タップで解除）`);
        return;
      }

      if (isMarkSeat(cur)) {
        const label = cur.type === "BAG" ? "荷物" : "店取り";
        state.boats[bIdx][sk][seatIdx] = null;
        save(); render();
        toast(`${label}を解除しました`);
        return;
      }

      toast("下の「予約一覧」からお名前を選んでから席をタップしてください");
    }

    function removeGuest(id) {
      const targetId = String(id);
      state.boats.forEach(b => ["leftSeats", "rightSeats"].forEach(sk => {
        for (let i = 0; i < b[sk].length; i++) {
          if (b[sk][i] && b[sk][i].type === "ASSIGNED" && String(b[sk][i].guestId) === targetId) {
            b[sk][i] = null;
          }
        }
      }));
    }

    function autoAssign(showFeedback = true) {
      const placed = getPlacedIds();
      const unplaced = state.guests.filter(g => !placed.has(String(g.id))).sort((a, b) => Number(b.count) - Number(a.count));
      if (unplaced.length === 0) { if (showFeedback) toast("全員すでに確定済みです"); return; }

      state.boats.forEach(b => ["leftSeats", "rightSeats"].forEach(sk => {
        for (let i = 0; i < b[sk].length; i++) {
          if (isMarkSeat(b[sk][i])) b[sk][i] = null;
        }
      }));

      const runs = () => {
        const r = [];
        state.boats.forEach((b, bIdx) => ["leftSeats", "rightSeats"].forEach(sk => {
          let st = -1;
          b[sk].forEach((c, i) => {
            if (c === null) { if (st === -1) st = i; }
            else { if (st !== -1) { r.push({ bIdx, sk, st, len: i - st }); st = -1; } }
          });
          if (st !== -1) r.push({ bIdx, sk, st, len: b[sk].length - st });
        }));
        return r;
      };
      let splits = 0;
      for (const g of unplaced) {
        const cnt = Number(g.count) || 1;
        const fit = runs().filter(r => r.len >= cnt).sort((a, b) => a.len - b.len);
        if (fit.length > 0) {
          const t = fit[0], arr = state.boats[t.bIdx][t.sk];
          for (let i = t.st; i < t.st + cnt; i++) arr[i] = { type: "ASSIGNED", guestId: String(g.id), name: g.name, count: cnt, note: g.note };
        } else {
          splits++;
          let rem = cnt;
          for (const r of runs().sort((a, b) => b.len - a.len)) {
            if (rem <= 0) break;
            const take = Math.min(r.len, rem), arr = state.boats[r.bIdx][r.sk];
            for (let i = r.st; i < r.st + take; i++) arr[i] = { type: "ASSIGNED", guestId: String(g.id), name: `${g.name}(分)`, count: cnt, note: g.note };
            rem -= take;
          }
        }
      }
      if (showFeedback) {
        save(); render();
        toast(splits > 0 ? `⚠️ 空き不足のため${splits}組が分断確定になりました` : "✅ 残り全員の座席を自動確定しました！");
      }
    }

    function getPlacedIds() {
      const ids = new Set();
      state.boats.forEach(b => ["leftSeats", "rightSeats"].forEach(sk => {
        b[sk].forEach(c => { if (c && c.type === "ASSIGNED") ids.add(String(c.guestId)); });
      }));
      return ids;
    }

    function getGuestAssignedBoats(guestId) {
      const targetId = String(guestId);
      const names = [];
      state.boats.forEach(b => {
        const found = b.leftSeats.some(c => c && c.type === "ASSIGNED" && String(c.guestId) === targetId)
          || b.rightSeats.some(c => c && c.type === "ASSIGNED" && String(c.guestId) === targetId);
        if (found) names.push(b.name.replace("船", ""));
      });
      return names.join("・");
    }

    function changeCap(bIdx, side, d) {
      const b = state.boats[bIdx], k = side === "left" ? "leftCap" : "rightCap", sk = side === "left" ? "leftSeats" : "rightSeats";
      const nxt = Number(b[k]) + d;
      if (nxt < 1 || nxt > 15) return;
      b[k] = nxt;
      while (b[sk].length < nxt) b[sk].push(null);
      if (b[sk].length > nxt) b[sk].length = nxt;
      save(); render();
    }

    function swapCaps(bIdx) {
      const b = state.boats[bIdx], tmp = Number(b.leftCap);
      b.leftCap = Number(b.rightCap); b.rightCap = tmp;
      while (b.leftSeats.length < b.leftCap) b.leftSeats.push(null);
      b.leftSeats.length = b.leftCap;
      while (b.rightSeats.length < b.rightCap) b.rightSeats.push(null);
      b.rightSeats.length = b.rightCap;
      save(); render(); toast("左右の定員を入れ替えました");
    }

    function selectGuestById(id) {
      state.markMode = null;
      const targetId = String(id);
      state.selId = (String(state.selId) === targetId) ? null : targetId;
      render();
      if (state.selId) {
        window.scrollTo({ top: 0, behavior: "smooth" });
        const g = state.guests.find(x => String(x.id) === String(state.selId));
        if (g) toast(`👤 ${g.name}様(${g.count}名)を選択：上の座席をタップしてください`);

    }

      } else {

            const boatName = isP ? getGuestAssignedBoats(g.id) : "";
            return `
              <div class="g-row-wrap">
                <button type="button" class="g-row-btn ${isS ? 'sel' : ''} ${isP ? 'done' : ''}" onclick="selectGuestById('${g.id}')">
                  <div class="g-row-top">
                    <span class="g-name-txt">${g.name}</span>
                    <span class="g-cnt">${g.count}名</span>
                  </div>
                  <div class="g-meta ${hasDot ? 'dot-mark' : ''}">
                    ${isP ? `✅ 座席確定済み（${boatName}）` : (g.note || '通常予約')}
                  </div>
                </button>
                <button type="button" onclick="openEdit('${g.id}')" style="padding:0 14px; font-size:15px; flex-shrink:0;">✎ 修正</button>
              </div>
            `;
          }).join("");
        }

        guestSectionHtml = `
          <div class="guest-section" id="guestSection">
            <div class="gs-head">
              <div class="gs-title">📋 予約一覧（未配置 ${unpCnt}名/${unplaced.length}組 ・ 計${totCnt}名）</div>
              <button type="button" style="padding:7px 11px; font-size:14px;" onclick="openModal('addModal')">＋ 追加</button>
            </div>
            <div class="gs-controls">
              <button type="button" style="flex:1; padding:8px; font-size:14px;" onclick="toggleSortOrder()">
                ${state.sortByCount ? "並び順：人数が多い順 ▼" : "並び順：予約表の記載順"}
              </button>
              <button type="button" style="padding:8px 12px; font-size:14px;" onclick="clearSel()">選択解除</button>
            </div>
            <div class="g-list">${guestListHtml}</div>
          </div>
        `;
      }

      main.innerHTML = selBannerHtml + bannerHtml + seatsSectionHtml + guestSectionHtml;
    }

    function miniBtnHtml(bi, sk, c, i, h) {
      let cls = "mini-seat", txt = "空";
      if (c) {
        if (c.type === "BAG") { cls += " bag"; txt = "■ 荷物"; }
        else if (c.type === "SHOP" || c.type === "HOLD") { cls += " shop"; txt = "● 店取り"; }
        else { cls += " assigned"; txt = `${c.name}(${c.count})`; }
      } else if (h) {
        cls += " " + h;
        txt = h === "fit-ok" ? "案内OK" : "注意";
      }
      return `<button type="button" class="${cls}" onclick="handleSeatClick(${bi},'${sk}',${i})"><span>${i + 1}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:78%;">${txt}</span></button>`;
    }

    function seatBtnHtml(bi, sk, c, i, tot, h) {
      let cls = "seat", body = `<div class="s-name" style="color:#475569;font-size:15px;">空席</div>`;
      const pos = i === 0 ? "1 (ミヨシ)" : (i === tot - 1 ? `${i + 1} (オオドモ)` : `${i + 1}`);
      if (c) {
        if (c.type === "BAG") {
          cls += " bag";
          body = `<div class="s-name" style="color:var(--bag-tx);font-size:16px;">■ 荷物</div>`;
        } else if (c.type === "SHOP" || c.type === "HOLD") {
          cls += " shop";
          body = `<div class="s-name" style="color:var(--shop-tx);font-size:16px;">● 店取り</div>`;
        } else {
          cls += " assigned";
          const bdg = c.note ? c.note.split("/").map(n => `<span class="badge">${n.trim()}</span>`).join("") : "";
          body = `<div class="s-name">${c.name}(${c.count})</div>${bdg ? `<div>${bdg}</div>` : ""}`;
        }
      } else if (h) {
        cls += " " + h;
        body = `<div class="s-name" style="color:${h === 'fit-ok' ? '#6ee7b7' : '#fde047'};font-size:15px;">${h === 'fit-ok' ? '✅ 案内OK' : '⚠️ 分断注意'}</div>`;
      }
      return `<button type="button" class="${cls}" onclick="handleSeatClick(${bi},'${sk}',${i})"><div class="s-pos">${pos}</div>${body}</button>`;
    }

    function renderSheetModal() {
      const body = document.getElementById("sheetModalBody");
      const origBtn = document.getElementById("openOrigImgBtn");
      const hasImg = !!(lastOcrImageDataUrl || state.ocrImage);
      origBtn.style.opacity = hasImg ? "1" : "0.45";

      if (state.guests.length === 0) {
        body.innerHTML = `<div style="text-align:center; padding:24px 10px; color:var(--sub);">読み取った予約データがありません。「📷 読込」から予約表を読み込んでください。</div>`;
        return;
      }

      const placed = getPlacedIds();
      const totCnt = state.guests.reduce((a, g) => a + Number(g.count), 0);
      const placedCnt = state.guests.filter(g => placed.has(String(g.id))).reduce((a, g) => a + Number(g.count), 0);
      const writtenInfo = state.ocrWrittenTotal ? ` / 紙記載:${state.ocrWrittenTotal}名` : "";

      const rowsHtml = state.guests.map((g, idx) => {
        const isDone = placed.has(String(g.id));
        const boatLabel = isDone ? getGuestAssignedBoats(g.id) : "";
        return `
          <div class="sheet-row ${isDone ? 'done-row' : ''}">
            <div class="sheet-idx">${idx + 1}.</div>
            <div class="sheet-main">
              <div class="sheet-name-line">
                <span style="font-size:18px; font-weight:800;" class="${isDone ? 'strike-name' : ''}">${g.name}</span>
                <span style="font-size:16px; font-weight:800; color:#93c5fd;">${g.count}名</span>
                ${isDone && boatLabel ? `<span class="boat-tag">${boatLabel}</span>` : ""}
              </div>
              ${g.note ? `<div class="sheet-note">${g.note}</div>` : ""}
            </div>
            <button type="button" style="padding:6px 10px; font-size:13px; flex-shrink:0;" onclick="closeModal('sheetModal'); openEdit('${g.id}')">✎</button>
          </div>
        `;
      }).join("");

      body.innerHTML = `
        <div class="sheet-summary">
          <div>
            <div style="font-size:13px; color:var(--sub);">読取順 一括表示（全${state.guests.length}組${writtenInfo}）</div>
            <div style="font-size:18px; font-weight:800; color:#fff;">合計 ${totCnt}名 <span style="font-size:14px; color:#6ee7b7;">（確定済 ${placedCnt}名 / 残 ${totCnt - placedCnt}名）</span></div>
          </div>
        </div>
        ${rowsHtml}
      `;
    }

    function openOrigImage() {
      const src = lastOcrImageDataUrl || state.ocrImage;
      if (!src) {
        toast("元の予約表画像がまだ読み込まれていません");
        return;
      }
      document.getElementById("origImgContainer").innerHTML = `
        <img src="${src}" alt="元の予約表画像" style="width:100%; height:auto; border-radius:8px; border:1px solid var(--bd);" />
      `;
      openModal("origImgModal");
    }

    function addGuest() {
      const name = document.getElementById("addName").value.trim();
      const count = Math.min(15, Math.max(1, parseInt(document.getElementById("addCount").value, 10) || 1));
      const note = document.getElementById("addNote").value.trim();
      if (!name) { toast("名前を入力してください"); return; }
      state.guests.push({ id: makeUniqueId("add"), name, count, note });
      state.ocrLoaded = true;
      document.getElementById("addName").value = ""; document.getElementById("addNote").value = "";
      save(); render(); closeModal("addModal"); toast(`${name}様を追加しました`);
    }

    function openEdit(id) {
      const g = state.guests.find(x => String(x.id) === String(id));
      if (!g) return;
      document.getElementById("editId").value = g.id;
      document.getElementById("editName").value = g.name;
      document.getElementById("editCount").value = g.count;
      document.getElementById("editNote").value = g.note || "";
      openModal("editModal");
    }

    function stepEdit(d) {
      const inp = document.getElementById("editCount");
      inp.value = Math.min(15, Math.max(1, (parseInt(inp.value, 10) || 1) + d));
    }

    function saveEdit() {
      const id = document.getElementById("editId").value;
      const name = document.getElementById("editName").value.trim();
      const count = Math.min(15, Math.max(1, parseInt(document.getElementById("editCount").value, 10) || 1));
      const note = document.getElementById("editNote").value.trim();
      if (!name) return;
      const g = state.guests.find(x => String(x.id) === String(id));
      if (!g) return;
      g.name = name; g.count = count; g.note = note;
      removeGuest(id);
      save(); render(); closeModal("editModal"); toast("変更を保存しました");
    }

    function delGuest() {
      const id = document.getElementById("editId").value;
      if (!confirm("この予約を削除しますか？")) return;
      removeGuest(id);
      state.guests = state.guests.filter(g => String(g.id) !== String(id));
      if (String(state.selId) === String(id)) state.selId = null;
      if (state.guests.length === 0) state.ocrLoaded = false;
      save(); render(); closeModal("editModal"); toast("削除しました");
    }

    function resetSeatsOnly() {
      if (!confirm("全座席を空に戻しますか？")) return;
      state.boats.forEach(b => { b.leftSeats = Array(Number(b.leftCap)).fill(null); b.rightSeats = Array(Number(b.rightCap)).fill(null); });
      save(); render(); closeModal("setupModal"); toast("座席をリセットしました");
    }

    function createCompressedDataUrl(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const maxW = 1100;
            const scale = img.width > maxW ? (maxW / img.width) : 1;
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.78));
          };
          img.onerror = () => resolve(ev.target.result);
          img.src = ev.target.result;
        };
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(file);
      });
    }

    async function runOcr() {
      const key = localStorage.getItem("gemini_api_key");
      if (!key) { toast("先に⚙設定からAPIキーを入力してください"); return; }
      const f = document.getElementById("ocrFile").files[0];
      if (!f) { toast("画像を選択してください"); return; }
      const fish = document.getElementById("fishInput").value.trim();
      const model = document.getElementById("modelSelect").value || "gemini-4-hydrogen";
      const btn = document.getElementById("ocrBtn"), msg = document.getElementById("ocrMsg");
      btn.disabled = true; btn.textContent = `${model} で解析中...`;
      msg.innerHTML = "";
      try {
        const [b64, previewUrl] = await Promise.all([
          new Promise((res, rej) => {
            const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.onerror = rej; r.readAsDataURL(f);
          }),
          createCompressedDataUrl(f)
        ]);

        const prompt = `釣船「山下丸」の手書き予約表から「${fish || "乗合船"}」の予約を読み取りJSONのみで出力してください。
重要ルール:
1. 1行に複数のグループが横並びで書かれているので、1人(1組)ずつ漏れなく読み取ること。
2. 名前の横に人数が書かれていない場合（例: 秋場、小柳、菅澤、長谷川、村田、内藤、杉浦、橋本 など）は必ず count: 1 とすること。
3. 上部の別枠・仕立船（線が引かれている枠など）や、取消線、下部の合計数字メモ（「63 -> 21 22 20」など）は客リストに含めないこと。
4. 名前の前の点(・)は hasDot: true、竿+数字は rod（数値）、カラは kara: true とすること。
5. 紙に合計人数が書かれていれば writtenTotal に入れること。
出力形式:{"writtenTotal":63,"guests":[{"name":"井部","count":6,"hasDot":false,"rod":2,"kara":false}]}`;

        const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: f.type || "image/jpeg", data: b64 } }] }],
            generationConfig: { response_mime_type: "application/json" }
          })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error?.message || `APIエラー (${resp.status})`);
        const parsed = JSON.parse(data.candidates[0].content.parts[0].text);

        state.guests = (parsed.guests || []).map((g) => {
          const n = [];
          if (g.hasDot) n.push("前日場所取");
          if (Number(g.rod) > 0) n.push(`竿${g.rod}`);
          if (g.kara) n.push("カラ");
          return {
            id: makeUniqueId("ocr"),
            name: String(g.name || "").trim(),
            count: Math.min(15, Math.max(1, parseInt(g.count, 10) || 1)),
            note: n.join(" / ")
          };
        });
        state.ocrLoaded = true;
        state.ocrWrittenTotal = parsed.writtenTotal || null;
        lastOcrImageDataUrl = previewUrl;
        state.ocrImage = previewUrl;
        state.selId = null;

        state.step = "verify";
        save(); render();
        closeModal("ocrModal");
        window.scrollTo({ top: 0, behavior: "smooth" });
        toast("読み取り完了！内容を確認して確定してください");
      } catch (e) {
        msg.innerHTML = `<span style="color:#ef4444;">エラー: ${e.message}</span>`;
      } finally {
        btn.disabled = false; btn.textContent = "AIで解析する";
      }
    }

    function openModal(id) {
      if (id === "setupModal") {
        updateAutoLockBtn();
        const b32 = state.boats.find(b => b.name === "32号船");
        document.getElementById("expArea").value = b32 ? JSON.stringify({
          date: getTodayStr(), boat: "32号船",
          left: b32.leftSeats.map((c, i) => ({ seatNo: i + 1, name: c && c.type === "ASSIGNED" ? c.name : "", note: c && c.type === "ASSIGNED" ? c.note : "" })),
          right: b32.rightSeats.map((c, i) => ({ seatNo: i + 1, name: c && c.type === "ASSIGNED" ? c.name : "", note: c && c.type === "ASSIGNED" ? c.note : "" }))
        }, null, 2) : "本日の配船に32号船がありません";
      }
      if (id === "sheetModal") {
        renderSheetModal();
      }
      document.getElementById(id).classList.add("open");
    }
    function closeModal(id) { document.getElementById(id).classList.remove("open"); }
    function copyExp() { const a = document.getElementById("expArea"); a.select(); navigator.clipboard.writeText(a.value); toast("コピーしました"); }
    function saveExp() { localStorage.setItem(SHARED_32, document.getElementById("expArea").value); toast("共有領域に保存しました"); }

    init();
  </script>
</body>
