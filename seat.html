<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b1120" />
  <title>山下丸 釣り座管理</title>
  <style>
    :root {
      --bg: #0b1120; --card: #131c31; --panel: #1a253c; --inp: #0f172a;
      --bd: #2c3e5e; --tx: #f1f5f9; --sub: #94a3b8;
      --blue: #2563eb; --blue-bg: #172e66;
      --green: #10b981; --green-bg: #064e3b;
      /* 荷物（四角■）用：シアン・青緑系 */
      --bag-bd: #06b6d4; --bag-bg: #083344; --bag-tx: #67e8f9;
      /* 店取り（丸●）用：オレンジ・アンバー系 */
      --shop-bd: #f59e0b; --shop-bg: #451a03; --shop-tx: #fcd34d;
      --red: #ef4444;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; overflow-x: hidden;
      background: var(--bg); color: var(--tx);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 18px; line-height: 1.45;
      transition: background-color 0.2s ease;
    }
    body { padding-bottom: 48px; }

    /* 個別船選択時の背景色強化（深みを揃えた統一トーン） */
    body.theme-32 { background: #061d36; }
    body.theme-31 { background: #2d0c1e; }
    body.theme-27, body.theme-25 { background: #0a2414; }

    /* シンプルな硬派ラインアイコン */
    .ico {
      width: 17px; height: 17px; stroke: currentColor; stroke-width: 2.1;
      stroke-linecap: round; stroke-linejoin: round; fill: none; flex-shrink: 0;
    }

    /* ヘッダー */
    header {
      position: sticky; top: 0; z-index: 50;
      background: linear-gradient(180deg, #0d1526 0%, #070b14 100%);
      border-bottom: 1px solid #334155; padding: 8px 10px 9px;
    }
    .h-top {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      white-space: nowrap;
    }
    .h-brand {
      display: flex; align-items: center; gap: 8px; min-width: 0;
    }
    .h-emblem {
      width: 32px; height: 32px; border-radius: 7px;
      background: #131c31; border: 1px solid #475569;
      display: flex; align-items: center; justify-content: center; color: #38bdf8;
    }
    .h-ship { font-size: 20px; font-weight: 900; color: #ffffff; letter-spacing: 0.05em; }
    .h-sub {
      font-size: 13px; font-weight: 800; color: #93c5fd;
      background: #0f172a; border: 1px solid #334155; padding: 2px 8px; border-radius: 5px;
    }
    .menu-toggle-btn {
      padding: 6px 10px; font-size: 13px; font-weight: 800;
      border-radius: 7px; border: 1px solid #475569;
      background: #131c31; color: #cbd5e1; flex-shrink: 0;
    }
    .menu-toggle-btn.collapsed {
      background: #064e3b; border-color: #10b981; color: #6ee7b7;
    }

    /* 2段目操作ボタン群：重複していた予約一覧を外し「読込」「設定」の2列に整理 */
    .h-btns {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; width: 100%;
      margin-top: 8px;
    }
    .h-btns button {
      width: 100%; padding: 9px 6px; font-size: 15px; font-weight: 800;
      background: #162138; border-color: #3b4f75;
    }

    /* 釣り物（魚種）切り替えバー */
    .fish-bar {
      display: flex; align-items: center; gap: 6px; overflow-x: auto;
      background: #09101f; border-bottom: 1px solid #1e3a8a;
      padding: 6px 8px;
    }
    .fish-tab {
      flex: 1; min-width: 96px; padding: 7px 8px; border-radius: 7px;
      background: var(--inp); border: 1px solid var(--bd);
      color: var(--sub); font-size: 15px; font-weight: 900;
      flex-direction: column; line-height: 1.2;
    }
    .fish-tab.active {
      background: #1e3a8a; border-color: #60a5fa; color: #ffffff;
    }
    .fish-tab-sub {
      font-size: 11px; font-weight: 700; opacity: 0.9; margin-top: 2px;
    }

    button {
      background: var(--panel); color: var(--tx); border: 1px solid var(--bd);
      border-radius: 8px; padding: 10px 11px; font-size: 15px; font-weight: 700;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      touch-action: manipulation; font-family: inherit;
    }
    button:active { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: var(--blue); border-color: #3b82f6; color: #fff; }
    button.success { background: #059669; border-color: var(--green); color: #fff; }
    button.warning { background: #d97706; border-color: var(--shop-bd); color: #fff; }
    button.danger { background: #b91c1c; border-color: var(--red); color: #fff; }

    .container { padding: 10px; width: 100%; max-width: 560px; margin: 0 auto; }

    /* ステップカード（①読取確認 / ②配船指定） */
    .step-card { background: var(--card); border: 1px solid var(--bd); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .step-badge { display: inline-block; font-size: 12px; font-weight: 800; background: var(--blue-bg); color: #93c5fd; border: 1px solid #3b82f6; padding: 2px 8px; border-radius: 5px; margin-bottom: 6px; }
    .w-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .w-title { font-size: 19px; font-weight: 800; margin: 0; }
    .w-sub { font-size: 14px; color: var(--sub); margin-bottom: 12px; }

    .empty-ocr-box {
      background: #0f172a; border: 1px dashed #3b82f6; border-radius: 12px;
      padding: 26px 16px; text-align: center; margin: 8px 0 12px;
    }
    .empty-ocr-msg { font-size: 20px; font-weight: 900; color: #ffffff; margin-bottom: 8px; }
    .empty-ocr-sub { font-size: 14px; color: #cbd5e1; margin-bottom: 18px; }

    .verify-summary {
      background: var(--inp); border: 1px solid #3b82f6; border-radius: 9px;
      padding: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
    }
    .verify-row {
      background: var(--inp); border: 1px solid var(--bd); border-radius: 9px;
      padding: 10px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .verify-info { flex: 1; min-width: 0; }
    .verify-name { font-size: 18px; font-weight: 800; color: #fff; }
    .verify-note { font-size: 13px; color: #fcd34d; margin-top: 2px; }
    .verify-ctrl { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .verify-ctrl button { padding: 6px 11px; font-size: 16px; }

    .ocr-result-box { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--bd); }
    .ocr-result-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px; font-size: 15px; font-weight: 800; color: #93c5fd;
    }
    .ocr-fish-group-title {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 14px; font-weight: 900; color: #7dd3fc;
      background: #0c2340; border: 1px solid #0284c7;
      padding: 6px 9px; border-radius: 6px; margin: 8px 0 5px;
    }
    .ocr-fish-rename-btn {
      padding: 3px 8px; font-size: 12px; font-weight: 800;
      background: #1e293b; border: 1px solid #7dd3fc; color: #e0f2fe; border-radius: 5px;
    }
    .ocr-result-list {
      max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
    }
    .ocr-item-row {
      background: var(--inp); border: 1px solid var(--bd); border-radius: 7px;
      padding: 8px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 14px;
    }
    .ocr-item-main { min-width: 0; flex: 1; }
    .ocr-item-name { font-size: 16px; font-weight: 800; color: #fff; }
    .ocr-item-sub { font-size: 12px; color: #cbd5e1; margin-top: 2px; }
    .ocr-item-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .ocr-item-actions button { padding: 5px 9px; font-size: 13px; }

    /* 配船指定 */
    .match-box {
      border-radius: 9px; padding: 11px 12px; margin-bottom: 12px; font-size: 15px; font-weight: 800;
      border: 1px solid var(--bd); background: var(--inp);
    }
    .match-box.ok { border-color: var(--green); background: var(--green-bg); color: #6ee7b7; }
    .match-box.warn { border-color: var(--shop-bd); background: var(--shop-bg); color: #fcd34d; }
    .boat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .b-pick {
      width: 100%; padding: 12px 6px; border-radius: 9px; border: 1px solid var(--bd);
      background: var(--inp); color: var(--sub); font-size: 17px; font-weight: 800;
      flex-direction: column; line-height: 1.2;
    }
    .b-pick.on { background: var(--blue-bg); border-color: #3b82f6; color: #fff; }
    .b-pick.in-other-fish { border-color: #64748b; background: #0a0f1d; color: #cbd5e1; }
    .b-pick-used { font-size: 11px; color: #fcd34d; font-weight: 700; margin-top: 2px; }
    .w-boat-row {
      background: var(--inp); border: 1px solid var(--bd); border-radius: 9px;
      padding: 11px; margin-bottom: 10px;
    }
    .w-boat-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 18px; font-weight: 800; }
    .w-caps { display: flex; gap: 8px; }
    .w-cap-box { flex: 1; background: var(--card); padding: 8px; border-radius: 7px; text-align: center; }
    .w-cap-ctrl { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 4px; }
    .w-cap-ctrl button { padding: 7px 13px; font-size: 20px; }
    .cap-num-inp {
      width: 54px !important; text-align: center; font-size: 20px !important; font-weight: 900;
      padding: 6px 2px !important; background: #070b14 !important; border: 1px solid #3b82f6 !important; color: #fff !important;
    }

    /* 選択中ガイドバー（右端は「閉じる」） */
    .selected-banner {
      position: sticky; top: 88px; z-index: 40;
      background: #172e66;
      border: 1px solid #60a5fa; border-radius: 10px; padding: 10px 12px;
      margin-bottom: 12px; color: #fff;
      display: flex; flex-direction: column; gap: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.65);
    }
    .selected-banner-top {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .selected-banner-info { font-size: 17px; font-weight: 800; line-height: 1.35; }
    .selected-banner-sub { font-size: 13px; color: #dbeafe; font-weight: 600; }
    .custom-split-btn {
      width: 100%; padding: 8px 10px; font-size: 14px; font-weight: 800;
      border-radius: 7px; border: 1px solid #93c5fd;
      background: rgba(15, 23, 42, 0.75); color: #e0f2fe;
    }
    .custom-split-btn.on {
      background: #7c2d12; border-color: #fb923c; color: #ffedd5;
    }

    /* 船タブの1つ上に配置する「予約一覧」ボタン */
    .quick-guest-bar {
      padding: 8px 10px 6px; background: #09101f;
    }
    .quick-guest-btn {
      width: 100%; padding: 12px 12px; font-size: 17px; font-weight: 900;
      background: #1e3a8a;
      border: 1px solid #60a5fa; color: #ffffff; border-radius: 8px;
    }

    /* 統一感のある船選択タブ（全体・32号船・31号船・27号船など） */
    .tabs {
      display: flex; overflow-x: auto; background: #070c17;
      border-bottom: 1px solid #334155; padding: 4px 8px 0; gap: 4px;
    }
    .tab {
      flex: 1; min-width: 78px; padding: 8px 4px 7px;
      border-radius: 8px 8px 0 0;
      background: #11192b; border: 1px solid #263552; border-bottom: none;
      text-align: center; color: var(--sub);
      flex-direction: column; line-height: 1.15;
    }
    .tab-ship-label {
      font-size: 18px; font-weight: 900; letter-spacing: -0.02em; display: block;
    }
    .tab-emp-label {
      font-size: 12px; font-weight: 700; display: block; margin-top: 2px;
    }
    .tab.active {
      background: #1e293b; border-color: #64748b; color: #fff;
      box-shadow: inset 0 3px 0 #94a3b8;
    }
    .tab.active.t-32 {
      background: #0c2d52; border-color: #38bdf8; color: #e0f2fe;
      box-shadow: inset 0 3px 0 #38bdf8;
    }
    .tab.active.t-31 {
      background: #42142b; border-color: #f472b6; color: #fce7f3;
      box-shadow: inset 0 3px 0 #f472b6;
    }
    .tab.active.t-27, .tab.active.t-25 {
      background: #113822; border-color: #4ade80; color: #dcfce7;
      box-shadow: inset 0 3px 0 #4ade80;
    }

    /* 操作バー（荷物■ / 店取り● ＋ 1つ前に戻す） */
    .mode-bar {
      display: flex; flex-direction: column; padding: 8px 10px;
      background: rgba(19, 28, 49, 0.92); border-bottom: 1px solid var(--bd); gap: 7px;
    }
    .mark-split {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%;
    }
    .bag-btn {
      padding: 10px 6px; font-size: 15px; font-weight: 800;
      border: 1px solid var(--bd); background: var(--inp); color: var(--sub);
    }
    .bag-btn.on {
      background: var(--bag-bg); border-color: var(--bag-bd); color: var(--bag-tx);
      box-shadow: 0 0 0 1px var(--bag-bd) inset;
    }
    .shop-btn {
      padding: 10px 6px; font-size: 15px; font-weight: 800;
      border: 1px solid var(--bd); background: var(--inp); color: var(--sub);
    }
    .shop-btn.on {
      background: var(--shop-bg); border-color: var(--shop-bd); color: var(--shop-tx);
      box-shadow: 0 0 0 1px var(--shop-bd) inset;
    }
    .undo-btn {
      width: 100%; padding: 9px 8px; font-size: 14px; font-weight: 800;
      background: #1e293b; border: 1px solid #475569; color: #e2e8f0;
    }

    /* 全体俯瞰＆個別船カード（背景・縁取り強化） */
    .ov-card {
      background: rgba(19, 28, 49, 0.94); border: 2px solid var(--bd);
      border-radius: 11px; padding: 12px; margin-bottom: 14px;
    }
    .ov-card.card-32 { background: rgba(10, 42, 74, 0.92); border-color: #38bdf8; }
    .ov-card.card-31 { background: rgba(64, 18, 43, 0.92); border-color: #f472b6; }
    .ov-card.card-27, .ov-card.card-25 { background: rgba(16, 52, 28, 0.92); border-color: #4ade80; }

    /* 個別船表示時の外枠パネル */
    .single-boat-frame {
      border-radius: 12px; padding: 10px;
      border: 2px solid #475569; background: rgba(15, 23, 42, 0.65);
    }
    .single-boat-frame.frame-32 { background: rgba(8, 36, 66, 0.88); border-color: #38bdf8; }
    .single-boat-frame.frame-31 { background: rgba(54, 15, 36, 0.88); border-color: #f472b6; }
    .single-boat-frame.frame-27, .single-boat-frame.frame-25 { background: rgba(13, 44, 24, 0.88); border-color: #4ade80; }

    .ov-head {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.16);
    }
    .mini-hull { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mini-seat {
      width: 100%; height: 48px; border-radius: 7px; background: var(--inp); border: 1px solid #2c3e5e;
      display: flex; align-items: center; justify-content: space-between; padding: 0 8px;
      font-size: 14px; font-weight: 800; color: var(--sub); margin-bottom: 6px;
    }
    .mini-seat.bag { background: var(--bag-bg); border-color: var(--bag-bd); color: var(--bag-tx); }
    .mini-seat.shop { background: var(--shop-bg); border-color: var(--shop-bd); color: var(--shop-tx); }
    .mini-seat.assigned { background: var(--blue-bg); border-color: #3b82f6; color: #ffffff; }
    .mini-seat.fit-ok { background: var(--green-bg); border-color: var(--green); color: #6ee7b7; }
    .mini-seat.fit-warn { background: #3f3208; border-color: #eab308; color: #fde047; }

    /* 1隻詳細＋場所指定の席増減バー */
    .seat-edit-toggle {
      width: 100%; margin-top: 8px; padding: 9px; font-size: 14px; font-weight: 800;
      background: #0f172a; border: 1px solid #38bdf8; color: #bae6fd;
    }
    .seat-edit-toggle.on {
      background: #1e3a8a; border-color: #60a5fa; color: #fff;
    }
    .insert-slot-btn {
      width: 100%; padding: 5px 4px; margin-bottom: 6px; font-size: 12px; font-weight: 800;
      background: #064e3b; border: 1px dashed #34d399; color: #a7f3d0; border-radius: 6px;
    }
    .seat-row-box { position: relative; margin-bottom: 8px; }
    .seat-row-box .seat { margin-bottom: 0; }
    .del-slot-btn {
      width: 100%; padding: 4px; margin-top: 3px; font-size: 12px; font-weight: 800;
      background: #450a0a; border: 1px solid #f87171; color: #fecaca; border-radius: 6px;
    }

    .bow-bar {
      text-align: center; font-size: 14px; font-weight: 800; color: #93c5fd;
      padding: 7px; background: rgba(11, 18, 34, 0.88); border: 1px solid rgba(255,255,255,0.2); border-radius: 7px; margin: 10px 0;
    }
    .hull { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .seat {
      width: 100%; min-height: 68px; border-radius: 9px; background: rgba(15, 23, 42, 0.94); border: 1px solid #334155;
      padding: 8px 10px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
      margin-bottom: 8px; text-align: left;
    }
    .seat.bag { background: var(--bag-bg); border-color: var(--bag-bd); }
    .seat.shop { background: var(--shop-bg); border-color: var(--shop-bd); }
    .seat.assigned { background: var(--blue-bg); border-color: #3b82f6; }
    .seat.fit-ok { background: var(--green-bg); border-color: var(--green); }
    .seat.fit-warn { background: #3b2f06; border-color: #eab308; }
    .s-pos { font-size: 13px; color: var(--sub); font-weight: 700; }
    .s-name { font-size: 17px; font-weight: 800; color: #fff; margin-top: 2px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .s-holder { font-size: 14px; font-weight: 800; margin-top: 2px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .s-warn-msg { font-size: 12px; font-weight: 800; color: #fde047; line-height: 1.25; margin-top: 2px; }
    .badge { display: inline-block; font-size: 12px; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,0.18); margin-right: 4px; margin-top: 2px; }

    /* 予約一覧モーダル内リスト */
    .modal-wide { max-width: 560px; }
    .gs-top-action {
      background: #0f172a; border: 1px solid #334155; border-radius: 9px;
      padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px;
    }
    .gs-head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; flex-wrap: wrap;
    }
    .gs-title { font-size: 16px; font-weight: 800; color: #38bdf8; }
    .gs-controls { display: flex; gap: 6px; margin-bottom: 10px; }
    .g-list-2col {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
    }
    .g-card-2col {
      position: relative; min-width: 0; background: var(--inp); border: 1px solid var(--bd);
      border-radius: 10px; padding: 10px;
      display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
      text-align: left; cursor: pointer;
    }
    .g-card-2col.sel { background: #1e3a8a; border-color: #60a5fa; }
    .g-card-2col.shop-marked { background: #2c1304; border-color: #f59e0b; box-shadow: inset 0 0 0 1px rgba(245, 158, 11, 0.35); }
    .g-card-2col.partial { border-color: #fb923c; background: #1e1b18; }
    .g-card-2col.done { opacity: 0.45; border-style: dashed; }
    .g-card-top { display: flex; align-items: center; gap: 6px; width: 100%; }
    .g-name-txt { font-size: 18px; font-weight: 800; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .g-cnt { background: var(--blue); color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 15px; font-weight: 800; flex-shrink: 0; }
    .g-shop-pill {
      display: inline-block; font-size: 12px; font-weight: 800;
      background: #92400e; border: 1px solid #f59e0b; color: #fef3c7;
      padding: 1px 6px; border-radius: 4px; margin-top: 4px;
    }
    .g-card-foot {
      display: flex; align-items: flex-end; justify-content: space-between; gap: 4px;
      width: 100%; margin-top: 6px;
    }
    .g-meta { font-size: 14px; color: #cbd5e1; line-height: 1.3; word-break: break-all; }
    .g-meta.dot-mark { color: #94a3b8; font-weight: 700; }
    .g-edit-mini {
      padding: 4px 8px; font-size: 14px; border-radius: 6px; flex-shrink: 0;
      background: #1e293b; border: 1px solid #475569; color: #e2e8f0;
    }

    /* 解析した予約表アコーディオン */
    .parsed-sheet-accordion {
      background: #070b14; border: 1px solid var(--bd); border-radius: 12px;
      margin-top: 16px; overflow: hidden;
    }
    .accordion-trigger-btn {
      width: 100%; padding: 12px 14px; border-radius: 0; border: none;
      background: #0f172a; color: #e2e8f0;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 15px; font-weight: 800; text-align: left;
    }
    .accordion-body { padding: 10px 12px 14px; border-top: 1px solid var(--bd); }

    .layout-scroll-wrap {
      width: 100%; max-height: 360px;
      overflow-x: auto; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--bd); border-radius: 9px; background: var(--inp);
      padding: 7px; display: flex; flex-direction: column; gap: 6px;
    }
    .layout-flex-row {
      display: flex; flex-direction: row; flex-wrap: nowrap; align-items: stretch; gap: 6px;
      width: max-content;
    }
    .row-badge-label {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0 6px; border-radius: 5px; background: #1e293b; color: #94a3b8;
      font-size: 10px; font-weight: 800; flex-shrink: 0;
    }
    .layout-cell {
      border: 1px solid #2b3f63; border-radius: 6px; padding: 6px 8px;
      min-width: 88px; max-width: 144px; background: #131c31;
      flex-shrink: 0; cursor: pointer;
    }
    .layout-cell.done-slot { background: #0a1222; border-color: #1e293b; }
    .cell-guest-name { font-size: 13px; font-weight: 800; color: #ffffff; word-break: break-all; }
    .cell-guest-cnt { font-size: 12px; font-weight: 800; color: #93c5fd; margin-left: 3px; }
    .cell-guest-note { font-size: 10px; color: #fcd34d; margin-top: 2px; word-break: break-all; }
    .strike-name { position: relative; display: inline-block; color: #cbd5e1; }
    .strike-name::after {
      content: ""; position: absolute; left: -2px; right: -2px; top: 52%;
      height: 2.5px; background: #ef4444; border-radius: 2px; pointer-events: none;
    }
    .boat-tag {
      display: inline-block; font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 4px;
      background: #1e3a8a; border: 1px solid #3b82f6; color: #93c5fd; margin-top: 3px;
    }
    .sheet-summary {
      background: var(--inp); border: 1px solid var(--bd); border-radius: 9px;
      padding: 9px 11px; margin-bottom: 9px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }

    /* 設定モーダル内のタブ分け */
    .set-tabs {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px;
    }
    .set-tab {
      padding: 9px 4px; font-size: 14px; font-weight: 800; border-radius: 7px;
      background: var(--inp); border: 1px solid var(--bd); color: var(--sub);
    }
    .set-tab.active {
      background: #1e3a8a; border-color: #60a5fa; color: #ffffff;
    }
    .set-pane { display: none; }
    .set-pane.active { display: block; }

    .preset-chips {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
    }
    .preset-chip {
      padding: 6px 10px; font-size: 13px; font-weight: 800; border-radius: 6px;
      background: var(--inp); border: 1px solid var(--bd); color: #e2e8f0;
    }

    /* モーダル */
    .modal-bg { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.84); display: none; align-items: center; justify-content: center; padding: 8px; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--card); border: 1px solid #3b4f75; border-radius: 12px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 14px; }
    .m-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bd); padding-bottom: 10px; margin-bottom: 12px; font-weight: 800; font-size: 18px; gap: 8px; }
    .m-head-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .modal-close-lg {
      padding: 10px 16px; font-size: 16px; font-weight: 900;
      min-width: 96px; background: #1e293b; border: 1px solid #64748b; color: #ffffff;
      border-radius: 8px; flex-shrink: 0;
    }
    .field { margin-bottom: 13px; }
    .field label { display: block; font-size: 14px; color: var(--sub); margin-bottom: 5px; font-weight: 700; }
    input[type="text"], input[type="password"], input[type="number"], textarea, select {
      width: 100%; background: var(--inp); border: 1px solid var(--bd); color: var(--tx);
      border-radius: 8px; padding: 11px; font-size: 17px;
    }
    .toast {
      position: fixed; top: 96px; left: 50%; transform: translateX(-50%); z-index: 200;
      background: #1e293b; border: 1px solid #60a5fa; color: #fff; padding: 11px 18px;
      border-radius: 9px; font-size: 15px; font-weight: 700; display: none; max-width: 92vw; text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="h-top">
      <div class="h-brand">
        <div class="h-emblem" aria-hidden="true">
          <svg class="ico" viewBox="0 0 24 24">
            <path d="M2 20c2-1 4-1 6 0s4 1 6 0 4-1 6 0" />
            <path d="M4 15h16l-2-5H6l-2 5z" />
            <path d="M12 10V4l4 3-4 3" />
          </svg>
        </div>
        <span class="h-ship">山下丸</span>
        <span class="h-sub">釣り座管理</span>
      </div>
      <button type="button" id="menuToggleBtn" class="menu-toggle-btn" onclick="toggleMenuCollapse()">メニュー ▲</button>
    </div>
    <!-- 重複していた予約一覧を外し、「読込」「設定」に整理 -->
    <div class="h-btns" id="staffHeaderBtns">
      <button type="button" onclick="openModal('ocrModal')">
        <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5L5 19"/></svg>
        <span>読込</span>
      </button>
      <button type="button" onclick="openModal('setupModal')">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>設定</span>
      </button>
    </div>
  </header>

  <!-- 複数釣り物切り替えタブ -->
  <div class="fish-bar" id="fishTabsBar" style="display:none;"></div>

  <div id="topBars" style="display:none;">
    <!-- 船選択タブの1つ上に「予約一覧」ボタンを1本化配置 -->
    <div class="quick-guest-bar" id="quickGuestBar">
      <button type="button" class="quick-guest-btn" id="quickGuestBtn" onclick="openModal('guestListModal')">
        <svg class="ico" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        <span id="quickGuestBtnText">予約一覧</span>
      </button>
    </div>

    <!-- 統一デザインの船選択タブ -->
    <div class="tabs" id="boatTabs"></div>

    <!-- スタッフ操作バー（残り自動確定は予約一覧の上部へ移動済み） -->
    <div class="mode-bar" id="staffModeBar">
      <div class="mark-split">
        <button type="button" id="bagModeBtn" class="bag-btn" onclick="toggleMarkMode('BAG')">■ 荷物：OFF</button>
        <button type="button" id="shopModeBtn" class="shop-btn" onclick="toggleMarkMode('SHOP')">● 店取り：OFF</button>
      </div>
      <button type="button" id="undoBtn" class="undo-btn" onclick="undoLastAction()" disabled>↩ 1つ前に戻す</button>
    </div>
  </div>

  <div class="container" id="main"></div>

  <div class="toast" id="toast"></div>

  <!-- 「予約一覧」モーダル（上部に「残り自動確定」ボタン配置） -->
  <div class="modal-bg" id="guestListModal">
    <div class="modal modal-wide">
      <div class="m-head">
        <div class="m-head-left">
          <span style="font-size:19px;" id="guestModalTitle">予約一覧</span>
          <button type="button" class="warning" id="modalOrigImgBtn" onclick="openOrigImage()" style="padding:7px 11px; font-size:14px;">元画像</button>
        </div>
        <button type="button" class="modal-close-lg" onclick="closeModal('guestListModal')">閉じる</button>
      </div>
      <div id="guestListModalBody"></div>
    </div>
  </div>

  <!-- 設定モーダル（タブ分け構成：席・船 / 連携・AI / 管理・リセット） -->
  <div class="modal-bg" id="setupModal">
    <div class="modal">
      <div class="m-head">
        <span>設定</span>
        <button type="button" class="modal-close-lg" onclick="closeModal('setupModal')">閉じる</button>
      </div>

      <div class="set-tabs" id="settingsTabsBar">
        <button type="button" class="set-tab active" data-pane="paneBoats" onclick="switchSettingsTab('paneBoats')">席・船</button>
        <button type="button" class="set-tab" data-pane="paneAi" onclick="switchSettingsTab('paneAi')">連携・AI</button>
        <button type="button" class="set-tab" data-pane="paneReset" onclick="switchSettingsTab('paneReset')">管理・リセット</button>
      </div>

      <!-- タブ1：席・船 -->
      <div class="set-pane active" id="paneBoats">
        <div style="display:flex; flex-direction:column; gap:10px;">
          <button type="button" class="primary" style="padding:13px;" onclick="goStep('verify')">読取予約の確認・修正画面へ戻る</button>
          <button type="button" class="primary" style="padding:13px;" onclick="goStep('boats')">出船する船・人数を選び直す</button>
        </div>
      </div>

      <!-- タブ2：連携・AI -->
      <div class="set-pane" id="paneAi">
        <div style="background:var(--inp); border:1px solid #3b82f6; border-radius:9px; padding:11px; margin-bottom:13px;">
          <div style="font-size:15px; font-weight:800; color:#93c5fd; margin-bottom:8px;">32号船 釣果アプリ連携</div>
          <textarea id="expArea" rows="5" readonly style="font-family:monospace; font-size:12px;"></textarea>
          <div style="display:flex; gap:8px; margin-top:8px;">
            <button type="button" class="primary" style="flex:1; padding:9px;" onclick="copyExp()">コピー</button>
            <button type="button" class="success" style="flex:1; padding:9px;" onclick="saveExp()">共有領域に保存</button>
          </div>
        </div>

        <div class="field">
          <label>AI解析モデル</label>
          <select id="modelSelect" onchange="saveModel()">
            <option value="gemini-4-hydrogen">Gemini 4 Hydrogen (標準・高速)</option>
            <option value="gemini-4-neon">Gemini 4 Neon (高精度)</option>
            <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
          </select>
        </div>
        <div class="field">
          <label>Gemini APIキー（予約表の写真解析用）</label>
          <input type="password" id="apiKeyInput" placeholder="AIzaSy..." onchange="saveKey()" />
        </div>
      </div>

      <!-- タブ3：管理・リセット -->
      <div class="set-pane" id="paneReset">
        <div style="display:flex; flex-direction:column; gap:10px;">
          <button type="button" class="danger" style="padding:13px;" onclick="resetSeatsOnly()">座席の配置だけ全て空に戻す</button>
          <button type="button" class="danger" style="padding:13px; background:#7f1d1d;" onclick="resetAllNewDay()">予約と座席をすべて初期化（新営業日）</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 釣り物名変更・統合モーダル -->
  <div class="modal-bg" id="renameFishModal" style="z-index:115;">
    <div class="modal">
      <div class="m-head">
        <span>釣り物（魚種）の変更・統合</span>
        <button type="button" class="modal-close-lg" onclick="closeModal('renameFishModal')">閉じる</button>
      </div>
      <input type="hidden" id="renameFromFish" />
      <div class="field">
        <label id="renameFromLabel">現在の釣り物</label>
        <input type="text" id="renameToFishInput" placeholder="例：カワハギ、アジ、アマダイ" />
        <div class="preset-chips" id="fishPresetChips"></div>
      </div>
      <div style="font-size:13px; color:var(--sub); margin-bottom:12px;">
        ※ すでに同じ釣り物がある場合は、予約グループをまとめて合流します。
      </div>
      <button type="button" class="primary" style="width:100%; padding:13px;" onclick="applyRenameFish()">釣り物を変更する</button>
    </div>
  </div>

  <!-- 元画像フル確認モーダル -->
  <div class="modal-bg" id="origImgModal" style="z-index:120;">
    <div class="modal" style="max-width:540px; padding:12px;">
      <div class="m-head">
        <span>読み込んだ予約表（元画像）</span>
        <button type="button" class="modal-close-lg" style="background:var(--blue); border-color:#60a5fa;" onclick="closeModal('origImgModal')">戻る</button>
      </div>
      <div id="origImgContainer" style="text-align:center;"></div>
    </div>
  </div>

  <!-- OCR読込モーダル -->
  <div class="modal-bg" id="ocrModal">
    <div class="modal">
      <div class="m-head"><span>予約表の写真読込</span><button type="button" class="modal-close-lg" onclick="closeModal('ocrModal')">閉じる</button></div>
      <div style="font-size:14px; color:#cbd5e1; margin-bottom:10px; line-height:1.45;">
        予約表に書かれている釣り物（カワハギ・アジ・アマダイ・スミイカ・カサゴ等）をAIが画像から自動判別し、魚種ごとにまとめて読み取ります。
      </div>
      <div class="field"><label>予約表の写真を選択</label><input type="file" id="ocrFile" accept="image/*" /></div>
      <button type="button" class="primary" style="width:100%; padding:13px;" id="ocrBtn" onclick="runOcr()">AIで自動判別して解析する</button>
      <div id="ocrMsg" style="margin-top:10px; font-size:15px;"></div>
      <div id="ocrParsedListArea"></div>
    </div>
  </div>

  <!-- 手動追加モーダル -->
  <div class="modal-bg" id="addModal">
    <div class="modal">
      <div class="m-head"><span>予約グループ追加</span><button type="button" class="modal-close-lg" onclick="closeModal('addModal')">閉じる</button></div>
      <div class="field"><label>釣り物（魚種）</label><input type="text" id="addFish" placeholder="例：カワハギ" /></div>
      <div class="field"><label>代表者名</label><input type="text" id="addName" placeholder="例：井部" /></div>
      <div class="field"><label>人数</label><input type="number" id="addCount" value="1" min="1" max="15" /></div>
      <div class="field"><label>メモ（前日場所取 / 竿 / カラ）</label><input type="text" id="addNote" /></div>
      <button type="button" class="primary" style="width:100%; padding:13px;" onclick="addGuest()">追加する</button>
    </div>
  </div>

  <!-- 編集・削除モーダル（グループごとの釣り物移動に対応） -->
  <div class="modal-bg" id="editModal">
    <div class="modal">
      <div class="m-head"><span>予約の修正・移動・削除</span><button type="button" class="modal-close-lg" onclick="closeModal('editModal')">閉じる</button></div>
      <input type="hidden" id="editId" />
      <div class="field">
        <label>釣り物（魚種）</label>
        <input type="text" id="editFish" list="editFishDatalist" placeholder="例：カワハギ、アジ" />
        <datalist id="editFishDatalist"></datalist>
      </div>
      <div class="field"><label>代表者名</label><input type="text" id="editName" /></div>
      <div class="field">
        <label>人数</label>
        <div style="display:flex; gap:10px; align-items:center;">
          <button type="button" style="padding:11px 20px; font-size:20px;" onclick="stepEdit(-1)">−</button>
          <input type="number" id="editCount" min="1" max="15" style="text-align:center; font-weight:800;" />
          <button type="button" style="padding:11px 20px; font-size:20px;" onclick="stepEdit(1)">＋</button>
        </div>
      </div>
      <div class="field"><label>メモ</label><input type="text" id="editNote" /></div>
      <div style="display:flex; gap:8px;">
        <button type="button" class="danger" style="flex:1; padding:13px;" onclick="delGuest()">削除</button>
        <button type="button" class="primary" style="flex:1; padding:13px;" onclick="saveEdit()">保存</button>
      </div>
    </div>
  </div>

  <script>
    const BOAT_LIST = ["32号船", "31号船", "27号船", "25号船", "智丸"];
    const PRESET_FISH = ["カワハギ", "アジ", "アマダイ", "スミイカ", "カサゴ", "マゴチ", "乗合", "不明"];
    const STORE_KEY = "yamashitamaru_seat_flow_v17";
    const SHARED_32 = "yamashitamaru_seat_32_export";

    let draftBoats = [];
    let uidCounter = 1;
    let lastOcrImageDataUrl = null;
    let undoStack = [];
    let shopLongPressTimer = null;
    let shopLongPressFired = false;

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function getBoatCode(boatName) {
      if (!boatName) return "";
      if (boatName.includes("32")) return "32";
      if (boatName.includes("31")) return "31";
      if (boatName.includes("27")) return "27";
      if (boatName.includes("25")) return "25";
      return "";
    }

    function createEmptyFishSlot(fishName) {
      return {
        fish: fishName || "不明",
        step: "verify",
        ocrWrittenTotal: null,
        view: "overview",
        boats: [],
        guests: []
      };
    }

    let state = {
      savedDate: getTodayStr(),
      ocrLoaded: false,
      ocrImage: null,
      menuCollapsed: false,
      parsedSheetOpen: false,
      sortMode: "desc",
      markMode: null,
      customSplitMode: false,
      seatEditMode: false,
      selId: null,
      activeFish: "不明",
      fishList: ["不明"],
      fishData: {
        "不明": createEmptyFishSlot("不明")
      }
    };

    function getCur() {
      if (!state.fishData[state.activeFish]) {
        const firstKey = state.fishList[0] || "不明";
        if (!state.fishData[firstKey]) {
          state.fishData[firstKey] = createEmptyFishSlot(firstKey);
        }
        state.activeFish = firstKey;
      }
      return state.fishData[state.activeFish];
    }

    function applyBoatBodyTheme() {
      document.body.className = "";
      const cur = getCur();
      if (cur.step === "seats" && cur.view !== "overview") {
        const code = getBoatCode(cur.view);
        if (code) document.body.classList.add(`theme-${code}`);
      }
    }

    function pushUndo(actionLabel) {
      undoStack.push({
        label: actionLabel,
        fishData: JSON.parse(JSON.stringify(state.fishData)),
        fishList: [...state.fishList],
        activeFish: state.activeFish
      });
      if (undoStack.length > 20) undoStack.shift();
    }

    function undoLastAction() {
      if (undoStack.length === 0) {
        toast("これ以上戻せる操作がありません");
        return;
      }
      const prev = undoStack.pop();
      state.fishData = prev.fishData;
      if (Array.isArray(prev.fishList)) state.fishList = prev.fishList;
      if (prev.activeFish) state.activeFish = prev.activeFish;
      state.selId = null;
      state.customSplitMode = false;
      save(); render();
      toast(`↩ 1つ前に戻しました（${prev.label}）`);
    }

    function makeUniqueId(prefix) {
      uidCounter += 1;
      return `${prefix}_${Date.now()}_${uidCounter}`;
    }

    function assignDefault45Rows(list) {
      let rowIdx = 0;
      let colIdx = 0;
      return (list || []).map(g => {
        const capInRow = (rowIdx % 2 === 0) ? 4 : 5;
        const item = { ...g, row: rowIdx, col: colIdx };
        colIdx++;
        if (colIdx >= capInRow) {
          rowIdx++;
          colIdx = 0;
        }
        return item;
      });
    }

    function normalizeGuests(list) {
      const seen = new Set();
      const mapped = (list || []).map(g => {
        let id = String(g.id || "");
        if (!id || seen.has(id)) id = makeUniqueId("g");
        seen.add(id);
        return {
          id,
          name: String(g.name || "").trim(),
          count: Math.min(15, Math.max(1, parseInt(g.count, 10) || 1)),
          note: String(g.note || "").trim(),
          row: Number.isInteger(g.row) && g.row >= 0 ? g.row : -1,
          col: Number.isInteger(g.col) && g.col >= 0 ? g.col : -1
        };
      });
      const hasExplicitRows = mapped.some(x => x.row > 0) || (mapped.length > 0 && mapped.every(x => x.row === 0 && x.col >= 0 && x.col < 4 && mapped.length <= 4));
      if (!hasExplicitRows && mapped.length > 0) {
        return assignDefault45Rows(mapped);
      }
      return mapped.map((x, idx) => ({
        ...x,
        row: x.row >= 0 ? x.row : 0,
        col: x.col >= 0 ? x.col : idx
      }));
    }

    function isMarkSeat(c) {
      return c && (c.type === "BAG" || c.type === "SHOP" || c.type === "HOLD");
    }

    function isShopSeat(c) {
      return c && (c.type === "SHOP" || c.type === "HOLD");
    }

    function countAssignedSeatsForGuest(guestId) {
      const cur = getCur();
      const targetId = String(guestId);
      let cnt = 0;
      cur.boats.forEach(b => ["leftSeats", "rightSeats"].forEach(sk => {
        b[sk].forEach(c => {
          if (c && c.type === "ASSIGNED" && String(c.guestId) === targetId) cnt++;
        });
      }));
      return cnt;
    }

    // 指定お客様の「● 店取り」席数を集計
    function countShopSeatsForGuest(guestId) {
      const cur = getCur();
      const targetId = String(guestId);
      let cnt = 0;
      cur.boats.forEach(b => ["leftSeats", "rightSeats"].forEach(sk => {
        b[sk].forEach(c => {
          if (isShopSeat(c) && String(c.holderId) === targetId) cnt++;
        });
      }));
      return cnt;
    }

    function migrateOldSingleFishState(parsed) {
      const fishName = "カワハギ";
      const slot = createEmptyFishSlot(fishName);
      slot.step = parsed.step || "verify";
      slot.ocrWrittenTotal = parsed.ocrWrittenTotal || null;
      slot.view = parsed.view || "overview";
      slot.boats = parsed.boats || [];
      slot.guests = normalizeGuests(parsed.guests || []);
      return {
        savedDate: getTodayStr(),
        ocrLoaded: slot.guests.length > 0 || Boolean(parsed.ocrLoaded),
        ocrImage: parsed.ocrImage || null,
        menuCollapsed: Boolean(parsed.menuCollapsed),
        parsedSheetOpen: Boolean(parsed.parsedSheetOpen),
        sortMode: parsed.sortMode || "desc",
        markMode: null,
        customSplitMode: false,
        seatEditMode: false,
        selId: null,
        activeFish: fishName,
        fishList: [fishName],
        fishData: { [fishName]: slot }
      };
    }

    function init() {
      const today = getTodayStr();
      const saved = localStorage.getItem(STORE_KEY) || localStorage.getItem("yamashitamaru_seat_flow_v16");
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          const isNewFormat = Boolean(parsed.fishData && Array.isArray(parsed.fishList));
          const hasData = isNewFormat
            ? parsed.fishList.some(f => {
                const fd = parsed.fishData[f];
                return fd && ((fd.guests && fd.guests.length > 0) || (fd.boats && fd.boats.length > 0 && fd.step === "seats"));
              })
            : ((parsed.guests && parsed.guests.length > 0) || (parsed.boats && parsed.boats.length > 0 && parsed.step === "seats"));

          let useRestored = true;
          if (parsed.savedDate && parsed.savedDate !== today && hasData) {
            const parts = parsed.savedDate.split("-");
            const label = parts.length === 3 ? `${Number(parts[1])}/${Number(parts[2])}` : parsed.savedDate;
            useRestored = !confirm(`前日（${label}）のデータが残っています。\nリセットして新しく始めますか？\n\n・OK：すべて消去して新しく始める\n・キャンセル：前日のデータをそのまま使う`);
          }

          if (!useRestored) {
            state.savedDate = today;
            save();
          } else if (isNewFormat) {
            state = { ...state, ...parsed, savedDate: today };
            state.fishList.forEach(f => {
              if (state.fishData[f]) {
                state.fishData[f].guests = normalizeGuests(state.fishData[f].guests);
              }
            });
            if (state.ocrImage) lastOcrImageDataUrl = state.ocrImage;
            const cur = getCur();
            if (cur.boats && cur.boats.length > 0) {
              draftBoats = cur.boats.map(b => ({ name: b.name, leftCap: Number(b.leftCap), rightCap: Number(b.rightCap) }));
            }
            save();
          } else {
            state = migrateOldSingleFishState(parsed);
            if (state.ocrImage) lastOcrImageDataUrl = state.ocrImage;
            const cur = getCur();
            if (cur.boats && cur.boats.length > 0) {
              draftBoats = cur.boats.map(b => ({ name: b.name, leftCap: Number(b.leftCap), rightCap: Number(b.rightCap) }));
            }
            save();
          }
        } catch (e) {}
      }
      document.getElementById("apiKeyInput").value = localStorage.getItem("gemini_api_key") || "";
      document.getElementById("modelSelect").value = localStorage.getItem("gemini_seat_model") || "gemini-4-hydrogen";
      render();
    }

    function save() {
      state.savedDate = getTodayStr();
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(state));
      } catch (e) {
        const copy = { ...state, ocrImage: null };
        localStorage.setItem(STORE_KEY, JSON.stringify(copy));
      }
    }

    function applyRenameFish() {
      const fromFish = document.getElementById("renameFromFish").value;
      const toFish = document.getElementById("renameToFishInput").value.trim();
      if (!toFish) {
        toast("変更後の釣り物名を入力または選択してください");
        return;
      }
      if (!state.fishData[fromFish]) {
        closeModal("renameFishModal");
        return;
      }
      if (fromFish === toFish) {
        closeModal("renameFishModal");
        toast(`釣り物は「${toFish}」のままです`);
        return;
      }

      pushUndo(`釣り物を「${fromFish}」から「${toFish}」へ変更`);

      const srcSlot = state.fishData[fromFish];
      if (!state.fishData[toFish]) {
        const newSlot = createEmptyFishSlot(toFish);
        newSlot.step = srcSlot.step;
        newSlot.ocrWrittenTotal = srcSlot.ocrWrittenTotal;
        newSlot.view = srcSlot.view;
        newSlot.boats = JSON.parse(JSON.stringify(srcSlot.boats || []));
        newSlot.guests = assignDefault45Rows(srcSlot.guests || []);
        state.fishData[toFish] = newSlot;
        const idx = state.fishList.indexOf(fromFish);
        if (idx >= 0) state.fishList.splice(idx, 1, toFish);
        else state.fishList.push(toFish);
      } else {
        // 既存釣り物へ統合（マージ）
        const dstSlot = state.fishData[toFish];
        const baseRow = dstSlot.guests.length > 0
          ? Math.max(...dstSlot.guests.map(x => Number(x.row) || 0)) + 1
          : 0;
        (srcSlot.guests || []).forEach((g, idx) => {
          dstSlot.guests.push({
            ...g,
            row: baseRow + Math.floor(idx / 4),
            col: idx % 4
          });
        });
        if (!dstSlot.ocrWrittenTotal && srcSlot.ocrWrittenTotal) {
          dstSlot.ocrWrittenTotal = srcSlot.ocrWrittenTotal;
        }
        delete state.fishData[fromFish];
        state.fishList = state.fishList.filter(f => f !== fromFish);
      }

      if (state.activeFish === fromFish) {
        state.activeFish = toFish;
      }
      state.selId = null;
      state.customSplitMode = false;

      closeModal("renameFishModal");
      save(); render();
      if (document.getElementById("ocrModal").classList.contains("open")) {
        renderOcrParsedList();
      }
      toast(`釣り物を「${toFish}」に更新しました`);
    }

    function startWithDraft() {
      const cur = getCur();
      if (draftBoats.length === 0) {

      const invalidBoat = draftBoats.find(b => (Number(b.leftCap) || 0) <= 0 || (Number(b.rightCap) || 0) <= 0);
      if (invalidBoat) {
        toast(`${invalidBoat.name} の左舷・右舷の人数を入力してください`);
        return;
      }

      const oldMap = new Map(cur.boats.map(b => [b.name, b]));
      cur.boats = draftBoats.map(b => {
        const lc = Number(b.leftCap), rc = Number(b.rightCap);
        const old = oldMap.get(b.name);
        if (old) {
          const ls = [...old.leftSeats];
          while (ls.length < lc) ls.push(null);
          if (ls.length > lc) ls.length = lc;
          const rs = [...old.rightSeats];
          while (rs.length < rc) rs.push(null);
          if (rs.length > rc) rs.length = rc;
          return { name: b.name, leftCap: lc, rightCap: rc, leftSeats: ls, rightSeats: rs };
        }
        return { name: b.name, leftCap: lc, rightCap: rc, leftSeats: Array(lc).fill(null), rightSeats: Array(rc).fill(null) };
      });

      cur.step = "seats";
      cur.view = "overview";
      save(); render();
      toast(`「${cur.fish}」の配船を確定し、座席表を開始しました`);
