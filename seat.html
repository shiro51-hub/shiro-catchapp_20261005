    function canFitAll(boatsSnap, unplaced) {
      if (!unplaced || unplaced.length === 0) return true;

      let markedSlots = 0;
      const blocks = [];
      boatsSnap.forEach(b => ["leftSeats", "rightSeats"].forEach(sk => {
        let run = 0;
        b[sk].forEach(c => {
          if (c === null) {
            run++;
          } else {
            if (isMarkSeat(c)) markedSlots++;
            if (run > 0) { blocks.push(run); run = 0; }
          }
        });
        if (run > 0) blocks.push(run);
      }));

      const totalEmpty = blocks.reduce((a, b) => a + b, 0);
      const totalUnplacedNeed = unplaced.reduce((a, g) => a + Number(g.count || 0), 0);

      const netNeed = Math.max(0, totalUnplacedNeed - markedSlots);
      if (totalEmpty < netNeed) return false;
      if (netNeed === 0) return true;

      const sorted = [...unplaced].sort((a, b) => Number(b.count || 0) - Number(a.count || 0));

      function tryAssign(idx, remBlocks, remMarks) {
        if (idx === sorted.length) return true;
        const need = Number(sorted[idx].count || 1);

        const triedSizes = new Set();
        for (let k = 0; k < remBlocks.length; k++) {
          if (remBlocks[k] >= need && !triedSizes.has(remBlocks[k])) {
            triedSizes.add(remBlocks[k]);
            const nextBlocks = [...remBlocks];
            nextBlocks[k] -= need;
            if (tryAssign(idx + 1, nextBlocks, remMarks)) return true;
          }
        }

        const markCover = Math.min(need, remMarks);
        const remAfterMark = need - markCover;
        const availEmpty = remBlocks.reduce((a, b) => a + b, 0);
        if (availEmpty >= remAfterMark) {
          if (remAfterMark === 0) {
            if (tryAssign(idx + 1, remBlocks, remMarks - markCover)) return true;
          } else {
            const nextBlocks = [...remBlocks].sort((a, b) => b - a);
            let leftToFill = remAfterMark;
            for (let k = 0; k < nextBlocks.length && leftToFill > 0; k++) {
              const take = Math.min(nextBlocks[k], leftToFill);
              nextBlocks[k] -= take;
              leftToFill -= take;
            }
            if (leftToFill === 0 && tryAssign(idx + 1, nextBlocks, remMarks - markCover)) return true;
          }
        }

        return false;
      }

      return tryAssign(0, blocks, markedSlots);
    }

    function evalPlace(bIdx, sk, start, guest) {
      const cur = getCur();
      const b = cur.boats[bIdx];
      if (!b || !b[sk]) return { valid: false };
      const arr = b[sk];
      const st = Number(start);
      const cnt = Number(guest.count) || 1;
      if (st < 0 || st + cnt > arr.length) return { valid: false };

      for (let i = st; i < st + cnt; i++) {
        if (arr[i] && arr[i].type === "ASSIGNED" && String(arr[i].guestId) !== String(guest.id)) {
          return { valid: false };
        }
      }

      const clone = JSON.parse(JSON.stringify(cur.boats));
      clone.forEach(boat => ["leftSeats", "rightSeats"].forEach(s => {
        boat[s] = boat[s].map(c => (c && c.type === "ASSIGNED" && String(c.guestId) === String(guest.id)) ? null : c);
      }));
      for (let i = st; i < st + cnt; i++) {
        clone[bIdx][sk][i] = { type: "ASSIGNED", guestId: String(guest.id) };
      }

      const unplaced = cur.guests
        .map(g => {
          let assigned = 0;
          clone.forEach(boat => ["leftSeats", "rightSeats"].forEach(s => {
            boat[s].forEach(c => { if (c && c.type === "ASSIGNED" && String(c.guestId) === String(g.id)) assigned++; });
          }));
          const rem = Math.max(0, Number(g.count || 1) - assigned);
          return rem > 0 ? { ...g, count: rem } : null;
        })
        .filter(Boolean);

      return { valid: true, fits: canFitAll(clone, unplaced) };
    }

    // 「● 店取り」席の長押し（名前あり＝確認後本席確定／名前なし＝無反応）
    function startSeatPress(bIdx, sk, idx) {
      shopLongPressFired = false;
      clearTimeout(shopLongPressTimer);
      if (state.menuCollapsed) return;

      const curSlot = getCur();
      const boat = curSlot.boats[bIdx];
      if (!boat || !boat[sk]) return;
      const c = boat[sk][idx];
      if (!isShopSeat(c)) return;

      shopLongPressTimer = setTimeout(() => {
        shopLongPressFired = true;
        if (!c.holderName || !c.holderId) {
          return;
        }
        const g = curSlot.guests.find(x => String(x.id) === String(c.holderId));
        if (!g) return;
        const sideLabel = sk === "leftSeats" ? "左舷" : "右舷";
        if (confirm(`${c.holderName} 様の席（${boat.name} ${sideLabel}${idx + 1}番）で確定していいですか？`)) {
          pushUndo(`${c.holderName}様の店取り席を本席確定`);
          curSlot.boats[bIdx][sk][idx] = {
            type: "ASSIGNED",
            guestId: String(g.id),
            name: g.name,
            count: Number(g.count),
            note: g.note
          };
          save(); render();
          toast(`${g.name} 様の席を確定しました`);
        }
      }, 600);
    }

    function cancelSeatPress() {
      clearTimeout(shopLongPressTimer);
    }

    function onSeatClickWrapper(bIdx, sk, idx) {
      if (shopLongPressFired) {
        shopLongPressFired = false;
        return;
      }
      handleSeatClick(bIdx, sk, idx);
    }

    function handleSeatClick(bIdx, sk, idx) {
      if (state.menuCollapsed) return;

      const curSlot = getCur();
      const boat = curSlot.boats[bIdx];
      if (!boat || !boat[sk]) return;
      const seatIdx = Number(idx);
      const cur = boat[sk][seatIdx];
      const sideLabel = sk === "leftSeats" ? "左舷" : "右舷";

      if (state.markMode) {
        if (cur && cur.type === "ASSIGNED") { toast("確定済みの席です"); return; }
        const selHolder = curSlot.guests.find(x => String(x.id) === String(state.selId));
        const holderName = selHolder ? selHolder.name : "";
        const holderCount = selHolder ? Number(selHolder.count) : 0;

        if (cur && cur.type === state.markMode) {
          const oldDesc = formatMarkLabel(cur);
          if (!confirm(`${boat.name} ${sideLabel}${seatIdx + 1}番の「${oldDesc}」を解除しますか？`)) return;
          pushUndo(`${oldDesc}の解除`);
          curSlot.boats[bIdx][sk][seatIdx] = null;
          save(); render();
          toast(`${oldDesc}を解除しました`);
          return;
        }

        if (state.markMode === "SHOP" && selHolder) {
          const curShopCnt = countShopSeatsForGuest(selHolder.id);
          if (curShopCnt >= holderCount) {
            toast(`${selHolder.name} 様の店取りは上限（${holderCount}席）に達しています`);
            return;
          }
        }

        if (cur && isMarkSeat(cur) && cur.type !== state.markMode) {
          const oldDesc = formatMarkLabel(cur);
          const newDesc = formatMarkLabel({ type: state.markMode, holderName, holderCount });
          if (!confirm(`${boat.name} ${sideLabel}${seatIdx + 1}番の「${oldDesc}」を「${newDesc}」に変更しますか？`)) return;
        }

        const newMark = {
          type: state.markMode,
          holderId: selHolder ? String(selHolder.id) : "",
          holderName,
          holderCount
        };
        pushUndo(`${formatMarkLabel(newMark)}の入力`);
        curSlot.boats[bIdx][sk][seatIdx] = newMark;
        save(); render();
        toast(`${boat.name} ${sideLabel}${seatIdx + 1}番に「${formatMarkLabel(newMark)}」を記録`);
        return;
      }

      if (state.selId) {
        const g = curSlot.guests.find(x => String(x.id) === String(state.selId));
        if (!g) { state.selId = null; state.customSplitMode = false; render(); return; }

        if (state.customSplitMode) {
          if (cur && cur.type === "ASSIGNED" && String(cur.guestId) === String(g.id)) {
            pushUndo(`${g.name}様の1席解除`);
            curSlot.boats[bIdx][sk][seatIdx] = null;
            save(); render();
            const nowCnt = countAssignedSeatsForGuest(g.id);
            toast(`${g.name}様の1席を解除（現在 ${nowCnt}/${g.count}名）`);
            return;
          }
          if (cur && cur.type === "ASSIGNED") {
            toast(`${cur.name}様が確定済みの席です`);
            return;
          }
          const alreadyCnt = countAssignedSeatsForGuest(g.id);
          if (alreadyCnt >= Number(g.count)) {
            toast(`${g.name}様はすでに全員分（${g.count}名）配置済みです`);
            return;
          }
          if (isMarkSeat(cur)) {
            const mLabel = formatMarkLabel(cur);
            if (!confirm(`${boat.name} ${sideLabel}${seatIdx + 1}番の「${mLabel}」を上書きして ${g.name}様（1名分）を配置しますか？`)) return;
          }
          pushUndo(`${g.name}様の個別1席配置`);
          curSlot.boats[bIdx][sk][seatIdx] = {
            type: "ASSIGNED",
            guestId: String(g.id),
            name: g.name,
            count: Number(g.count),
            note: g.note
          };
          const afterCnt = alreadyCnt + 1;
          if (afterCnt >= Number(g.count)) {
            state.selId = null;
            state.customSplitMode = false;
            save(); render();
            toast(`${g.name}様（全${g.count}名）のバラバラ配置が完了しました`);
          } else {
            save(); render();
            toast(`${g.name}様：${afterCnt}/${g.count}名 配置（残り ${g.count - afterCnt}名）`);
          }
          return;
        }

        if (cur && cur.type === "ASSIGNED" && String(cur.guestId) === String(g.id)) {
          if (!confirm(`${g.name}様（${g.count}名）の座席確定を解除しますか？`)) return;
          pushUndo(`${g.name}様の解除`);
          removeGuest(g.id);
          state.selId = null;
          save(); render();
          toast(`${g.name}様を解除しました`);
          return;
        }

        const cnt = Number(g.count) || 1;
        const currentLen = curSlot.boats[bIdx][sk].length;
        if (cnt > currentLen) {
          toast(`${g.name}様は${cnt}名のため片舷に入りきりません。上の「バラバラ配置」をONにして左右に分けてください`);
          return;
        }

        let st = seatIdx;
        if (st + cnt > currentLen) st = Math.max(0, currentLen - cnt);
        const ev = evalPlace(bIdx, sk, st, g);
        if (!ev.valid) {
          toast(`他の確定済みのお客様と重なるため配置できません。分ける場合は上の「バラバラ配置」をONにしてください`);
          return;
        }

        if (!ev.fits) {
          if (!confirm(`この配置だと後続グループが並んで座れません。\nこのまま ${g.name}様(${cnt}名) を案内しますか？`)) return;
        }

        let overlappingMarks = 0;
        for (let i = st; i < st + cnt; i++) {
          if (isMarkSeat(curSlot.boats[bIdx][sk][i])) overlappingMarks++;
        }
        if (overlappingMarks > 0) {
          if (!confirm(`この場所には「荷物」または「店取り」が${overlappingMarks}席含まれています。上書きして ${g.name}様(${cnt}名) を配置しますか？`)) return;
        }

        pushUndo(`${g.name}様の配置`);
        removeGuest(g.id);
        const targetArr = curSlot.boats[bIdx][sk];
        for (let i = st; i < st + cnt; i++) {
          targetArr[i] = { type: "ASSIGNED", guestId: String(g.id), name: g.name, count: cnt, note: g.note };
        }
        state.selId = null;
        state.customSplitMode = false;

        save(); render();
        toast(`${g.name}様(${cnt}名)を ${boat.name} ${sideLabel}${st + 1}番〜 に確定`);
        return;
      }

      if (cur && cur.type === "ASSIGNED") {
        state.selId = String(cur.guestId);
        const assignedNow = countAssignedSeatsForGuest(cur.guestId);
        const gObj = curSlot.guests.find(x => String(x.id) === String(cur.guestId));
        state.customSplitMode = !!(gObj && assignedNow > 0 && assignedNow < Number(gObj.count));
        render();
        toast(`${cur.name}様を選択中（移動先タップ、または再タップで解除）`);
        return;
      }

      if (isMarkSeat(cur)) {
        const label = formatMarkLabel(cur);
        if (!confirm(`${boat.name} ${sideLabel}${seatIdx + 1}番の「${label}」を解除しますか？`)) return;
        pushUndo(`${label}の解除`);
        curSlot.boats[bIdx][sk][seatIdx] = null;
        save(); render();
        toast(`${label}を解除しました`);
        return;
      }

      toast("上の「予約一覧」からお名前を選んでから席をタップしてください");
    }

    function formatMarkLabel(c) {
      if (!c) return "";
      const base = c.type === "BAG" ? "■ 荷物" : "● 店取り";
      if (c.holderName) {
        return c.holderCount ? `${base} ${c.holderName}(${c.holderCount})` : `${base} ${c.holderName}`;
      }
      return base;
    }

    function removeGuestFromSlot(slot, id) {
      const targetId = String(id);
      (slot.boats || []).forEach(b => ["leftSeats", "rightSeats"].forEach(sk => {
        for (let i = 0; i < b[sk].length; i++) {
          if (b[sk][i] && b[sk][i].type === "ASSIGNED" && String(b[sk][i].guestId) === targetId) {
            b[sk][i] = null;
          }
        }
      }));
    }

    function removeGuest(id) {
      removeGuestFromSlot(getCur(), id);
    }

    function autoAssign() {
      const cur = getCur();
      const unplaced = cur.guests
        .map(g => ({ ...g, remNeed: Math.max(0, Number(g.count) - countAssignedSeatsForGuest(g.id)) }))
        .filter(g => g.remNeed > 0)
        .sort((a, b) => b.remNeed - a.remNeed);

      if (unplaced.length === 0) {
        toast("全員すでに確定済みです");
        return;
      }

      let pureEmptyTotal = 0;
      let protectedMarks = 0;
      cur.boats.forEach(b => ["leftSeats", "rightSeats"].forEach(sk => {
        b[sk].forEach(c => {
          if (c === null) pureEmptyTotal++;
          else if (isMarkSeat(c)) protectedMarks++;
        });
      }));

      const totalNeed = unplaced.reduce((a, g) => a + g.remNeed, 0);
      if (pureEmptyTotal < totalNeed) {
        if (protectedMarks > 0) {
          alert(`空き席が足りません。\n\n未配置の残り人数：${totalNeed}名\n空いている席：${pureEmptyTotal}席\n保護中の「■荷物・●店取り」：${protectedMarks}席\n\n荷物・店取りの席は勝手に消さない設定になっています。先に荷物・店取りの席へお客様を割り当てるか、解除してから再度押してください。`);
        } else {
          alert(`船の空き席（${pureEmptyTotal}席）が未配置の人数（${totalNeed}名）より不足しています。座席数を増やすか調整してください。`);
        }
        return;
      }

      if (!confirm(`「${cur.fish}」の未配置残り${unplaced.length}組（計${totalNeed}名）を、空いている席へ自動振り分けしますか？\n（※「■ 荷物」「● 店取り」の席はそのまま保護されます）`)) {
        return;
      }

      pushUndo(`${cur.fish} 残り自動確定`);

      const runs = () => {
        const r = [];
        cur.boats.forEach((b, bIdx) => ["leftSeats", "rightSeats"].forEach(sk => {
          let st = -1;
          b[sk].forEach((c, i) => {
            if (c === null) { if (st === -1) st = i; }
            else { if (st !== -1) { r.push({ bIdx, sk, st, len: i - st }); st = -1; } }
          });
          if (st !== -1) r.push({ bIdx, sk, st, len: b[sk].length - st });
        }));
        return r;
      };

      let splits = 0;
      for (const g of unplaced) {
        const cnt = g.remNeed;
        const fit = runs().filter(r => r.len >= cnt).sort((a, b) => a.len - b.len);
        if (fit.length > 0) {
          const t = fit[0], arr = cur.boats[t.bIdx][t.sk];
          for (let i = t.st; i < t.st + cnt; i++) {
            arr[i] = { type: "ASSIGNED", guestId: String(g.id), name: g.name, count: Number(g.count), note: g.note };
          }
        } else {
          splits++;
          let rem = cnt;
          for (const r of runs().sort((a, b) => b.len - a.len)) {
            if (rem <= 0) break;
            const take = Math.min(r.len, rem), arr = cur.boats[r.bIdx][r.sk];
            for (let i = r.st; i < r.st + take; i++) {
              arr[i] = { type: "ASSIGNED", guestId: String(g.id), name: `${g.name}(分)`, count: Number(g.count), note: g.note };
            }
            rem -= take;
          }
        }
      }

      state.selId = null;
      state.customSplitMode = false;
      closeModal("guestListModal");
      save(); render();
      toast(splits > 0 ? `連番空き不足のため${splits}組が分かれて確定しました` : "残り全員の座席を確定しました");
    }

    function getFullyPlacedIds() {
      const cur = getCur();
      const ids = new Set();
      cur.guests.forEach(g => {
        if (countAssignedSeatsForGuest(g.id) >= Number(g.count)) {
          ids.add(String(g.id));
        }
      });
      return ids;
    }

    function getGuestAssignedBoats(guestId) {
      const cur = getCur();
      const targetId = String(guestId);
      const names = [];
      cur.boats.forEach(b => {
        const found = b.leftSeats.some(c => c && c.type === "ASSIGNED" && String(c.guestId) === targetId)
          || b.rightSeats.some(c => c && c.type === "ASSIGNED" && String(c.guestId) === targetId);
        if (found) names.push(b.name.replace("船", ""));
      });
      return names.join("・");
    }

    function changeCap(bIdx, side, d) {
      const cur = getCur();
      const b = cur.boats[bIdx], k = side === "left" ? "leftCap" : "rightCap", sk = side === "left" ? "leftSeats" : "rightSeats";
      const nxt = Number(b[k]) + d;
      if (nxt < 1 || nxt > 15) return;
      if (d < 0) {
        const lastSeat = b[sk][b[sk].length - 1];
        if (lastSeat && lastSeat.type === "ASSIGNED") {
          toast(`一番後ろに ${lastSeat.name}様 が座っているため減らせません`);
          return;
        }
      }
      pushUndo(`${b.name}の人数変更`);
      b[k] = nxt;
      while (b[sk].length < nxt) b[sk].push(null);
      if (b[sk].length > nxt) b[sk].length = nxt;
      save(); render();
    }

    function swapCaps(bIdx) {
      const cur = getCur();
      const b = cur.boats[bIdx], tmp = Number(b.leftCap);
      pushUndo(`${b.name}の左右入替`);
      b.leftCap = Number(b.rightCap); b.rightCap = tmp;
      while (b.leftSeats.length < b.leftCap) b.leftSeats.push(null);
      b.leftSeats.length = b.leftCap;
      while (b.rightSeats.length < b.rightCap) b.rightSeats.push(null);
      b.rightSeats.length = b.rightCap;
      save(); render(); toast("左右の定員を入れ替えました");
    }

    function selectGuestFromModal(id) {
      if (state.menuCollapsed) {
        toast("メニューを開くと座席の割り当てができます");
        return;
      }
      const cur = getCur();
      const targetId = String(id);
      if (String(state.selId) === targetId && !state.markMode) {
        state.selId = null;
        state.customSplitMode = false;
      } else {
        state.selId = targetId;
        const g = cur.guests.find(x => String(x.id) === targetId);
        const curAssigned = g ? countAssignedSeatsForGuest(g.id) : 0;
        state.customSplitMode = !state.markMode && !!(g && curAssigned > 0 && curAssigned < Number(g.count));
      }
      closeModal("guestListModal");
      render();
      if (state.selId) {
        window.scrollTo({ top: 0, behavior: "smooth" });
        const g = cur.guests.find(x => String(x.id) === String(state.selId));
        if (g) {
          if (state.markMode) {
            const mTxt = state.markMode === "BAG" ? "■ 荷物" : "● 店取り";
            toast(`${mTxt}（${g.name}様 ${g.count}名）を付ける席をタップしてください`);
          } else {
            toast(`${g.name}様(${g.count}名)を選択：座席をタップしてください`);
          }
        }
      }
    }

    function renderGuestListModal() {
      const cur = getCur();
      document.getElementById("guestModalTitle").textContent = `${cur.fish} 予約一覧`;
      const body = document.getElementById("guestListModalBody");
      const origBtn = document.getElementById("modalOrigImgBtn");
      const hasImg = !!(lastOcrImageDataUrl || state.ocrImage);
      origBtn.style.opacity = hasImg ? "1" : "0.45";

      const placed = getFullyPlacedIds();
      const unplaced = cur.guests.filter(g => !placed.has(String(g.id)));
      const placedList = cur.guests.filter(g => placed.has(String(g.id)));
      const unpCnt = unplaced.reduce((a, g) => a + Math.max(0, Number(g.count) - countAssignedSeatsForGuest(g.id)), 0);
      const totCnt = cur.guests.reduce((a, g) => a + Number(g.count), 0);
      const isAsc = state.sortMode === "asc";

      let listHtml = "";
      if (cur.guests.length === 0) {
        listHtml = `<div style="grid-column:1 / -1; font-size:15px;color:var(--sub);padding:20px 10px;text-align:center;">「読込」または「＋ 追加」から予約を入れてください</div>`;
      } else {
        const sortFn = (a, b) => {
          const aPrev = (a.note || "").includes("前日場所取") ? 1 : 0;
          const bPrev = (b.note || "").includes("前日場所取") ? 1 : 0;
          if (aPrev !== bPrev) return aPrev - bPrev;
          return isAsc ? (Number(a.count) - Number(b.count)) : (Number(b.count) - Number(a.count));
        };
        const allSorted = [...[...unplaced].sort(sortFn), ...[...placedList].sort(sortFn)];

        listHtml = allSorted.map(g => {
          const assignedNow = countAssignedSeatsForGuest(g.id);
          const shopNow = countShopSeatsForGuest(g.id);
          const isP = assignedNow >= Number(g.count);
          const isPartial = assignedNow > 0 && !isP;
          const isS = String(state.selId) === String(g.id);
          const hasDot = (g.note || "").includes("前日場所取");
          const boatName = assignedNow > 0 ? getGuestAssignedBoats(g.id) : "";
          const statusText = isP
            ? `確定済(${boatName})`
            : (isPartial
              ? `分割(${assignedNow}/${g.count}・${boatName})`
              : (g.note || "通常予約"));
          const shopPillHtml = shopNow > 0 ? `<div class="g-shop-pill">● 店取り ${shopNow}/${g.count}席</div>` : "";
          const editBtnHtml = state.menuCollapsed
            ? ""
            : `<button type="button" class="g-edit-mini" onclick="event.stopPropagation(); openEdit('${g.id}')">編集</button>`;
          return `
            <div class="g-card-2col ${isS ? 'sel' : ''} ${shopNow > 0 ? 'shop-marked' : ''} ${isP ? 'done' : ''} ${isPartial ? 'partial' : ''}" onclick="selectGuestFromModal('${g.id}')">
              <div class="g-card-top">
                <span class="g-name-txt">${g.name}</span>
                <span class="g-cnt">${g.count}名</span>
              </div>
              ${shopPillHtml}
              <div class="g-card-foot">
                <span class="g-meta ${hasDot ? 'dot-mark' : ''}">${statusText}</span>
                ${editBtnHtml}
              </div>
            </div>
          `;
        }).join("");
      }

      const addBtnHtml = state.menuCollapsed
        ? ""
        : `<button type="button" style="padding:7px 11px; font-size:14px;" onclick="openAddModalForFish('${cur.fish}')">＋ 追加</button>`;

      const autoBtnHtml = (!state.menuCollapsed && cur.step === "seats")
        ? `<button type="button" class="success" style="width:100%; padding:11px; font-size:15px;" onclick="autoAssign()" ${unpCnt === 0 ? "disabled" : ""}>残り自動確定（未配置 ${unpCnt}名）</button>`
        : "";

      body.innerHTML = `
        <div class="gs-top-action">
          <div class="gs-head">
            <div class="gs-title">未配置 ${unpCnt}名/${unplaced.length}組 ・ 計${totCnt}名</div>
            ${addBtnHtml}
          </div>
          ${autoBtnHtml}
        </div>
        <div class="gs-controls">
          <button type="button" class="primary" style="flex:1; padding:9px; font-size:14px;" onclick="toggleSortOrder()">
            ${isAsc ? "並び順：人数が少ない順 ▲（前日場所取は末尾）" : "並び順：人数が多い順 ▼（前日場所取は末尾）"}
          </button>
          ${state.menuCollapsed ? "" : `<button type="button" style="padding:9px 12px; font-size:14px;" onclick="clearSel(); renderGuestListModal();">選択解除</button>`}
        </div>
        <div class="g-list-2col">${listHtml}</div>
      `;
    }

    function renderOcrParsedList() {
      const area = document.getElementById("ocrParsedListArea");
      if (!area) return;
      const activeFishList = state.fishList.filter(f => state.fishData[f] && state.fishData[f].guests.length > 0);
      if (activeFishList.length === 0) {
        area.innerHTML = "";
        return;
      }
      const grandTotal = activeFishList.reduce((sum, f) => sum + state.fishData[f].guests.reduce((a, g) => a + Number(g.count), 0), 0);
      const grandGroups = activeFishList.reduce((sum, f) => sum + state.fishData[f].guests.length, 0);

      const groupsHtml = activeFishList.map(f => {
        const fd = state.fishData[f];
        const fTot = fd.guests.reduce((a, g) => a + Number(g.count), 0);
        const writtenInfo = fd.ocrWrittenTotal ? ` / 紙記載:${fd.ocrWrittenTotal}名` : "";
        return `
          <div class="ocr-fish-group-title">
            <span>${f}（${fd.guests.length}組 / 計${fTot}名${writtenInfo}）</span>
            <button type="button" class="ocr-fish-rename-btn" onclick="openRenameFishModal('${f}')">釣り物変更</button>
          </div>
          ${fd.guests.map((g, i) => `
            <div class="ocr-item-row">
              <div class="ocr-item-main">
                <div class="ocr-item-name">${i + 1}. ${g.name}（${g.count}名）</div>
                <div class="ocr-item-sub">${(Number.isInteger(g.row) ? `${g.row + 1}段目` : "")}${g.note ? ` / ${g.note}` : ""}</div>
              </div>
              <div class="ocr-item-actions">
                <button type="button" onclick="adjustVerifyCount('${g.id}', -1)">−</button>
                <button type="button" onclick="adjustVerifyCount('${g.id}', 1)">＋</button>
                <button type="button" onclick="openEdit('${g.id}')">編集</button>
                <button type="button" class="danger" onclick="removeVerifyGuest('${g.id}')">削除</button>
              </div>
            </div>
          `).join("")}
        `;
      }).join("");

      area.innerHTML = `
        <div class="ocr-result-box">
          <div class="ocr-result-head">
            <span>読み取りデータ（全${activeFishList.length}魚種・${grandGroups}組 / 計${grandTotal}名）</span>
          </div>
          <div class="ocr-result-list">${groupsHtml}</div>
        </div>
      `;
    }

    function renderFishTabsBar() {
      const bar = document.getElementById("fishTabsBar");
      const validFish = state.fishList.filter(f => state.fishData[f]);
      if (validFish.length <= 1 && (!state.ocrLoaded && (!state.fishData[validFish[0]] || state.fishData[validFish[0]].guests.length === 0))) {
        bar.style.display = "none";
        return;
      }
      bar.style.display = "flex";
      bar.innerHTML = validFish.map(f => {
        const fd = state.fishData[f];
        const tot = (fd.guests || []).reduce((a, g) => a + Number(g.count), 0);
        const boatsTxt = (fd.boats && fd.boats.length > 0)
          ? fd.boats.map(b => b.name.replace("船", "")).join("・")
          : (fd.step === "verify" ? "確認中" : "船未定");
        const isAct = state.activeFish === f;
        return `
          <button type="button" class="fish-tab ${isAct ? 'active' : ''}" onclick="switchFish('${f}')">
            <span>${f} (${tot}名)</span>
            <span class="fish-tab-sub">${boatsTxt}</span>
          </button>
        `;
      }).join("");
    }

    function render() {
      applyBoatBodyTheme();
      renderFishTabsBar();

      const cur = getCur();
      const topBars = document.getElementById("topBars");
      const main = document.getElementById("main");
      const staffHeaderBtns = document.getElementById("staffHeaderBtns");
      const menuToggleBtn = document.getElementById("menuToggleBtn");

      menuToggleBtn.textContent = state.menuCollapsed ? "メニュー ▼" : "メニュー ▲";
      menuToggleBtn.className = state.menuCollapsed ? "menu-toggle-btn collapsed" : "menu-toggle-btn";
      staffHeaderBtns.style.display = state.menuCollapsed ? "none" : "grid";

      if (cur.step === "verify") {
        topBars.style.display = "none";

        if (!state.ocrLoaded && cur.guests.length === 0) {
          main.innerHTML = `
            <div class="step-card">
              <div class="step-badge">ステップ 1 / 2：予約表の読込</div>
              <div class="empty-ocr-box">
                <div class="empty-ocr-msg">予約表を読み込んでください</div>
                <div class="empty-ocr-sub">手書きの予約表を撮影・選択すると、書かれている釣り物（カワハギ・アジ・アマダイ等）と人数・名前をAIが自動で振り分けます。</div>
                <button type="button" class="primary" style="width:100%; padding:15px; font-size:17px;" onclick="openModal('ocrModal')">
                  予約表の写真を選択して読み込む
                </button>
              </div>
              <button type="button" style="width:100%; padding:13px; font-size:15px;" onclick="openAddModalForFish('${cur.fish}')">
                ＋ 写真を使わず手入力で1組ずつ追加する
              </button>
            </div>
          `;
          return;
        }

        const totCnt = cur.guests.reduce((a, g) => a + Number(g.count), 0);
        const writtenInfo = cur.ocrWrittenTotal ? `（予約表の記載合計：${cur.ocrWrittenTotal}名）` : "";
        main.innerHTML = `
          <div class="step-card">
            <div class="step-badge">ステップ 1 / 2：予約データの確認【${cur.fish}】</div>
            <div class="w-title-row">
              <div class="w-title">「${cur.fish}」の予約確認・修正</div>
              <button type="button" style="padding:6px 10px; font-size:13px;" onclick="openRenameFishModal('${cur.fish}')">釣り物名を変更</button>
            </div>
            <div class="w-sub">内容を確認し、合計人数が合っていれば確定して「${cur.fish}」に出船する船を選んでください。</div>

            <div class="verify-summary">
              <div>
                <div style="font-size:14px; color:#93c5fd; font-weight:700;">「${cur.fish}」予約合計 ${writtenInfo}</div>
                <div style="font-size:24px; font-weight:800; color:#fff;">${totCnt} 名 <span style="font-size:16px; color:var(--sub);">（${cur.guests.length} 組）</span></div>
              </div>
              <button type="button" onclick="openAddModalForFish('${cur.fish}')">＋ 1組追加</button>
            </div>

            ${cur.guests.map(g => `
              <div class="verify-row">
                <div class="verify-info" onclick="openEdit('${g.id}')">
                  <div class="verify-name">${g.name} <span style="font-size:13px; color:#38bdf8; font-weight:600;">[編集]</span></div>
                  ${g.note ? `<div class="verify-note">${g.note}</div>` : `<div style="font-size:13px; color:var(--sub);">メモなし</div>`}
                </div>
                <div class="verify-ctrl">
                  <button type="button" onclick="adjustVerifyCount('${g.id}', -1)">−</button>
                  <b style="min-width:36px; text-align:center; font-size:18px;">${g.count}名</b>
                  <button type="button" onclick="adjustVerifyCount('${g.id}', 1)">＋</button>
                  <button type="button" class="danger" style="padding:6px 9px; font-size:13px; margin-left:4px;" onclick="removeVerifyGuest('${g.id}')">除外</button>
                </div>
              </div>
            `).join("")}

            <button type="button" class="success" style="width:100%; padding:15px; font-size:18px; margin-top:12px;" onclick="confirmVerifiedGuests()">
              「${cur.fish}」（計${totCnt}名）を確定して船を選ぶ ▶
            </button>
          </div>
        `;
        return;
      }

      if (cur.step === "boats") {
        topBars.style.display = "none";
        const totalCap = draftBoats.reduce((a, b) => a + (Number(b.leftCap) || 0) + (Number(b.rightCap) || 0), 0);
        const totalGuests = cur.guests.reduce((a, g) => a + Number(g.count), 0);
        const diff = totalCap - totalGuests;

        let matchClass = "match-box";
        let matchText = `「${cur.fish}」予約合計：${totalGuests}名 ／ 選択した船の席数合計：${totalCap}席`;
        if (draftBoats.length === 0) {
          matchText = `「${cur.fish}」予約合計：${totalGuests}名 ／ 出船する船を選択してください`;
        } else if (totalGuests > 0) {
          if (diff === 0) {
            matchClass += " ok";
            matchText = `ぴったり一致：${cur.fish} ${totalGuests}名 ＝ 船の席数 ${totalCap}席`;
          } else if (diff > 0) {
            matchClass += " ok";
            matchText = `${cur.fish} ${totalGuests}名 ／ 船の席数 ${totalCap}席（空き余裕 ${diff}席）`;
          } else {
            matchClass += " warn";
            matchText = `席数が ${Math.abs(diff)}席 足りません（${cur.fish} ${totalGuests}名 ＞ 船の席数 ${totalCap}席）`;
          }
        }

        const otherFishBoatMap = new Map();
        state.fishList.forEach(f => {
          if (f === state.activeFish) return;
          const fd = state.fishData[f];
          if (fd && fd.boats) {
            fd.boats.forEach(b => otherFishBoatMap.set(b.name, f));
          }
        });

        const canStart = draftBoats.length > 0 && draftBoats.every(b => (Number(b.leftCap) || 0) > 0 && (Number(b.rightCap) || 0) > 0);

        main.innerHTML = `
          <div class="step-card">
            <div class="step-badge">ステップ 2 / 2：配船と人数指定【${cur.fish}】</div>
            <div class="w-title">「${cur.fish}」に出船する船を指定</div>
            <div class="w-sub">出船する船をタップして選び、各船の左舷・右舷の人数を入力してください。</div>

            <div class="${matchClass}">${matchText}</div>

            <div class="boat-grid">
              ${BOAT_LIST.map(n => {
                const on = draftBoats.some(b => b.name === n);
                const usedBy = otherFishBoatMap.get(n);
                return `
                  <button type="button" class="b-pick ${on ? 'on' : (usedBy ? 'in-other-fish' : '')}" onclick="toggleDraftBoat('${n}')">
                    <span>${n}</span>
                    ${usedBy ? `<span class="b-pick-used">${usedBy}で使用中</span>` : ""}
                  </button>
                `;
              }).join("")}
            </div>

            ${draftBoats.length === 0 ? `
              <div style="text-align:center; padding:18px 10px; color:var(--sub); background:var(--inp); border-radius:10px; border:1px dashed var(--bd);">
                上の船名ボタンをタップすると、左右の人数入力欄が表示されます
              </div>
            ` : draftBoats.map((b, i) => {
              const lc = Number(b.leftCap) || 0;
              const rc = Number(b.rightCap) || 0;
              return `
                <div class="w-boat-row">
                  <div class="w-boat-top"><span>${b.name}（${cur.fish}）</span><span style="font-size:16px;color:#38bdf8;">計 ${lc + rc}名枠</span></div>
                  <div class="w-caps">
                    <div class="w-cap-box">
                      <div style="font-size:14px;color:var(--sub);">左舷</div>
                      <div class="w-cap-ctrl">
                        <button type="button" onclick="changeDraftCap(${i},'left',-1)">−</button>
                        <input type="number" class="cap-num-inp" min="0" max="15" value="${lc === 0 ? '' : lc}" placeholder="0" onchange="setDraftCapInput(${i},'left',this.value)" />
                        <button type="button" onclick="changeDraftCap(${i},'left',1)">＋</button>
                      </div>
                    </div>
                    <div class="w-cap-box">
                      <div style="font-size:14px;color:var(--sub);">右舷</div>
                      <div class="w-cap-ctrl">
                        <button type="button" onclick="changeDraftCap(${i},'right',-1)">−</button>
                        <input type="number" class="cap-num-inp" min="0" max="15" value="${rc === 0 ? '' : rc}" placeholder="0" onchange="setDraftCapInput(${i},'right',this.value)" />
                        <button type="button" onclick="changeDraftCap(${i},'right',1)">＋</button>
                      </div>
                    </div>
                  </div>
                </div>
              `;
            }).join("")}

            <div style="display:flex; gap:8px; margin-top:14px;">
              <button type="button" style="padding:14px 12px;" onclick="goStep('verify')">◀ 予約確認</button>
              <button type="button" class="primary" style="flex:1; padding:15px; font-size:18px;" ${canStart ? "" : "disabled"} onclick="startWithDraft()">
                「${cur.fish}」の座席表を開始する
              </button>
            </div>
          </div>
        `;
        return;
      }

      topBars.style.display = "block";

      const staffModeBar = document.getElementById("staffModeBar");
      staffModeBar.style.display = state.menuCollapsed ? "none" : "flex";

      const bagBtn = document.getElementById("bagModeBtn");
      bagBtn.className = state.markMode === "BAG" ? "bag-btn on" : "bag-btn";
      bagBtn.textContent = state.markMode === "BAG" ? "■ 荷物：ON（席タップ）" : "■ 荷物：OFF";

      const shopBtn = document.getElementById("shopModeBtn");
      shopBtn.className = state.markMode === "SHOP" ? "shop-btn on" : "shop-btn";
      shopBtn.textContent = state.markMode === "SHOP" ? "● 店取り：ON（席タップ）" : "● 店取り：OFF";

      const undoBtn = document.getElementById("undoBtn");
      undoBtn.disabled = undoStack.length === 0;
      undoBtn.textContent = undoStack.length > 0 ? `↩ 1つ前に戻す(${undoStack.length})` : "↩ 1つ前に戻す";

      let tabsHtml = `<button type="button" class="tab ${cur.view === 'overview' ? 'active' : ''}" onclick="setView('overview')"><span class="tab-ship-label">全体</span><span class="tab-emp-label">${cur.boats.length}隻</span></button>`;
      cur.boats.forEach(b => {
        const emp = b.leftSeats.filter(x => !x).length + b.rightSeats.filter(x => !x).length;
        const code = getBoatCode(b.name);
        const tCls = code ? `t-${code}` : "";
        tabsHtml += `<button type="button" class="tab ${tCls} ${cur.view === b.name ? 'active' : ''}" onclick="setView('${b.name}')"><span class="tab-ship-label">${b.name}</span><span class="tab-emp-label">空${emp}</span></button>`;
      });
      document.getElementById("boatTabs").innerHTML = tabsHtml;

      const placed = getFullyPlacedIds();
      const unplaced = cur.guests.filter(g => !placed.has(String(g.id)));
      const unpCnt = unplaced.reduce((a, g) => a + Math.max(0, Number(g.count) - countAssignedSeatsForGuest(g.id)), 0);
      const totCnt = cur.guests.reduce((a, g) => a + Number(g.count), 0);
      document.getElementById("quickGuestBtnText").textContent = `${cur.fish} 予約一覧（未配置 ${unpCnt}名 / 計${totCnt}名）`;

      const selG = !state.menuCollapsed ? cur.guests.find(g => String(g.id) === String(state.selId)) : null;
      let selBannerHtml = "";
      if (selG) {
        const assignedNow = countAssignedSeatsForGuest(selG.id);
        const shopNow = countShopSeatsForGuest(selG.id);
        const remNow = Math.max(0, Number(selG.count) - assignedNow);
        const showCustomBtn = !state.markMode && Number(selG.count) >= 2;
        const subGuide = state.markMode
          ? (state.markMode === "SHOP"
            ? `● 店取り（${selG.name}様：現在 ${shopNow}/${selG.count}席まで）を付ける席をタップ`
            : `■ 荷物（${selG.name}様 ${selG.count}名）を付ける席をタップ`)
          : (state.customSplitMode
            ? "1席ずつ好きな場所をタップ（左右・別船に分けて配置できます）"
            : "配置したい座席をタップ（横並び一括で入ります）");
        selBannerHtml = `
          <div class="selected-banner">
            <div class="selected-banner-top">
              <div>
                <div class="selected-banner-info">
                  ${selG.name}様 (${selG.count}名)
                  ${state.customSplitMode ? `<span style="font-size:14px; color:#fed7aa;">［残り ${remNow}名］</span>` : ""}
                </div>
                <div class="selected-banner-sub">${subGuide}</div>
              </div>
              <button type="button" onclick="clearSel()" style="padding:8px 13px; font-size:14px; background:rgba(0,0,0,0.45); border-color:#93c5fd; flex-shrink:0;">閉じる</button>
            </div>
            ${showCustomBtn ? `
              <button type="button" class="custom-split-btn ${state.customSplitMode ? 'on' : ''}" onclick="toggleCustomSplitMode()">
                ${state.customSplitMode
                  ? "バラバラ配置（カスタム）：ON中（押すと連番一括に戻る）"
                  : "左右や別席に分ける（バラバラ配置：OFF）"}
              </button>
            ` : ""}
          </div>
        `;
      }

      const hl = {};
      if (selG && !state.markMode) {
        if (state.customSplitMode) {
          cur.boats.forEach((b, bi) => ["leftSeats", "rightSeats"].forEach(sk => {
            b[sk].forEach((c, i) => {
              if (c === null) hl[`${bi}-${sk}-${i}`] = "fit-ok";
            });
          }));
        } else {
          const cnt = Number(selG.count) || 1;
          cur.boats.forEach((b, bi) => ["leftSeats", "rightSeats"].forEach(sk => {
            for (let i = 0; i <= b[sk].length - cnt; i++) {
              const ev = evalPlace(bi, sk, i, selG);
              if (ev.valid) {
                for (let k = i; k < i + cnt; k++) {
                  const key = `${bi}-${sk}-${k}`;
                  if (!hl[key] || ev.fits) hl[key] = ev.fits ? "fit-ok" : "fit-warn";
                }
              }
            }
          }));
        }
      }

      let seatsSectionHtml = "";
      if (cur.view === "overview") {
        seatsSectionHtml = cur.boats.map((b, bi) => {
          const le = b.leftSeats.filter(x => !x).length, re = b.rightSeats.filter(x => !x).length;
          const code = getBoatCode(b.name);
          const cardCls = code ? `card-${code}` : "";
          return `
            <div class="ov-card ${cardCls}">
              <div class="ov-head">
                <b style="font-size:19px;">${b.name}【${cur.fish}】</b>
                <div style="display:flex; align-items:center; gap:8px;">
                  <span style="font-size:14px;color:var(--sub);">左空:<b style="color:#38bdf8;">${le}</b>/${b.leftCap} 右空:<b style="color:#38bdf8;">${re}</b>/${b.rightCap}</span>
                  <button type="button" style="padding:5px 9px; font-size:13px;" onclick="setView('${b.name}')">詳細▶</button>
                </div>
              </div>
              <div class="mini-hull">
                <div><div style="font-size:13px;color:var(--sub);text-align:center;margin-bottom:4px;font-weight:700;">▲ 左舷</div>
                  ${b.leftSeats.map((c, i) => miniBtnHtml(bi, "leftSeats", c, i, hl[`${bi}-leftSeats-${i}`])).join("")}
                </div>
                <div><div style="font-size:13px;color:var(--sub);text-align:center;margin-bottom:4px;font-weight:700;">▲ 右舷</div>
                  ${b.rightSeats.map((c, i) => miniBtnHtml(bi, "rightSeats", c, i, hl[`${bi}-rightSeats-${i}`])).join("")}
                </div>
              </div>
            </div>
          `;
        }).join("");
      } else {
        const bi = cur.boats.findIndex(b => b.name === cur.view);
        if (bi === -1) { cur.view = "overview"; render(); return; }
        const b = cur.boats[bi];
        const code = getBoatCode(b.name);
        const frameCls = code ? `frame-${code}` : "";
        const capEditBar = state.menuCollapsed ? "" : `
          <div style="background:rgba(15, 23, 42, 0.9);padding:10px;border-radius:9px;border:1px solid rgba(255,255,255,0.2);">
            <div style="display:flex;gap:8px;align-items:center;">
              <div style="flex:1;text-align:center;"><div style="font-size:13px;color:var(--sub);">左舷</div>
                <div style="display:flex;justify-content:center;align-items:center;gap:10px;margin-top:4px;font-size:19px;">
                  <button type="button" style="padding:5px 12px;font-size:18px;" onclick="changeCap(${bi},'left',-1)">−</button><b>${b.leftCap}</b><button type="button" style="padding:5px 12px;font-size:18px;" onclick="changeCap(${bi},'left',1)">＋</button>
                </div>
              </div>
              <button type="button" style="padding:9px;font-size:14px;" onclick="swapCaps(${bi})">⇄<br>入替</button>
              <div style="flex:1;text-align:center;"><div style="font-size:13px;color:var(--sub);">右舷</div>
                <div style="display:flex;justify-content:center;align-items:center;gap:10px;margin-top:4px;font-size:19px;">
                  <button type="button" style="padding:5px 12px;font-size:18px;" onclick="changeCap(${bi},'right',-1)">−</button><b>${b.rightCap}</b><button type="button" style="padding:5px 12px;font-size:18px;" onclick="changeCap(${bi},'right',1)">＋</button>
                </div>
              </div>
            </div>
            <button type="button" class="seat-edit-toggle ${state.seatEditMode ? 'on' : ''}" onclick="toggleSeatEditMode()">
              ${state.seatEditMode ? "場所指定の席増減：ON（終了する）" : "途中に席を増やす・消す（場所指定）"}
            </button>
          </div>
        `;
        seatsSectionHtml = `
          <div class="single-boat-frame ${frameCls}">
            ${capEditBar}
            <div class="bow-bar">▲ ${b.name}【${cur.fish}】ミヨシ（船首） ▲</div>
            <div class="hull">
              <div><div style="text-align:center;font-size:14px;font-weight:700;color:#cbd5e1;margin-bottom:6px;">左 舷</div>
                ${renderSideSeatsColumn(bi, "leftSeats", b.leftSeats, b.leftCap, hl)}
              </div>
              <div><div style="text-align:center;font-size:14px;font-weight:700;color:#cbd5e1;margin-bottom:6px;">右 舷</div>
                ${renderSideSeatsColumn(bi, "rightSeats", b.rightSeats, b.rightCap, hl)}
              </div>
            </div>
            <div class="bow-bar">▼ ${b.name}【${cur.fish}】オオドモ（船尾） ▼</div>
          </div>
        `;
      }

      let parsedSheetSectionHtml = "";
      if (!state.menuCollapsed) {
        parsedSheetSectionHtml = buildParsedSheetAccordionHtml();
      }

      main.innerHTML = selBannerHtml + seatsSectionHtml + parsedSheetSectionHtml;
    }

    function buildParsedSheetAccordionHtml() {
      const cur = getCur();
      const totCnt = cur.guests.reduce((a, g) => a + Number(g.count), 0);
      const placed = getFullyPlacedIds();
      const placedCnt = cur.guests.reduce((a, g) => a + Math.min(Number(g.count), countAssignedSeatsForGuest(g.id)), 0);
      const writtenInfo = cur.ocrWrittenTotal ? ` / 紙記載:${cur.ocrWrittenTotal}名` : "";
      const arrow = state.parsedSheetOpen ? "▲ 閉じる" : "▼ 開く";

      let bodyHtml = "";
      if (state.parsedSheetOpen) {
        if (cur.guests.length === 0) {
          bodyHtml = `
            <div class="accordion-body">
              <div style="text-align:center; padding:16px 10px; color:var(--sub); font-size:14px;">
                読み取った予約データがありません。「読込」から予約表を読み込んでください。
              </div>
            </div>
          `;
        } else {
          const rowMap = new Map();
          cur.guests.forEach((g, idx) => {
            const r = Number.isInteger(g.row) && g.row >= 0 ? g.row : 0;
            const c = Number.isInteger(g.col) && g.col >= 0 ? g.col : idx;
            if (!rowMap.has(r)) rowMap.set(r, []);
            rowMap.get(r).push({ ...g, _sortCol: c, _origIdx: idx });
          });

          const sortedRows = [...rowMap.keys()].sort((a, b) => a - b);
          const flexRowsHtml = sortedRows.map((rIdx, displayRowIdx) => {
            const rowGuests = rowMap.get(rIdx).sort((a, b) => (a._sortCol - b._sortCol) || (a._origIdx - b._origIdx));
            const cellsHtml = rowGuests.map(g => {
              const assignedNow = countAssignedSeatsForGuest(g.id);
              const isDone = placed.has(String(g.id));
              const boatLabel = assignedNow > 0 ? getGuestAssignedBoats(g.id) : "";
              return `
                <div class="layout-cell ${isDone ? 'done-slot' : ''}" onclick="openEdit('${g.id}')">
                  <div>
                    <span class="cell-guest-name ${isDone ? 'strike-name' : ''}">${g.name}</span>
                    <span class="cell-guest-cnt">${g.count}名</span>
                  </div>
                  ${g.note ? `<div class="cell-guest-note">${g.note}</div>` : ""}
                  ${boatLabel ? `<span class="boat-tag">${boatLabel}${!isDone ? `(${assignedNow}/${g.count})` : ""}</span>` : ""}
                </div>
              `;
            }).join("");
            return `
              <div class="layout-flex-row">
                <span class="row-badge-label">${displayRowIdx + 1}段(${rowGuests.length})</span>
                ${cellsHtml}
              </div>
            `;
          }).join("");

          bodyHtml = `
            <div class="accordion-body">
              <div class="sheet-summary">
                <div>
                  <div style="font-size:12px; color:var(--sub);">【${cur.fish}】段ごと横並び表示（全${cur.guests.length}組${writtenInfo}）</div>
                  <div style="font-size:16px; font-weight:800; color:#fff;">合計 ${totCnt}名 <span style="font-size:13px; color:#6ee7b7;">（確定済 ${placedCnt}名 / 残 ${totCnt - placedCnt}名）</span></div>
                </div>
                <button type="button" class="warning" style="padding:6px 10px; font-size:12px;" onclick="openOrigImage()">元画像</button>
              </div>
              <div class="layout-scroll-wrap">
                ${flexRowsHtml}
              </div>
            </div>
          `;
        }
      }

      return `
        <div class="parsed-sheet-accordion" id="parsedSheetSection">
          <button type="button" class="accordion-trigger-btn" onclick="toggleParsedSheetAccordion()">
            <span>解析した予約表【${cur.fish}】（${cur.guests.length}組 / 計${totCnt}名）</span>
            <span style="font-size:13px; color:#38bdf8;">${arrow}</span>
          </button>
          ${bodyHtml}
        </div>
      `;
    }

    function renderSideSeatsColumn(bi, sk, seatsArr, tot, hl) {
      const editMode = !state.menuCollapsed && state.seatEditMode;
      let html = "";
      seatsArr.forEach((c, i) => {
        if (editMode) {
          html += `<button type="button" class="insert-slot-btn" onclick="insertSeatAt(${bi},'${sk}',${i})">＋ ${i + 1}番の前に1席挿入</button>`;
        }
        html += `<div class="seat-row-box">`;
        html += seatBtnHtml(bi, sk, c, i, tot, hl[`${bi}-${sk}-${i}`]);
        if (editMode) {
          html += `<button type="button" class="del-slot-btn" onclick="deleteSeatAt(${bi},'${sk}',${i})">− ${i + 1}番を削除して詰める</button>`;
        }
        html += `</div>`;
      });
      if (editMode) {
        html += `<button type="button" class="insert-slot-btn" onclick="insertSeatAt(${bi},'${sk}',${seatsArr.length})">＋ オオドモ（最後尾）に1席追加</button>`;
      }
      return html;
    }

    function miniBtnHtml(bi, sk, c, i, h) {
      let cls = "mini-seat", txt = "空";
      if (c) {
        if (c.type === "BAG") {
          cls += " bag";
          txt = c.holderName ? `■ ${c.holderName}(${c.holderCount || ""})` : "■ 荷物";
        } else if (c.type === "SHOP" || c.type === "HOLD") {
          cls += " shop";
          txt = c.holderName ? `● ${c.holderName}(${c.holderCount || ""})` : "● 店取り";
        } else {
          cls += " assigned";
          txt = `${c.name}(${c.count})`;
        }
      } else if (h) {
        cls += " " + h;
        txt = h === "fit-ok" ? "案内OK" : "並び不可";
      }
      return `<button type="button" class="${cls}" onpointerdown="startSeatPress(${bi},'${sk}',${i})" onpointerup="cancelSeatPress()" onpointerleave="cancelSeatPress()" onpointercancel="cancelSeatPress()" onclick="onSeatClickWrapper(${bi},'${sk}',${i})"><span>${i + 1}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:78%;">${txt}</span></button>`;
    }

    function seatBtnHtml(bi, sk, c, i, tot, h) {
      let cls = "seat", body = `<div class="s-name" style="color:#475569;font-size:15px;">空席</div>`;
      const pos = i === 0 ? "1 (ミヨシ)" : (i === tot - 1 ? `${i + 1} (オオドモ)` : `${i + 1}`);
      if (c) {
        if (c.type === "BAG") {
          cls += " bag";
          const who = c.holderName ? `<div class="s-holder" style="color:#e0f2fe;">${c.holderName}様${c.holderCount ? ` (${c.holderCount}名)` : ""}</div>` : "";
          body = `<div class="s-name" style="color:var(--bag-tx);font-size:16px;">■ 荷物</div>${who}`;
        } else if (c.type === "SHOP" || c.type === "HOLD") {
          cls += " shop";
          const who = c.holderName ? `<div class="s-holder" style="color:#fef3c7;">${c.holderName}様${c.holderCount ? ` (${c.holderCount}名)` : ""} <span style="font-size:11px;opacity:0.85;">(長押し確定)</span></div>` : "";
          body = `<div class="s-name" style="color:var(--shop-tx);font-size:16px;">● 店取り</div>${who}`;
        } else {
          cls += " assigned";
          const bdg = c.note ? c.note.split("/").map(n => `<span class="badge">${n.trim()}</span>`).join("") : "";
          body = `<div class="s-name">${c.name}(${c.count})</div>${bdg ? `<div>${bdg}</div>` : ""}`;
        }
      } else if (h) {
        cls += " " + h;
        body = h === "fit-ok"
          ? `<div class="s-name" style="color:#6ee7b7;font-size:15px;">案内OK</div>`
          : `<div class="s-warn-msg">この配置だと後続グループが並んで座れません</div>`;
      }
      return `<button type="button" class="${cls}" onpointerdown="startSeatPress(${bi},'${sk}',${i})" onpointerup="cancelSeatPress()" onpointerleave="cancelSeatPress()" onpointercancel="cancelSeatPress()" onclick="onSeatClickWrapper(${bi},'${sk}',${i})"><div class="s-pos">${pos}</div>${body}</button>`;
    }

    function openOrigImage() {
      const src = lastOcrImageDataUrl || state.ocrImage;
      if (!src) {
        toast("元の予約表画像がまだ読み込まれていません");
        return;
      }
      document.getElementById("origImgContainer").innerHTML = `
        <img src="${src}" alt="元の予約表画像" style="width:100%; height:auto; border-radius:8px; border:1px solid var(--bd);" />
      `;
      openModal("origImgModal");
    }

    function openAddModalForFish(fishName) {
      document.getElementById("addFish").value = fishName || state.activeFish || "カワハギ";
      openModal("addModal");
    }

    function addGuest() {
      const fish = (document.getElementById("addFish").value.trim()) || state.activeFish || "不明";
      const name = document.getElementById("addName").value.trim();
      const count = Math.min(15, Math.max(1, parseInt(document.getElementById("addCount").value, 10) || 1));
      const note = document.getElementById("addNote").value.trim();
      if (!name) { toast("名前を入力してください"); return; }

      pushUndo(`${fish}に${name}様を追加`);
      if (!state.fishData[fish]) {
        state.fishData[fish] = createEmptyFishSlot(fish);
        if (!state.fishList.includes(fish)) state.fishList.push(fish);
      }
      const targetSlot = state.fishData[fish];
      const nextRow = targetSlot.guests.length > 0 ? Math.max(...targetSlot.guests.map(x => Number(x.row) || 0)) + 1 : 0;
      targetSlot.guests.push({ id: makeUniqueId("add"), name, count, note, row: nextRow, col: 0 });
      state.activeFish = fish;
      state.ocrLoaded = true;
      document.getElementById("addName").value = ""; document.getElementById("addNote").value = "";
      save(); render();
      if (document.getElementById("guestListModal").classList.contains("open")) {
        renderGuestListModal();
      }
      if (document.getElementById("ocrModal").classList.contains("open")) {
        renderOcrParsedList();
      }
      closeModal("addModal"); toast(`【${fish}】に ${name}様を追加しました`);
    }

    function openEdit(id) {
      const found = findGuestAcrossAllFish(id);
      if (!found) return;
      const dl = document.getElementById("editFishDatalist");
      const candidates = [...new Set([...state.fishList, ...PRESET_FISH])];
      dl.innerHTML = candidates.map(f => `<option value="${f}">`).join("");

      document.getElementById("editId").value = found.guest.id;
      document.getElementById("editFish").value = found.fish;
      document.getElementById("editName").value = found.guest.name;
      document.getElementById("editCount").value = found.guest.count;
      document.getElementById("editNote").value = found.guest.note || "";
      openModal("editModal");
    }

    function stepEdit(d) {
      const inp = document.getElementById("editCount");
      inp.value = Math.min(15, Math.max(1, (parseInt(inp.value, 10) || 1) + d));
    }

    function saveEdit() {
      const id = document.getElementById("editId").value;
      const nextFish = (document.getElementById("editFish").value.trim()) || "不明";
      const name = document.getElementById("editName").value.trim();
      const count = Math.min(15, Math.max(1, parseInt(document.getElementById("editCount").value, 10) || 1));
      const note = document.getElementById("editNote").value.trim();
      if (!name) return;
      const found = findGuestAcrossAllFish(id);
      if (!found) return;

      pushUndo(`${name}様の予約修正`);
      removeGuestFromSlot(found.slot, id);

      if (found.fish === nextFish) {
        found.guest.name = name;
        found.guest.count = count;
        found.guest.note = note;
      } else {
        // 別の釣り物へグループ単位で移動
        found.slot.guests = found.slot.guests.filter(x => String(x.id) !== String(id));
        if (!state.fishData[nextFish]) {
          state.fishData[nextFish] = createEmptyFishSlot(nextFish);
          if (!state.fishList.includes(nextFish)) state.fishList.push(nextFish);
        }
        const dstSlot = state.fishData[nextFish];
        const nextRow = dstSlot.guests.length > 0 ? Math.max(...dstSlot.guests.map(x => Number(x.row) || 0)) + 1 : 0;
        dstSlot.guests.push({
          ...found.guest,
          name,
          count,
          note,
          row: nextRow,
          col: 0
        });
        toast(`${name} 様を「${nextFish}」へ移動しました`);
      }

      save(); render();
      if (document.getElementById("guestListModal").classList.contains("open")) {
        renderGuestListModal();
      }
      if (document.getElementById("ocrModal").classList.contains("open")) {
        renderOcrParsedList();
      }
      closeModal("editModal");
      if (found.fish === nextFish) toast("変更を保存しました");
    }

    function delGuest() {
      const id = document.getElementById("editId").value;
      if (!confirm("この予約を削除しますか？")) return;
      removeVerifyGuest(id);
      if (document.getElementById("guestListModal").classList.contains("open")) {
        renderGuestListModal();
      }
      closeModal("editModal");
    }

    function resetSeatsOnly() {
      const cur = getCur();
      if (!confirm(`「${cur.fish}」の全座席を空に戻しますか？`)) return;
      pushUndo(`${cur.fish} 全座席リセット`);
      cur.boats.forEach(b => { b.leftSeats = Array(Number(b.leftCap)).fill(null); b.rightSeats = Array(Number(b.rightCap)).fill(null); });
      save(); render(); closeModal("setupModal"); toast(`「${cur.fish}」の座席をリセットしました`);
    }

    function createCompressedDataUrl(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const maxW = 1100;
            const scale = img.width > maxW ? (maxW / img.width) : 1;
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.78));
          };
          img.onerror = () => resolve(ev.target.result);
          img.src = ev.target.result;
        };
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(file);
      });
    }

    async function runOcr() {
      const key = localStorage.getItem("gemini_api_key");
      if (!key) { toast("先に設定からAPIキーを入力してください"); return; }
      const f = document.getElementById("ocrFile").files[0];
      if (!f) { toast("画像を選択してください"); return; }
      const model = document.getElementById("modelSelect").value || "gemini-4-hydrogen";
      const btn = document.getElementById("ocrBtn"), msg = document.getElementById("ocrMsg");
      btn.disabled = true; btn.textContent = `${model} で解析中...`;
      msg.innerHTML = "";
      try {
        const [b64, previewUrl] = await Promise.all([
          new Promise((res, rej) => {
            const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.onerror = rej; r.readAsDataURL(f);
          }),
          createCompressedDataUrl(f)
        ]);

        const prompt = `釣船「山下丸」の手書き予約表画像を解析し、書かれているすべての釣り物（魚種：例 カワハギ、アジ、アマダイ、スミイカ、カサゴ、マゴチ等）ごとに分類してJSONのみで出力してください。
重要ルール:
1. 画像に書かれている魚種見出し（カワハギ、アジ、アマダイ、スミイカ、カサゴなど。「カワ」「アヂ」「アマ」「スミ」などの略称・崩し字も可能な限り正式名へ補完し、判別できない場合のみ「不明」とすること）を自動判別し、魚種ごとに targets 配列の要素として分けること。魚種名が1つしか書かれていない場合も targets の1要素として出力すること。
2. 各魚種の枠内では、紙の上から下へ「段（行）」ごとに配列 rows で出力すること。1段目に4組あれば rows[0] に4要素、2段目に5組あれば rows[1] に5要素のように、元の段と左から右の並び順を忠実に再現すること。
3. 名前の横に人数が書かれていない場合（例: 秋場、小柳、菅澤、長谷川、村田、内藤、杉浦、橋本 など）は必ず count: 1 とすること。
4. 仕立船の枠や取消線、下部の合計数字メモ（「63 -> 21 22 20」など）は客リストに含めないこと。
5. 名前の前の点(・)は hasDot: true、竿+数字は rod（数値）、カラは kara: true とすること。
6. その魚種の枠に合計人数が書かれていれば writtenTotal に入れること。
出力形式:{"targets":[{"fish":"カワハギ","writtenTotal":42,"rows":[[{"name":"井部","count":6,"hasDot":false,"rod":2,"kara":false}]]},{"fish":"アジ","writtenTotal":15,"rows":[[{"name":"佐藤","count":3,"hasDot":false,"rod":0,"kara":false}]]}]}`;

        const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: f.type || "image/jpeg", data: b64 } }] }],
            generationConfig: { response_mime_type: "application/json" }
          })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error?.message || `APIエラー (${resp.status})`);
        const parsed = JSON.parse(data.candidates[0].content.parts[0].text);

        const newFishData = {};
        const newFishList = [];

        const targets = Array.isArray(parsed.targets) && parsed.targets.length > 0
          ? parsed.targets
          : [{ fish: "不明", writtenTotal: parsed.writtenTotal || null, rows: parsed.rows || [] }];

        targets.forEach(t => {
          const fishName = String(t.fish || "不明").trim() || "不明";
          const flatGuests = [];
          if (Array.isArray(t.rows)) {
            t.rows.forEach((rowArr, rIdx) => {
              if (!Array.isArray(rowArr)) return;
              rowArr.forEach((g, cIdx) => {
                if (!g || !g.name) return;
                const n = [];
                if (g.hasDot) n.push("前日場所取");
                if (Number(g.rod) > 0) n.push(`竿${g.rod}`);
                if (g.kara) n.push("カラ");
                flatGuests.push({
                  id: makeUniqueId("ocr"),
                  name: String(g.name || "").trim(),
                  count: Math.min(15, Math.max(1, parseInt(g.count, 10) || 1)),
                  note: n.join(" / "),
                  row: rIdx,
                  col: cIdx
                });
              });
            });
          }
          if (flatGuests.length === 0) return;

          if (!newFishData[fishName]) {
            const slot = createEmptyFishSlot(fishName);
            slot.ocrWrittenTotal = t.writtenTotal || null;
            slot.guests = flatGuests;
            newFishData[fishName] = slot;
            newFishList.push(fishName);
          } else {
            const existing = newFishData[fishName];
            const rowOffset = existing.guests.length > 0 ? Math.max(...existing.guests.map(x => x.row)) + 1 : 0;
            flatGuests.forEach(fg => existing.guests.push({ ...fg, row: fg.row + rowOffset }));
          }
        });

        if (newFishList.length === 0) {
          throw new Error("予約データが見つかりませんでした。画像を確認してください。");
        }

        state.fishData = newFishData;
        state.fishList = newFishList;
        state.activeFish = newFishList[0];
        state.ocrLoaded = true;
        lastOcrImageDataUrl = previewUrl;
        state.ocrImage = previewUrl;
        state.selId = null;
        draftBoats = [];
        undoStack = [];

        save(); render();
        renderOcrParsedList();

        const totalGroups = newFishList.reduce((s, f) => s + newFishData[f].guests.length, 0);
        const totalPeople = newFishList.reduce((s, f) => s + newFishData[f].guests.reduce((a, g) => a + Number(g.count), 0), 0);
        msg.innerHTML = `<span style="color:#6ee7b7; font-weight:800;">読み取り完了（${newFishList.join("・")} ／ 計${totalGroups}組・${totalPeople}名）</span>`;
        toast(`読み取り完了！${newFishList.length}魚種を自動分類しました`);
      } catch (e) {
        msg.innerHTML = `<span style="color:#ef4444;">エラー: ${e.message}</span>`;
      } finally {
        btn.disabled = false; btn.textContent = "AIで自動判別して解析する";
      }
    }

    function openModal(id) {
      if (id === "setupModal") {
        let b32 = null;
        let b32Fish = "";
        for (const f of state.fishList) {
          const found = (state.fishData[f]?.boats || []).find(b => b.name === "32号船");
          if (found) { b32 = found; b32Fish = f; break; }
        }
        document.getElementById("expArea").value = b32 ? JSON.stringify({
          date: getTodayStr(), boat: "32号船", fish: b32Fish,
          left: b32.leftSeats.map((c, i) => ({ seatNo: i + 1, name: c && c.type === "ASSIGNED" ? c.name : "", note: c && c.type === "ASSIGNED" ? c.note : "" })),
          right: b32.rightSeats.map((c, i) => ({ seatNo: i + 1, name: c && c.type === "ASSIGNED" ? c.name : "", note: c && c.type === "ASSIGNED" ? c.note : "" }))
        }, null, 2) : "本日の配船に32号船がありません";
      }
      if (id === "guestListModal") {
        renderGuestListModal();
      }
      if (id === "ocrModal") {
        document.getElementById("ocrMsg").innerHTML = "";
        renderOcrParsedList();
      }
      document.getElementById(id).classList.add("open");
    }
    function closeModal(id) { document.getElementById(id).classList.remove("open"); }
    function copyExp() { const a = document.getElementById("expArea"); a.select(); navigator.clipboard.writeText(a.value); toast("コピーしました"); }
    function saveExp() { localStorage.setItem(SHARED_32, document.getElementById("expArea").value); toast("共有領域に保存しました"); }

    init();
  </script>
