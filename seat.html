<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b1120" />
  <title>山下丸 釣り座管理</title>
  <style>
    :root {
      --bg: #0b1120; --card: #131c31; --panel: #1a253c; --inp: #0f172a;
      --bd: #2c3e5e; --tx: #f1f5f9; --sub: #94a3b8;
      --blue: #2563eb; --blue-bg: #172e66;
      --green: #10b981; --green-bg: #064e3b;
      --orange: #f59e0b; --orange-bg: #451a03;
      --red: #ef4444;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; overflow-x: hidden;
      background: var(--bg); color: var(--tx);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 18px; line-height: 1.45;
    }
    body.has-dock { padding-bottom: 92px; }

    header {
      position: sticky; top: 0; z-index: 50; background: #070b14;
      border-bottom: 1px solid var(--bd); padding: 10px 10px;
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
    }
    .h-title { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 18px; color: #fff; }
    .h-badge { font-size: 13px; color: #38bdf8; background: #0f172a; border: 1px solid var(--bd); padding: 2px 7px; border-radius: 6px; }
    .h-btns { display: flex; gap: 6px; }

    button {
      background: var(--panel); color: var(--tx); border: 1px solid var(--bd);
      border-radius: 9px; padding: 10px 11px; font-size: 15px; font-weight: 700;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    }
    button:active { transform: scale(0.97); }
    button.primary { background: var(--blue); border-color: #3b82f6; color: #fff; }
    button.success { background: #059669; border-color: var(--green); color: #fff; }
    button.warning { background: #d97706; border-color: var(--orange); color: #fff; }
    button.danger { background: #b91c1c; border-color: var(--red); color: #fff; }

    .container { padding: 10px; width: 100%; max-width: 560px; margin: 0 auto; }

    /* 選択中お客様バナー（座席配置時のガイド） */
    .selected-banner {
      position: sticky; top: 56px; z-index: 45;
      background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
      border: 2px solid #60a5fa; border-radius: 12px; padding: 11px 12px;
      margin-bottom: 10px; color: #fff;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.55);
    }
    .selected-banner-info { font-size: 16px; font-weight: 800; line-height: 1.35; }
    .selected-banner-sub { font-size: 13px; color: #dbeafe; font-weight: 600; }

    /* 確定アラートバナー */
    .lock-banner {
      background: linear-gradient(135deg, #451a03, #78350f);
      border: 2px solid #f59e0b; border-radius: 12px; padding: 13px;
      margin-bottom: 12px; color: #fef3c7;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
    }
    .lock-banner-title { font-size: 17px; font-weight: 800; color: #fcd34d; margin-bottom: 5px; }
    .lock-banner-desc { font-size: 15px; margin-bottom: 10px; line-height: 1.45; }

    /* 初期スタート画面（配船指定） */
    .wizard { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 15px; }
    .w-title { font-size: 20px; font-weight: 800; margin-bottom: 5px; }
    .w-sub { font-size: 15px; color: var(--sub); margin-bottom: 14px; }
    .boat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .b-pick {
      padding: 15px 6px; border-radius: 10px; border: 2px solid var(--bd);
      background: var(--inp); color: var(--sub); font-size: 17px; font-weight: 800; text-align: center;
    }
    .b-pick.on { background: var(--blue-bg); border-color: #3b82f6; color: #fff; }
    .w-boat-row {
      background: var(--inp); border: 1px solid var(--bd); border-radius: 10px;
      padding: 11px; margin-bottom: 10px;
    }
    .w-boat-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 18px; font-weight: 800; }
    .w-caps { display: flex; gap: 8px; }
    .w-cap-box { flex: 1; background: var(--card); padding: 8px; border-radius: 8px; text-align: center; }
    .w-cap-ctrl { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 4px; font-size: 20px; }
    .w-cap-ctrl button { padding: 7px 15px; font-size: 20px; }

    /* タブ＆モードバー */
    .tabs { display: flex; overflow-x: auto; background: #0d1526; border-bottom: 1px solid var(--bd); padding: 6px 8px; gap: 6px; }
    .tab {
      flex: 1; min-width: 78px; padding: 10px 6px; border-radius: 8px;
      background: var(--card); border: 1px solid var(--bd); text-align: center;
      font-size: 15px; font-weight: 700; color: var(--sub);
    }
    .tab.active { background: var(--blue); border-color: #60a5fa; color: #fff; }

    .mode-bar { display: flex; padding: 8px 10px; background: var(--card); border-bottom: 1px solid var(--bd); gap: 8px; }
    .hold-btn { flex: 1; padding: 12px 8px; font-size: 15px; border: 2px solid var(--bd); background: var(--inp); color: var(--sub); }
    .hold-btn.on { background: var(--orange-bg); border-color: var(--orange); color: #fcd34d; }

    /* 全体俯瞰（1マス縦幅46px・座席直接タップ対応） */
    .ov-card { background: var(--card); border: 1px solid var(--bd); border-radius: 12px; padding: 12px; margin-bottom: 14px; }
    .ov-head {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--bd);
      cursor: pointer;
    }
    .mini-hull { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mini-seat {
      height: 46px; border-radius: 8px; background: var(--inp); border: 2px solid #263552;
      display: flex; align-items: center; justify-content: space-between; padding: 0 10px;
      font-size: 16px; font-weight: 700; color: var(--sub); margin-bottom: 6px;
      cursor: pointer;
    }
    .mini-seat.hold { background: var(--orange-bg); border-color: var(--orange); color: #fcd34d; }
    .mini-seat.assigned { background: var(--blue-bg); border-color: #3b82f6; color: #ffffff; }
    .mini-seat.fit-ok { background: var(--green-bg); border-color: var(--green); color: #6ee7b7; box-shadow: 0 0 8px rgba(16,185,129,0.4); }
    .mini-seat.fit-warn { background: #3f3208; border-color: #eab308; color: #fde047; }

    /* 1隻詳細 */
    .bow-bar {
      text-align: center; font-size: 15px; font-weight: 800; color: #38bdf8;
      padding: 8px; background: #0d172a; border: 1px solid var(--bd); border-radius: 8px; margin: 10px 0;
    }
    .hull { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .seat {
      min-height: 68px; border-radius: 10px; background: var(--inp); border: 2px solid #263552;
      padding: 8px 10px; display: flex; flex-direction: column; justify-content: center; margin-bottom: 8px;
      cursor: pointer;
    }
    .seat.hold { background: var(--orange-bg); border-color: var(--orange); }
    .seat.assigned { background: var(--blue-bg); border-color: #3b82f6; }
    .seat.fit-ok { background: var(--green-bg); border-color: var(--green); }
    .seat.fit-warn { background: #3b2f06; border-color: #eab308; }
    .s-pos { font-size: 13px; color: var(--sub); font-weight: 700; }
    .s-name { font-size: 17px; font-weight: 800; color: #fff; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { display: inline-block; font-size: 12px; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,0.18); margin-right: 4px; margin-top: 2px; }

    /* 全画面引き出し式 予約表シート */
    .drawer-backdrop {
      position: fixed; inset: 0; z-index: 65; background: rgba(0, 0, 0, 0.72);
      display: none;
    }
    .drawer-backdrop.open { display: block; }

    .dock {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 70; background: #070b14;
      border-top: 2px solid #3b82f6; border-radius: 16px 16px 0 0;
      padding: 8px 12px 14px;
      box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.9);
      transition: height 0.22s ease;
    }
    .dock.collapsed {
      height: 76px;
      overflow: hidden;
    }
    .dock.expanded {
      height: 88vh;
      display: flex;
      flex-direction: column;
    }
    .grab-handle {
      width: 44px; height: 5px; background: #475569; border-radius: 99px;
      margin: 0 auto 6px;
    }
    .dock-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px; font-size: 15px; color: #38bdf8; font-weight: 800; gap: 6px;
      flex-shrink: 0;
    }
    .dock-sub-controls {
      display: flex; justify-content: space-between; align-items: center;
      gap: 6px; margin-bottom: 10px; flex-shrink: 0;
    }
    .g-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      flex: 1;
      padding-bottom: 16px;
    }
    .dock.collapsed .dock-sub-controls,
    .dock.collapsed .g-list {
      display: none;
    }
    .g-row {
      background: var(--card); border: 2px solid var(--bd);
      border-radius: 12px; padding: 12px 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      cursor: pointer;
    }
    .g-row.sel { background: #1e3a8a; border-color: #60a5fa; box-shadow: 0 0 12px rgba(59,130,246,0.55); }
    .g-row.done { opacity: 0.45; border-style: dashed; }
    .g-row-main { flex: 1; min-width: 0; }
    .g-row-top { display: flex; align-items: center; gap: 8px; }
    .g-name-txt { font-size: 19px; font-weight: 800; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .g-cnt { background: var(--blue); color: #fff; padding: 2px 9px; border-radius: 7px; font-size: 15px; font-weight: 800; flex-shrink: 0; }
    .g-meta { font-size: 14px; color: #cbd5e1; margin-top: 4px; }
    .g-meta.dot-mark { color: #fcd34d; font-weight: 700; }

    /* モーダル */
    .modal-bg { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.82); display: none; align-items: center; justify-content: center; padding: 12px; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; padding: 15px; }
    .m-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bd); padding-bottom: 8px; margin-bottom: 12px; font-weight: 800; font-size: 18px; }
    .field { margin-bottom: 13px; }
    .field label { display: block; font-size: 14px; color: var(--sub); margin-bottom: 5px; font-weight: 700; }
    input[type="text"], input[type="password"], input[type="number"], textarea, select {
      width: 100%; background: var(--inp); border: 1px solid var(--bd); color: var(--tx);
      border-radius: 8px; padding: 11px; font-size: 17px; user-select: text;
    }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; background: var(--inp); border: 1px solid var(--bd); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .toast {
      position: fixed; top: 58px; left: 50%; transform: translateX(-50%); z-index: 200;
      background: #1e293b; border: 1px solid #475569; color: #fff; padding: 11px 18px;
      border-radius: 10px; font-size: 15px; font-weight: 700; display: none; max-width: 92vw; text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="h-title">
      <span>⚓ 山下丸</span>
      <span class="h-badge">釣り座管理</span>
    </div>
    <div class="h-btns">
      <button onclick="openModal('ocrModal')">📷 読込</button>
      <button onclick="openModal('setupModal')">⚙ 配船</button>
      <button class="primary" onclick="openModal('exportModal')">📤 32号</button>
    </div>
  </header>

  <div id="topBars" style="display:none;">
    <div class="tabs" id="boatTabs"></div>
    <div class="mode-bar">
      <button id="holdModeBtn" class="hold-btn" onclick="toggleHold()">🟠 仮押さえ：OFF</button>
      <button class="success" onclick="autoAssign(true)">✨ 残り自動確定</button>
    </div>
  </div>

  <div class="container" id="main"></div>

  <div class="drawer-backdrop" id="drawerBackdrop" onclick="setDrawerOpen(false)"></div>

  <!-- 下部引き出し式 予約表シート -->
  <div class="dock collapsed" id="bottomDock" style="display:none;">
    <div class="grab-handle" onclick="toggleDrawer()"></div>
    <div class="dock-head" onclick="toggleDrawer()">
      <span id="dockStatus">▲ 予約一覧を開く</span>
      <div style="display:flex; gap:6px; flex-shrink:0;" onclick="event.stopPropagation()">
        <button style="padding:6px 10px; font-size:14px;" onclick="openModal('addModal')">＋ 追加</button>
        <button id="drawerToggleBtn" class="primary" style="padding:6px 11px; font-size:14px;" onclick="toggleDrawer()">▲ 一覧</button>
      </div>
    </div>
    <div class="dock-sub-controls">
      <button id="sortModeBtn" style="flex:1; padding:8px; font-size:14px;" onclick="toggleSortOrder()">並び順：人数が多い順</button>
      <button style="padding:8px 12px; font-size:14px;" onclick="clearSel()">選択解除</button>
    </div>
    <div class="g-list" id="guestList"></div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 配船・API設定モーダル -->
  <div class="modal-bg" id="setupModal">
    <div class="modal">
      <div class="m-head"><span>⚙ 配船・動作設定</span><button onclick="closeModal('setupModal')">閉じる</button></div>
      <div class="toggle-row" onclick="toggleAutoLockSetting()">
        <div>
          <div style="font-size:16px; font-weight:800;">🔒 選択肢ゼロ時の自動確定</div>
          <div style="font-size:13px; color:var(--sub);">自由選択が不可能になったら自動で席を確定する</div>
        </div>
        <button id="autoLockToggleBtn" class="primary" style="min-width:68px;">OFF</button>
      </div>
      <div class="field">
        <label>AI解析モデル</label>
        <select id="modelSelect" onchange="saveModel()">
          <option value="gemini-4-hydrogen">Gemini 4 Hydrogen (標準・高速)</option>
          <option value="gemini-4-neon">Gemini 4 Neon (高精度)</option>
          <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
        </select>
      </div>
      <div class="field">
        <label>Gemini APIキー（予約表の写真解析用）</label>
        <input type="password" id="apiKeyInput" placeholder="AIzaSy..." onchange="saveKey()" />
      </div>
      <div style="display:flex; flex-direction:column; gap:8px; margin-top:12px;">
        <button class="primary" style="padding:13px;" onclick="backToWizard()">🚢 船・人数を選び直す（配船画面へ）</button>
        <button class="danger" style="padding:13px;" onclick="resetSeatsOnly()">座席の配置だけ全て空に戻す</button>
      </div>
    </div>
  </div>

  <!-- OCR読込モーダル -->
  <div class="modal-bg" id="ocrModal">
    <div class="modal">
      <div class="m-head"><span>📷 予約表の写真読込</span><button onclick="closeModal('ocrModal')">閉じる</button></div>
      <div class="field"><label>対象魚種（ヒント）</label><input type="text" id="fishInput" value="カワハギ" /></div>
      <div class="field"><label>予約表の写真を選択</label><input type="file" id="ocrFile" accept="image/*" /></div>
      <button class="primary" style="width:100%; padding:13px;" id="ocrBtn" onclick="runOcr()">AIで解析・検算する</button>
      <div id="ocrMsg" style="margin-top:10px; font-size:15px;"></div>
    </div>
  </div>

  <!-- 手動追加モーダル -->
  <div class="modal-bg" id="addModal">
    <div class="modal">
      <div class="m-head"><span>＋ 予約グループ追加</span><button onclick="closeModal('addModal')">閉じる</button></div>
      <div class="field"><label>代表者名</label><input type="text" id="addName" placeholder="例：赤岸" /></div>
      <div class="field"><label>人数</label><input type="number" id="addCount" value="1" min="1" max="13" /></div>
      <div class="field"><label>メモ（前日場所取 / 竿 / カラ）</label><input type="text" id="addNote" /></div>
      <button class="primary" style="width:100%; padding:13px;" onclick="addGuest()">追加する</button>
    </div>
  </div>

  <!-- 編集・削除モーダル -->
  <div class="modal-bg" id="editModal">
    <div class="modal">
      <div class="m-head"><span>✎ 予約の修正・削除</span><button onclick="closeModal('editModal')">閉じる</button></div>
      <input type="hidden" id="editId" />
      <div class="field"><label>代表者名</label><input type="text" id="editName" /></div>
      <div class="field">
        <label>人数</label>
        <div style="display:flex; gap:10px; align-items:center;">
          <button style="padding:11px 20px; font-size:20px;" onclick="stepEdit(-1)">−</button>
          <input type="number" id="editCount" min="1" max="13" style="text-align:center; font-weight:800;" />
          <button style="padding:11px 20px; font-size:20px;" onclick="stepEdit(1)">＋</button>
        </div>
      </div>
      <div class="field"><label>メモ</label><input type="text" id="editNote" /></div>
      <div style="display:flex; gap:8px;">
        <button class="danger" style="flex:1; padding:13px;" onclick="delGuest()">🗑 削除</button>
        <button class="primary" style="flex:1; padding:13px;" onclick="saveEdit()">✅ 保存</button>
      </div>
    </div>
  </div>

  <!-- 32号連携モーダル -->
  <div class="modal-bg" id="exportModal">
    <div class="modal">
      <div class="m-head"><span>📤 32号船 釣果アプリ連携</span><button onclick="closeModal('exportModal')">閉じる</button></div>
      <textarea id="expArea" rows="8" readonly style="font-family:monospace; font-size:13px;"></textarea>
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button class="primary" style="flex:1;" onclick="copyExp()">📋 コピー</button>
        <button class="success" style="flex:1;" onclick="saveExp()">💾 共有領域に保存</button>
      </div>
    </div>
  </div>

  <script>
    const BOAT_LIST = ["32号船", "31号船", "27号船", "25号船", "智丸"];
    const STORE_KEY = "yamashitamaru_seat_v4";
    const SHARED_32 = "yamashitamaru_seat_32_export";

    let draftBoats = [{ name: "32号船", leftCap: 10, rightCap: 10 }];
    let drawerOpen = false;
    let touchStartY = 0;

    let state = {
      configured: false,
      autoLockEnabled: false,
      sortByCount: true, // true: 人数が多い順, false: 予約表の記載順
      view: "overview",
      holdMode: false,
      selId: null,
      boats: [],
      guests: []
    };

    function init() {
      const saved = localStorage.getItem(STORE_KEY);
      if (saved) {
        try { state = { ...state, ...JSON.parse(saved) }; } catch (e) {}
      }
      document.getElementById("apiKeyInput").value = localStorage.getItem("gemini_api_key") || "";
      document.getElementById("modelSelect").value = localStorage.getItem("gemini_seat_model") || "gemini-4-hydrogen";

      // スワイプでの引き出し開閉操作
      const dock = document.getElementById("bottomDock");
      dock.addEventListener("touchstart", e => {
        touchStartY = e.touches[0].clientY;
      }, { passive: true });
      dock.addEventListener("touchend", e => {
        const diff = touchStartY - e.changedTouches[0].clientY;
        if (diff > 45 && !drawerOpen) setDrawerOpen(true);
        if (diff < -60 && drawerOpen && document.getElementById("guestList").scrollTop <= 0) {
          setDrawerOpen(false);
        }
      }, { passive: true });

      render();
    }

    function save() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    function saveKey() { localStorage.setItem("gemini_api_key", document.getElementById("apiKeyInput").value.trim()); toast("APIキー保存完了"); }
    function saveModel() { localStorage.setItem("gemini_seat_model", document.getElementById("modelSelect").value); toast("AIモデルを保存しました"); }
    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.style.display = "block";
      clearTimeout(t._tm); t._tm = setTimeout(() => t.style.display = "none", 3200);
    }

    function setDrawerOpen(open) {
      drawerOpen = open;
      const dock = document.getElementById("bottomDock");
      const bg = document.getElementById("drawerBackdrop");
      const btn = document.getElementById("drawerToggleBtn");
      if (drawerOpen) {
        dock.classList.remove("collapsed");
        dock.classList.add("expanded");
        bg.classList.add("open");
        btn.textContent = "▼ 閉じる";
      } else {
        dock.classList.remove("expanded");
        dock.classList.add("collapsed");
        bg.classList.remove("open");
        btn.textContent = "▲ 一覧";
      }
    }

    function toggleDrawer() {
      setDrawerOpen(!drawerOpen);
    }

    function toggleSortOrder() {
      state.sortByCount = !state.sortByCount;
      save(); render();
    }

    function toggleAutoLockSetting() {
      state.autoLockEnabled = !state.autoLockEnabled;
      save();
      updateAutoLockBtn();
      toast(state.autoLockEnabled ? "選択肢ゼロ時の自動確定をONにしました" : "選択肢ゼロ時はお知らせバナー表示にしました");
    }

    function updateAutoLockBtn() {
      const btn = document.getElementById("autoLockToggleBtn");
      if (!btn) return;
      btn.textContent = state.autoLockEnabled ? "ON" : "OFF";
      btn.className = state.autoLockEnabled ? "success" : "";
    }

    function toggleDraftBoat(name) {
      const idx = draftBoats.findIndex(b => b.name === name);
      if (idx >= 0) draftBoats.splice(idx, 1);
      else draftBoats.push({ name, leftCap: 10, rightCap: 10 });
      render();
    }

    function changeDraftCap(idx, side, d) {
      const key = side === "left" ? "leftCap" : "rightCap";
      draftBoats[idx][key] = Math.min(13, Math.max(1, draftBoats[idx][key] + d));
      render();
    }

    function startWithDraft() {
      if (draftBoats.length === 0) { toast("出船する船を1隻以上選んでください"); return; }
      state.boats = draftBoats.map(b => ({
        name: b.name,
        leftCap: b.leftCap,
        rightCap: b.rightCap,
        leftSeats: Array(b.leftCap).fill(null),
        rightSeats: Array(b.rightCap).fill(null)
      }));
      state.configured = true;
      state.view = "overview";
      save(); render();
      toast("座席表を作成しました");
    }

    function backToWizard() {
      if (state.boats.length > 0) {
        draftBoats = state.boats.map(b => ({ name: b.name, leftCap: b.leftCap, rightCap: b.rightCap }));
      }
      state.configured = false;
      setDrawerOpen(false);
      closeModal("setupModal");
      save(); render();
    }

    function canFitAll(boatsSnap, unplaced) {
      if (unplaced.length === 0) return true;
      const blocks = [];
      boatsSnap.forEach(b => ["leftSeats", "rightSeats"].forEach(sk => {
        let r = 0;
        b[sk].forEach(c => { if (c === null) r++; else { if (r > 0) blocks.push(r); r = 0; } });
        if (r > 0) blocks.push(r);
      }));
      if (blocks.reduce((a, b) => a + b, 0) < unplaced.reduce((a, g) => a + g.count, 0)) return false;
      const sorted = [...unplaced].sort((a, b) => b.count - a.count);
      function bt(i, rem) {
        if (i === sorted.length) return true;
        const need = sorted[i].count, tried = new Set();
        for (let k = 0; k < rem.length; k++) {
          if (rem[k] >= need && !tried.has(rem[k])) {
            tried.add(rem[k]);
            const nxt = [...rem]; nxt[k] -= need;
            if (bt(i + 1, nxt)) return true;
          }
        }
        return false;
      }
      return bt(0, blocks);
    }

    function evalPlace(bIdx, sk, start, guest) {
      const arr = state.boats[bIdx][sk];
      if (start + guest.count > arr.length) return { valid: false };
      for (let i = start; i < start + guest.count; i++) {
        if (arr[i] && arr[i].type === "ASSIGNED" && arr[i].guestId !== guest.id) return { valid: false };
      }
      const clone = JSON.parse(JSON.stringify(state.boats));
      clone.forEach(b => ["leftSeats", "rightSeats"].forEach(s => b[s] = b[s].map(c => (c && c.guestId === guest.id) ? null : c)));
      for (let i = start; i < start + guest.count; i++) clone[bIdx][sk][i] = { type: "ASSIGNED", guestId: guest.id };
      const placed = new Set();
      clone.forEach(b => ["leftSeats", "rightSeats"].forEach(s => b[s].forEach(c => { if (c && c.type === "ASSIGNED") placed.add(c.guestId); })));
      return { valid: true, fits: canFitAll(clone, state.guests.filter(g => !placed.has(g.id))) };
    }

    function checkRemainingFreedom() {
      const placed = getPlacedIds();
      const unplaced = state.guests.filter(g => !placed.has(g.id));
      if (unplaced.length === 0) return { status: "DONE", count: 0 };

      let anyGroupHasZeroChoice = false;
      let maxChoicesForAnyGroup = 0;

      for (const g of unplaced) {
        let gChoices = 0;
        state.boats.forEach((b, bi) => ["leftSeats", "rightSeats"].forEach(sk => {
          for (let i = 0; i <= b[sk].length - g.count; i++) {
            const ev = evalPlace(bi, sk, i, g);
            if (ev.valid && ev.fits) gChoices++;
          }
        }));
        if (gChoices === 0) anyGroupHasZeroChoice = true;
        if (gChoices > maxChoicesForAnyGroup) maxChoicesForAnyGroup = gChoices;
      }

      if (anyGroupHasZeroChoice) {
        return { status: "NO_CHOICE_SPLIT", unplacedCount: unplaced.length };
      }
      if (maxChoicesForAnyGroup <= 1) {
        return { status: "LOCKED_UNIQUE", unplacedCount: unplaced.length };
      }
      return { status: "FREE", unplacedCount: unplaced.length };
    }

    function clickSeat(bIdx, sk, idx, e) {
      if (e) e.stopPropagation();
      const arr = state.boats[bIdx][sk], cur = arr[idx];
      if (state.holdMode) {
        if (cur && cur.type === "ASSIGNED") { toast("確定済みの席です"); return; }
        arr[idx] = (cur && cur.type === "HOLD") ? null : { type: "HOLD" };
        save(); render(); return;
      }
      if (state.selId) {
        const g = state.guests.find(x => x.id === state.selId);
        if (!g) return;
        if (cur && cur.type === "ASSIGNED" && cur.guestId === g.id) {
          removeGuest(g.id); save(); render(); toast(`${g.name}様を解除しました`); return;
        }
        let st = idx;
        if (st + g.count > arr.length) st = Math.max(0, arr.length - g.count);
        const ev = evalPlace(bIdx, sk, st, g);
        if (!ev.valid) { toast("他の確定客と重なるため配置できません"); return; }
        removeGuest(g.id);
        for (let i = st; i < st + g.count; i++) {
          arr[i] = { type: "ASSIGNED", guestId: g.id, name: g.name, count: g.count, note: g.note };
        }
        state.selId = null;

        const freedom = checkRemainingFreedom();
        if (state.autoLockEnabled && (freedom.status === "LOCKED_UNIQUE" || freedom.status === "NO_CHOICE_SPLIT")) {
          autoAssign(false);
          save(); render();
          toast(`🔒 選べなくなったため、残り${freedom.unplacedCount}組の席を自動確定しました！`);
          return;
        }

        save(); render();
        if (freedom.status === "LOCKED_UNIQUE") {
          toast(`🔒 残り${freedom.unplacedCount}組はもう選べません（配置が1通りに確定）`);
        } else if (freedom.status === "NO_CHOICE_SPLIT") {
          toast(`⚠️ これ以上は分断なしでは選べません（自動確定で調整してください）`);
        } else {
          toast(ev.fits ? `✅ ${g.name}様(${g.count}名)を確定` : `⚠️ ${g.name}様配置（残り分断注意）`);
        }
        return;
      }
      if (cur && cur.type === "ASSIGNED") { state.selId = cur.guestId; render(); toast(`${cur.name}様を選択中（移動先タップ、または再タップで解除）`); return; }
      if (cur && cur.type === "HOLD") { arr[idx] = null; save(); render(); toast("仮押さえ解除"); return; }
      toast("下の「▲ 予約一覧」からお名前を選んでください");
    }

    function removeGuest(id) {
      state.boats.forEach(b => ["leftSeats", "rightSeats"].forEach(sk => b[sk] = b[sk].map(c => (c && c.guestId === id) ? null : c)));
    }

    function autoAssign(showFeedback = true) {
      const placed = getPlacedIds();
      const unplaced = state.guests.filter(g => !placed.has(g.id)).sort((a, b) => b.count - a.count);
      if (unplaced.length === 0) { if (showFeedback) toast("全員すでに確定済みです"); return; }
      const runs = () => {
        const r = [];
        state.boats.forEach((b, bIdx) => ["leftSeats", "rightSeats"].forEach(sk => {
          let st = -1;
          b[sk].forEach((c, i) => {
            if (c === null) { if (st === -1) st = i; }
            else { if (st !== -1) { r.push({ bIdx, sk, st, len: i - st }); st = -1; } }
          });
          if (st !== -1) r.push({ bIdx, sk, st, len: b[sk].length - st });
        }));
        return r;
      };
      let splits = 0;
      for (const g of unplaced) {
        const fit = runs().filter(r => r.len >= g.count).sort((a, b) => a.len - b.len);
        if (fit.length > 0) {
          const t = fit[0], arr = state.boats[t.bIdx][t.sk];
          for (let i = t.st; i < t.st + g.count; i++) arr[i] = { type: "ASSIGNED", guestId: g.id, name: g.name, count: g.count, note: g.note };
        } else {
          splits++;
          let rem = g.count;
          for (const r of runs().sort((a, b) => b.len - a.len)) {
            if (rem <= 0) break;
            const take = Math.min(r.len, rem), arr = state.boats[r.bIdx][r.sk];
            for (let i = r.st; i < r.st + take; i++) arr[i] = { type: "ASSIGNED", guestId: g.id, name: `${g.name}(分)`, count: g.count, note: g.note };
            rem -= take;
          }
        }
      }
      if (showFeedback) {
        save(); render();
        toast(splits > 0 ? `⚠️ 空き不足のため${splits}組が分断確定になりました` : "✅ 残り全員の座席を自動確定しました！");
      }
    }

    function getPlacedIds() {
      const ids = new Set();
      state.boats.forEach(b => ["leftSeats", "rightSeats"].forEach(sk => b[sk].forEach(c => { if (c && c.type === "ASSIGNED") ids.add(c.guestId); })));
      return ids;
    }

    function changeCap(bIdx, side, d) {
      const b = state.boats[bIdx], k = side === "left" ? "leftCap" : "rightCap", sk = side === "left" ? "leftSeats" : "rightSeats";
      const nxt = b[k] + d;
      if (nxt < 1 || nxt > 13) return;
      b[k] = nxt;
      while (b[sk].length < nxt) b[sk].push(null);
      if (b[sk].length > nxt) b[sk].length = nxt;
      save(); render();
    }

    function swapCaps(bIdx) {
      const b = state.boats[bIdx], tmp = b.leftCap;
      b.leftCap = b.rightCap; b.rightCap = tmp;
      while (b.leftSeats.length < b.leftCap) b.leftSeats.push(null);
      b.leftSeats.length = b.leftCap;
      while (b.rightSeats.length < b.rightCap) b.rightSeats.push(null);
      b.rightSeats.length = b.rightCap;
      save(); render(); toast("左右の定員を入れ替えました");
    }

    function toggleHold() { state.holdMode = !state.holdMode; if (state.holdMode) state.selId = null; render(); }
    function clearSel() { state.selId = null; state.holdMode = false; render(); }

    function render() {
      const topBars = document.getElementById("topBars");
      const dock = document.getElementById("bottomDock");
      const main = document.getElementById("main");

      if (!state.configured) {
        document.body.classList.remove("has-dock");
        topBars.style.display = "none";
        dock.style.display = "none";
        const totalCap = draftBoats.reduce((a, b) => a + b.leftCap + b.rightCap, 0);
        const totalGuests = state.guests.reduce((a, g) => a + g.count, 0);
        main.innerHTML = `
          <div class="wizard">
            <div class="w-title">🚢 本日の出船・人数を指定</div>
            <div class="w-sub">出船する船をタップして選び、左右の席数を設定してください（予約済：${totalGuests}名 / 選択席数：${totalCap}席）</div>
            <div class="boat-grid">
              ${BOAT_LIST.map(n => {
                const on = draftBoats.some(b => b.name === n);
                return `<div class="b-pick ${on ? 'on' : ''}" onclick="toggleDraftBoat('${n}')">${n}</div>`;
              }).join("")}
            </div>
            ${draftBoats.map((b, i) => `
              <div class="w-boat-row">
                <div class="w-boat-top"><span>${b.name}</span><span style="font-size:15px;color:#38bdf8;">計 ${b.leftCap + b.rightCap}席</span></div>
                <div class="w-caps">
                  <div class="w-cap-box">
                    <div style="font-size:14px;color:var(--sub);">左舷</div>
                    <div class="w-cap-ctrl">
                      <button onclick="changeDraftCap(${i},'left',-1)">−</button>
                      <b>${b.leftCap}</b>
                      <button onclick="changeDraftCap(${i},'left',1)">＋</button>
                    </div>
                  </div>
                  <div class="w-cap-box">
                    <div style="font-size:14px;color:var(--sub);">右舷</div>
                    <div class="w-cap-ctrl">
                      <button onclick="changeDraftCap(${i},'right',-1)">−</button>
                      <b>${b.rightCap}</b>
                      <button onclick="changeDraftCap(${i},'right',1)">＋</button>
                    </div>
                  </div>
                </div>
              </div>
            `).join("")}
            <button class="primary" style="width:100%; padding:15px; font-size:18px; margin-top:8px;" onclick="startWithDraft()">
              ✅ この配船で座席表を表示する
            </button>
          </div>
        `;
        return;
      }

      document.body.classList.add("has-dock");
      topBars.style.display = "block";
      dock.style.display = "";

      let tabsHtml = `<div class="tab ${state.view === 'overview' ? 'active' : ''}" onclick="setView('overview')">全体(${state.boats.length}隻)</div>`;
      state.boats.forEach(b => {
        const emp = b.leftSeats.filter(x => !x).length + b.rightSeats.filter(x => !x).length;
        tabsHtml += `<div class="tab ${state.view === b.name ? 'active' : ''}" onclick="setView('${b.name}')">${b.name}<br><span style="font-size:13px;">空${emp}</span></div>`;
      });
      document.getElementById("boatTabs").innerHTML = tabsHtml;

      const hb = document.getElementById("holdModeBtn");
      hb.className = state.holdMode ? "hold-btn on" : "hold-btn";
      hb.textContent = state.holdMode ? "🟠 仮押さえ：ON（席タップ）" : "🟠 仮押さえ：OFF";

      // 選択中お客様バナー
      const selG = state.guests.find(g => g.id === state.selId);
      let selBannerHtml = "";
      if (selG) {
        selBannerHtml = `
          <div class="selected-banner">
            <div>
              <div class="selected-banner-info">👤 ${selG.name}様 (${selG.count}名) を選択中</div>
              <div class="selected-banner-sub">▼ 配置したい席をタップしてください</div>
            </div>
            <button style="padding:8px 12px; font-size:14px; background:rgba(0,0,0,0.35); border-color:#93c5fd;" onclick="clearSel()">解除</button>
          </div>
        `;
      }

      // 自由選択終了（確定通知）バナー
      let bannerHtml = "";
      const freedom = checkRemainingFreedom();
      if (freedom.status === "LOCKED_UNIQUE") {
        bannerHtml = `
          <div class="lock-banner">
            <div class="lock-banner-title">🔒 自由選択終了（残り${freedom.unplacedCount}組の席が確定しました）</div>
            <div class="lock-banner-desc">これ以上自由に席を選ぶとグループが分断されます。残りの空き枠に全員を自動確定できます。</div>
            <button class="warning" style="width:100%; padding:13px; font-size:16px;" onclick="autoAssign(true)">
              ✅ 残りの${freedom.unplacedCount}組をこの配置で確定する
            </button>
          </div>
        `;
      } else if (freedom.status === "NO_CHOICE_SPLIT") {
        bannerHtml = `
          <div class="lock-banner" style="border-color:#ef4444; background:linear-gradient(135deg,#450a0a,#7f1d1d);">
            <div class="lock-banner-title" style="color:#fca5a5;">⚠️ 自由選択終了（空き枠不足・自動調整が必要です）</div>
            <div class="lock-banner-desc">これ以上お客様が自由に席を選ぶことができません。下のボタンで残りの席を確定させてください。</div>
            <button class="danger" style="width:100%; padding:13px; font-size:16px;" onclick="autoAssign(true)">
              ✨ 残りの${freedom.unplacedCount}組を自動確定する
            </button>
          </div>
        `;
      }

      // ハイライト計算
      const hl = {};
      if (selG) {
        state.boats.forEach((b, bi) => ["leftSeats", "rightSeats"].forEach(sk => {
          for (let i = 0; i <= b[sk].length - selG.count; i++) {
            const ev = evalPlace(bi, sk, i, selG);
            if (ev.valid) {
              for (let k = i; k < i + selG.count; k++) {
                const key = `${bi}-${sk}-${k}`;
                if (!hl[key] || ev.fits) hl[key] = ev.fits ? "fit-ok" : "fit-warn";
              }
            }
          }
        }));
      }

      if (state.view === "overview") {
        main.innerHTML = selBannerHtml + bannerHtml + state.boats.map((b, bi) => {
          const le = b.leftSeats.filter(x => !x).length, re = b.rightSeats.filter(x => !x).length;
          return `
            <div class="ov-card">
              <div class="ov-head" onclick="setView('${b.name}')">
                <b style="font-size:18px;">🚢 ${b.name} <span style="font-size:13px;color:#38bdf8;">(詳細へ▶)</span></b>
                <span style="font-size:14px;color:var(--sub);">左空:<b style="color:#38bdf8;">${le}</b>/${b.leftCap} 右空:<b style="color:#38bdf8;">${re}</b>/${b.rightCap}</span>
              </div>
              <div class="mini-hull">
                <div><div style="font-size:13px;color:var(--sub);text-align:center;margin-bottom:4px;font-weight:700;">▲ 左舷</div>
                  ${b.leftSeats.map((c, i) => miniHtml(bi, "leftSeats", c, i, hl[`${bi}-leftSeats-${i}`])).join("")}
                </div>
                <div><div style="font-size:13px;color:var(--sub);text-align:center;margin-bottom:4px;font-weight:700;">▲ 右舷</div>
                  ${b.rightSeats.map((c, i) => miniHtml(bi, "rightSeats", c, i, hl[`${bi}-rightSeats-${i}`])).join("")}
                </div>
              </div>
            </div>
          `;
        }).join("");
      } else {
        const bi = state.boats.findIndex(b => b.name === state.view);
        if (bi === -1) { state.view = "overview"; render(); return; }
        const b = state.boats[bi];
        main.innerHTML = selBannerHtml + bannerHtml + `
          <div style="display:flex;gap:8px;align-items:center;background:var(--card);padding:10px;border-radius:10px;border:1px solid var(--bd);">
            <div style="flex:1;text-align:center;"><div style="font-size:13px;color:var(--sub);">左舷</div>
              <div style="display:flex;justify-content:center;align-items:center;gap:10px;margin-top:4px;font-size:19px;">
                <button style="padding:5px 12px;font-size:18px;" onclick="changeCap(${bi},'left',-1)">−</button><b>${b.leftCap}</b><button style="padding:5px 12px;font-size:18px;" onclick="changeCap(${bi},'left',1)">＋</button>
              </div>
            </div>
            <button style="padding:9px;font-size:14px;" onclick="swapCaps(${bi})">⇄<br>入替</button>
            <div style="flex:1;text-align:center;"><div style="font-size:13px;color:var(--sub);">右舷</div>
              <div style="display:flex;justify-content:center;align-items:center;gap:10px;margin-top:4px;font-size:19px;">
                <button style="padding:5px 12px;font-size:18px;" onclick="changeCap(${bi},'right',-1)">−</button><b>${b.rightCap}</b><button style="padding:5px 12px;font-size:18px;" onclick="changeCap(${bi},'right',1)">＋</button>
              </div>
            </div>
          </div>
          <div class="bow-bar">▲ ミヨシ（船首） ▲</div>
          <div class="hull">
            <div><div style="text-align:center;font-size:14px;font-weight:700;color:var(--sub);margin-bottom:6px;">左 舷</div>
              ${b.leftSeats.map((c, i) => seatHtml(bi, "leftSeats", c, i, b.leftCap, hl[`${bi}-leftSeats-${i}`])).join("")}
            </div>
            <div><div style="text-align:center;font-size:14px;font-weight:700;color:var(--sub);margin-bottom:6px;">右 舷</div>
              ${b.rightSeats.map((c, i) => seatHtml(bi, "rightSeats", c, i, b.rightCap, hl[`${bi}-rightSeats-${i}`])).join("")}
            </div>
          </div>
          <div class="bow-bar">▼ オオドモ（船尾） ▼</div>
        `;
      }

      // 引き出し式 予約表シート描画
      const placed = getPlacedIds();
      const unplaced = state.guests.filter(g => !placed.has(g.id));
      const placedList = state.guests.filter(g => placed.has(g.id));
      const unpCnt = unplaced.reduce((a, g) => a + g.count, 0);
      const totCnt = state.guests.reduce((a, g) => a + g.count, 0);
      const capCnt = state.boats.reduce((a, b) => a + b.leftCap + b.rightCap, 0);

      document.getElementById("dockStatus").textContent = `未配置 ${unpCnt}名(${unplaced.length}組) / 計${totCnt}名`;
      document.getElementById("sortModeBtn").textContent = state.sortByCount ? "並び順：人数が多い順 ▼" : "並び順：予約表の記載順";

      const gl = document.getElementById("guestList");
      if (state.guests.length === 0) {
        gl.innerHTML = `<div style="font-size:15px;color:var(--sub);padding:24px 10px;text-align:center;">「📷 読込」または「＋ 追加」から予約を入れてください</div>`;
      } else {
        const sortFn = (a, b) => {
          if (!state.sortByCount) return 0;
          const aDot = (a.note || "").includes("前日場所取") ? 1 : 0;
          const bDot = (b.note || "").includes("前日場所取") ? 1 : 0;
          if (aDot !== bDot) return bDot - aDot;
          return b.count - a.count;
        };
        const sortedUnplaced = [...unplaced].sort(sortFn);
        const sortedPlaced = [...placedList].sort(sortFn);
        const allSorted = [...sortedUnplaced, ...sortedPlaced];

        gl.innerHTML = allSorted.map(g => {
          const isP = placed.has(g.id), isS = state.selId === g.id;
          const hasDot = (g.note || "").includes("前日場所取");
          return `
            <div class="g-row ${isS ? 'sel' : ''} ${isP ? 'done' : ''}" onclick="selGuest('${g.id}')">
              <div class="g-row-main">
                <div class="g-row-top">
                  <span class="g-name-txt">${g.name}</span>
                  <span class="g-cnt">${g.count}名</span>
                </div>
                <div class="g-meta ${hasDot ? 'dot-mark' : ''}">
                  ${isP ? '✅ 座席確定済み' : (g.note || '通常予約')}
                </div>
              </div>
              <button style="padding:8px 12px; font-size:15px; flex-shrink:0;" onclick="openEdit(event,'${g.id}')">✎ 修正</button>
            </div>
          `;
        }).join("");
      }
    }

    function miniHtml(bi, sk, c, i, h) {
      let cls = "mini-seat", txt = "空";
      if (c) { cls += c.type === "HOLD" ? " hold" : " assigned"; txt = c.type === "HOLD" ? "仮押さえ" : `${c.name}(${c.count})`; }
      else if (h) { cls += " " + h; txt = h === "fit-ok" ? "案内OK" : "注意"; }
      return `<div class="${cls}" onclick="clickSeat(${bi},'${sk}',${i},event)"><span>${i + 1}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:78%;">${txt}</span></div>`;
    }

    function seatHtml(bi, sk, c, i, tot, h) {
      let cls = "seat", body = `<div class="s-name" style="color:#475569;font-size:15px;">空席</div>`;
      const pos = i === 0 ? "1 (ミヨシ)" : (i === tot - 1 ? `${i + 1} (オオドモ)` : `${i + 1}`);
      if (c) {
        if (c.type === "HOLD") { cls += " hold"; body = `<div class="s-name" style="color:#fcd34d;font-size:16px;">🟠 仮押さえ</div>`; }
        else {
          cls += " assigned";
          const bdg = c.note ? c.note.split("/").map(n => `<span class="badge">${n.trim()}</span>`).join("") : "";
          body = `<div class="s-name">${c.name}(${c.count})</div>${bdg ? `<div>${bdg}</div>` : ""}`;
        }
      } else if (h) {
        cls += " " + h;
        body = `<div class="s-name" style="color:${h === 'fit-ok' ? '#6ee7b7' : '#fde047'};font-size:15px;">${h === 'fit-ok' ? '✅ 案内OK' : '⚠️ 分断注意'}</div>`;
      }
      return `<div class="${cls}" onclick="clickSeat(${bi},'${sk}',${i},event)"><div class="s-pos">${pos}</div>${body}</div>`;
    }

    function setView(v) { state.view = v; render(); }

    function selGuest(id) {
      state.holdMode = false;
      state.selId = (state.selId === id) ? null : id;
      setDrawerOpen(false);
      render();
      if (state.selId) {
        const g = state.guests.find(x => x.id === state.selId);
        if (g) toast(`${g.name}様(${g.count}名)を選択：配置する席をタップしてください`);
      }
    }

    function addGuest() {
      const name = document.getElementById("addName").value.trim();
      const count = parseInt(document.getElementById("addCount").value, 10) || 1;
      const note = document.getElementById("addNote").value.trim();
      if (!name) { toast("名前を入力してください"); return; }
      state.guests.push({ id: "g_" + Date.now(), name, count, note });
      document.getElementById("addName").value = ""; document.getElementById("addNote").value = "";
      save(); render(); closeModal("addModal"); toast(`${name}様を追加しました`);
    }

    function openEdit(e, id) {
      e.stopPropagation();
      const g = state.guests.find(x => x.id === id);
      if (!g) return;
      document.getElementById("editId").value = g.id;
      document.getElementById("editName").value = g.name;
      document.getElementById("editCount").value = g.count;
      document.getElementById("editNote").value = g.note || "";
      openModal("editModal");
    }

    function stepEdit(d) {
      const inp = document.getElementById("editCount");
      inp.value = Math.min(13, Math.max(1, (parseInt(inp.value, 10) || 1) + d));
    }

    function saveEdit() {
      const id = document.getElementById("editId").value;
      const name = document.getElementById("editName").value.trim();
      const count = Math.min(13, Math.max(1, parseInt(document.getElementById("editCount").value, 10) || 1));
      const note = document.getElementById("editNote").value.trim();
      if (!name) return;
      const g = state.guests.find(x => x.id === id);
      if (!g) return;
      g.name = name; g.count = count; g.note = note;
      removeGuest(id);
      save(); render(); closeModal("editModal"); toast("変更を保存しました（再配置してください）");
    }

    function delGuest() {
      const id = document.getElementById("editId").value;
      if (!confirm("この予約を削除しますか？")) return;
      removeGuest(id);
      state.guests = state.guests.filter(g => g.id !== id);
      if (state.selId === id) state.selId = null;
      save(); render(); closeModal("editModal"); toast("削除しました");
    }

    function resetSeatsOnly() {
      if (!confirm("全座席を空に戻しますか？")) return;
      state.boats.forEach(b => { b.leftSeats = Array(b.leftCap).fill(null); b.rightSeats = Array(b.rightCap).fill(null); });
      save(); render(); closeModal("setupModal"); toast("座席をリセットしました");
    }

    async function runOcr() {
      const key = localStorage.getItem("gemini_api_key");
      if (!key) { toast("先に⚙配船からAPIキーを入力してください"); return; }
      const f = document.getElementById("ocrFile").files[0];
      if (!f) { toast("画像を選択してください"); return; }
      const fish = document.getElementById("fishInput").value.trim();
      const model = document.getElementById("modelSelect").value || "gemini-4-hydrogen";
      const btn = document.getElementById("ocrBtn"), msg = document.getElementById("ocrMsg");
      btn.disabled = true; btn.textContent = `${model} で解析中...`;
      msg.innerHTML = "";
      try {
        const b64 = await new Promise((res, rej) => {
          const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.onerror = rej; r.readAsDataURL(f);
        });
        const prompt = `釣船「山下丸」の手書き予約表から「${fish || "乗合船"}」の予約を読み取りJSONのみで出力してください。取消線は除外、仕立船は除外。名前の前の点(・)はhasDot:true。竿+数字はrod、カラはkara:true。行ごとに人数を数え記載トータルと検算すること。出力形式:{"writtenTotal":40,"calculatedTotal":40,"isMatch":true,"guests":[{"name":"赤岸","count":3,"hasDot":true,"rod":0,"kara":false}]}`;
        const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: f.type || "image/jpeg", data: b64 } }] }],
            generationConfig: { response_mime_type: "application/json" }
          })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error?.message || `APIエラー (${resp.status})`);
        const parsed = JSON.parse(data.candidates[0].content.parts[0].text);
        state.guests = parsed.guests.map((g, i) => {
          const n = [];
          if (g.hasDot) n.push("前日場所取");
          if (g.rod > 0) n.push(`竿${g.rod}`);
          if (g.kara) n.push("カラ");
          return { id: `ocr_${Date.now()}_${i}`, name: g.name, count: Number(g.count) || 1, note: n.join(" / ") };
        });
        save(); render();
        closeModal("ocrModal");
        setDrawerOpen(true);
        toast(parsed.isMatch
          ? `✅ 検算一致（${parsed.calculatedTotal}名）予約一覧を表示します`
          : `⚠️ 人数不一致：記載${parsed.writtenTotal}名 ≠ 合計${parsed.calculatedTotal}名`);
      } catch (e) {
        msg.innerHTML = `<span style="color:#ef4444;">エラー: ${e.message}</span>`;
      } finally {
        btn.disabled = false; btn.textContent = "AIで解析・検算する";
      }
    }

    function openModal(id) {
      if (id === "setupModal") updateAutoLockBtn();
      if (id === "exportModal") {
        const b32 = state.boats.find(b => b.name === "32号船");
        document.getElementById("expArea").value = b32 ? JSON.stringify({
          date: new Date().toISOString().slice(0, 10), boat: "32号船",
          left: b32.leftSeats.map((c, i) => ({ seatNo: i + 1, name: c && c.type === "ASSIGNED" ? c.name : "", note: c && c.type === "ASSIGNED" ? c.note : "" })),
          right: b32.rightSeats.map((c, i) => ({ seatNo: i + 1, name: c && c.type === "ASSIGNED" ? c.name : "", note: c && c.type === "ASSIGNED" ? c.note : "" }))
        }, null, 2) : "本日の配船に32号船がありません";
      }
      document.getElementById(id).classList.add("open");
    }
    function closeModal(id) { document.getElementById(id).classList.remove("open"); }
    function copyExp() { const a = document.getElementById("expArea"); a.select(); navigator.clipboard.writeText(a.value); toast("コピーしました"); }
    function saveExp() { localStorage.setItem(SHARED_32, document.getElementById("expArea").value); toast("共有領域に保存しました"); }

    init();
  </script>
</body>
</html>
