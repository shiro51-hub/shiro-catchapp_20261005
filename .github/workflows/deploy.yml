name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Precompile JSX with esbuild
        run: |
          set -e
          mkdir -p _site
          cp -r * _site/
          for file in ai_service.js counter.js settings.js report.js app.js; do
            if [ -f "_site/$file" ]; then
              npx -y esbuild "_site/$file" --outfile="_site/${file}.compiled" --loader:.js=jsx --minify
              mv "_site/${file}.compiled" "_site/$file"
            fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
