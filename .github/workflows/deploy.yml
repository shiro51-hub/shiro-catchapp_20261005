name: Deploy GitHub Pages

on:
  push:
    branches:
      - main  # または master（お使いのデフォルトブランチ名）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 公開ディレクトリを artifact としてアップロード（これが抜けていたか失敗していました）
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  # ルートディレクトリのファイルを公開する場合

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
