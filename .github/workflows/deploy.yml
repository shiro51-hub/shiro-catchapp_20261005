- name: Build & Pre-compile JSX
        run: |
          mkdir -p dist
          cp -r . dist/ 2>/dev/null || true
          rm -rf dist/.git dist/.github dist/dist

          # Babelでコンパイルした純粋なJSをdistへ出力
          npm install -D @babel/core @babel/cli @babel/preset-react
          npx babel api.js counter.js settings.js report.js app.js \
            --out-dir dist \
            --presets @babel/preset-react
