name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build & Pre-compile JSX
        run: |
          mkdir -p dist
          cp -r . dist/ 2>/dev/null || true
          rm -rf dist/.git dist/.github dist/dist

          # Babel CLIを一時インストールしてJSXファイルを純粋なJSに事前変換
          npx --yes @babel/cli@7.24.8 @babel/core@7.24.8 @babel/preset-react@7.24.7 \
            api.js counter.js settings.js report.js app.js \
            --out-dir dist \
            --presets @babel/preset-react

          # 公開用 index.html から Babel スタンドアロンの読み込みと text/babel 指定を除去
          sed -i '/babel\.min\.js/d' dist/index.html
          sed -i 's/type="text\/babel"/type="text\/javascript"/g' dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
