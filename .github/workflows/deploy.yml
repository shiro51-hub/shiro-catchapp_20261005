name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build & Pre-compile JSX
        run: |
          mkdir -p dist
          cp -r . dist/ 2>/dev/null || true
          rm -rf dist/.git dist/.github dist/dist

          # 1. 必要なBabelパッケージを正規にローカルインストール
          npm install --no-audit --no-fund --save-dev @babel/core @babel/cli @babel/preset-react

          # 2. babel コマンドを単独実行して純粋なJavaScriptを出力
          npx babel api.js counter.js settings.js report.js app.js \
            --out-dir dist \
            --presets @babel/preset-react

          # 3. 公開用 index.html から Babel を完全に除去し、通常のJS実行に置換
          sed -i 's/<script src="https:\/\/unpkg.com\/@babel\/standalone[^"]*"><\/script>//g' dist/index.html
          sed -i 's/type="text\/babel"/type="text\/javascript"/g' dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
